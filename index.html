<style id="appStyle">
:root{
  /* Anvil Steel: one dark theme for every device */
  color-scheme:dark;
  --bg:#111214; --panel:#191B1E; --panelAlt:#23262A; --field:#0C0D0F; --ink:#E6E7E9; --inkSoft:#9EA2A8;
  --line:#30343A; --alert:#F2717F; --alertBg:#381D24; --good:#62C0A6; --goodBg:#16302A;
  --brass:#D49A5C; --brassBg:#302518; --navy:#C25B2C; --navyInk:#140A06;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
h1,h2,h3{text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.soft{color:var(--inkSoft)}
.app-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px 20px;padding-block:14px;padding-inline:max(16px,calc((100% - 1160px)/2));border-bottom:1px solid var(--line);background:var(--panel)}
.app-title{font-family:var(--serif);font-weight:600;font-size:20px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--panelAlt);padding:4px;border-radius:6px}
.tab{border:0;background:transparent;padding:7px 11px;font-size:13.5px;color:var(--inkSoft);border-radius:4px;cursor:pointer}
.tab[aria-current="page"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 0 var(--line) inset}
.who{white-space:nowrap;margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--inkSoft)}
.main{max-width:1160px;margin:0 auto;padding-block:22px 60px;padding-inline:16px}
.stack{display:flex;flex-direction:column;gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px}
.panel h2{font-family:var(--serif);font-weight:600;font-size:18px;margin:0 0 4px}
.panel h3{font-family:var(--serif);font-weight:600;font-size:16px;margin:14px 0 6px}
.sub{color:var(--inkSoft);font-size:14px;margin:0 0 14px;max-width:72ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.grid>.field>span:first-child{min-height:2.6em;display:flex;align-items:flex-end;line-height:1.3}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px}
.field>span{color:var(--inkSoft);font-size:12.5px}
.input{border:1px solid var(--line);background:var(--field);border-radius:4px;padding:7px 9px;font-size:14px;width:100%;min-width:0}
input.input,select.input{height:38px}
.input.bad{border-color:var(--alert);box-shadow:0 0 0 1px var(--alert)}
textarea.input{min-height:110px;font-family:var(--mono);font-size:12.5px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:5px;padding:9px 16px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--navy);color:var(--navyInk);border-color:var(--navy)}
.btn.brass{background:var(--brass);color:var(--navyInk);border-color:var(--brass);font-weight:600}
.btn.danger{color:var(--alert);border-color:var(--alert)}
.btn.sm{padding:6px 11px;font-size:13px}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--field);padding:7px 13px;border-radius:5px;font-size:13.5px;cursor:pointer;color:var(--inkSoft)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navyInk);border-color:var(--navy)}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.b-good{background:var(--goodBg);color:var(--good)}
.b-bad{background:var(--alertBg);color:var(--alert)}
.b-brass{background:var(--brassBg);color:var(--brass)}
.b-none{background:var(--panelAlt);color:var(--inkSoft)}
.note{border-radius:6px;padding:12px 14px;font-size:14px}
.note.warn{background:var(--alertBg);color:var(--ink);border:1px solid var(--alert)}
.note.ok{background:var(--goodBg);border:1px solid var(--good)}
.note.info{background:var(--brassBg);border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--navyInk);padding:10px 16px;border-radius:6px;font-size:14px;max-width:calc(100% - 32px);z-index:10}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--inkSoft);font-weight:500;font-size:12.5px;white-space:nowrap}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.cut td{border-bottom:2px dashed var(--alert);padding:0;height:0}
tr.cutlabel td{color:var(--alert);font-size:12px;font-weight:600;padding:3px 8px;border-bottom:0}
tr.below td{opacity:.72}
.chips{display:inline-flex;gap:4px}
.chip{font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;font-family:var(--mono)}
.chip.go{background:var(--goodBg);color:var(--good)}
.chip.ng{background:var(--alertBg);color:var(--alert)}
.chip.na{background:var(--panelAlt);color:var(--inkSoft)}
.entry td{padding:4px}
.entry .input{padding:6px 7px;font-size:13.5px}
.entry td:first-child{min-width:150px}
.entry .w-s{width:70px}.entry .w-m{width:84px}.entry .w-l{width:96px}
.layout{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:6px;max-height:560px;overflow:auto}
.list button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:9px 11px;cursor:pointer}
.list button[aria-current="true"]{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.big{font-family:var(--mono);font-size:34px;line-height:1.1;color:var(--navy)}
.gate{min-height:80vh;display:flex;align-items:center;justify-content:center;padding-inline:16px}
.gate .panel{max-width:460px;width:100%}
.subtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tguide{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.tguide>li{display:grid;grid-template-columns:2rem 1fr;gap:10px;align-items:start}
.tg-k{font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.1;color:var(--brass);text-align:center}
.tguide b{font-size:14.5px}
.tguide ul{margin:3px 0 0;padding-left:18px;font-size:14px;line-height:1.5}
.tguide ul li{margin:2px 0}
.guide p{margin:0 0 8px;max-width:78ch}.guide ol.plain,.guide ul.plain{max-width:78ch}.guide ol.plain li{margin:6px 0}
.scenario{font-size:16px;line-height:1.6;max-width:70ch;margin:0 0 14px}
.timer{font-family:var(--mono);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.timer.over{color:var(--alert)}
ol.lines{list-style:none;margin:0;padding:0}
ol.lines>li{display:grid;grid-template-columns:3rem 1fr;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
ol.lines>li:last-child{border-bottom:0}
.lines .n,.lines .num{font-family:var(--serif);font-weight:600;font-size:22px;color:var(--brass)}
.lines .lbl{color:var(--inkSoft);font-size:12.5px}
.lines .val{font-weight:600}
.lines .why{color:var(--inkSoft);font-size:13.5px}
.lines .why ul{margin:2px 0 0;padding-left:18px}
.flag{color:var(--alert);font-weight:600}
.script{background:var(--panelAlt);border-radius:6px;padding:12px 14px;margin-top:14px;font-size:14px}
.script h3{margin:0 0 6px}
.script p{margin:0 0 4px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.steps button{width:100%;display:grid;grid-template-columns:2.2rem 1fr auto;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--field);border-radius:5px;padding:8px 10px;cursor:pointer}
.steps .k{font-family:var(--mono);color:var(--inkSoft)}
.steps button.done{background:var(--goodBg);border-color:var(--good)}
.steps button.oops{background:var(--alertBg);border-color:var(--alert)}
.step-grp{border:1px solid var(--line);border-radius:5px;padding:8px 10px;background:var(--field)}
.step-grp-head{display:grid;grid-template-columns:2.2rem 1fr;gap:10px;margin-bottom:8px}
.step-subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.steps .step-subs button{grid-template-columns:1fr auto;padding:7px 9px;font-size:13.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
ul.plain{margin:4px 0 0;padding-left:20px}
ul.plain li{margin:3px 0}
a{color:var(--navy)}
.recorder{display:flex;flex-wrap:wrap;gap:10px;align-items:end;border-top:1px solid var(--line);padding-top:14px;margin-top:16px}
.recorder .field{min-width:200px;flex:1 1 200px}
/* fire mission trainer &#x2014; host sets --bk-* tokens */
.bk{display:flex;flex-direction:column;gap:14px;color:var(--bk-ink)}
.bk-head{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:stretch}
.bk-scn{margin:0;max-width:70ch;flex:1 1 320px;font-size:1.02em;line-height:1.6;background:var(--bk-alt);border-left:3px solid var(--bk-accent);border-radius:0 8px 8px 0;padding:12px 16px}
.bk-clockbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:150px;border:1px solid var(--bk-line);border-radius:10px;padding:12px 16px;background:var(--bk-panel)}
.bk-clock{font-family:var(--bk-mono);font-size:38px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.bk-clock.over{color:var(--bk-bad)}
.bk-small{font-size:12.5px;color:var(--bk-soft)}
.bk-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bk-btn{font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:6px;cursor:pointer;border:1px solid var(--bk-line);background:var(--bk-panel);color:var(--bk-ink)}
.bk-btn.primary{background:var(--bk-accent);border-color:var(--bk-accent);color:var(--bk-accent-ink)}
.bk-btn:focus-visible,.bk-in:focus-visible{outline:2px solid var(--bk-accent);outline-offset:2px}
.bk-badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:20px;background:var(--bk-alt);color:var(--bk-soft);letter-spacing:.06em;text-transform:uppercase}
.bk-badge.bad{background:var(--bk-bad);color:#0E120D}
.bk-badge.good{background:var(--bk-good);color:#0E120D}
.bk-nogo,.bk-go{border-radius:8px;padding:10px 14px;font-size:14.5px}
.bk-nogo{border:1px solid var(--bk-bad);color:var(--bk-bad);background:var(--bk-alt)}
.bk-go{border:1px solid var(--bk-good);color:var(--bk-good);background:var(--bk-alt)}
.bk-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.bk-grid{grid-template-columns:minmax(0,1fr)}}
.bk-view{background:#0B0C0A;border-radius:12px;padding:8px 8px 10px;box-shadow:inset 0 0 0 1px #24261F}
.bk-view .bk-small{color:#B9BCAE}
.bk-status{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:space-between;align-items:center;margin:2px 4px 8px;font-size:12.5px;color:#B9BCAE}
.bk-status b{color:#E3E6DD;font-weight:600}
.bk-cap{margin:6px 4px 0;font-size:13px;color:#D7D9CE}
.bk-radio{display:flex;flex-direction:column;gap:10px;min-width:0;border:1px solid var(--bk-line);border-radius:12px;padding:10px;background:var(--bk-panel)}
.bk-radio-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--bk-soft);padding:0 2px}
.bk-radio-h .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bk-good);margin-right:6px;vertical-align:1px}
.bk-log{list-style:none;margin:0;padding:2px;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.bk-msg{display:flex;flex-direction:column;gap:2px;padding:7px 11px;border-radius:10px;font-size:14px;max-width:88%}
.bk-msg.fdc{align-self:flex-start;background:var(--bk-alt);border-bottom-left-radius:3px}
.bk-msg.fo{align-self:flex-end;background:color-mix(in srgb,var(--bk-accent) 18%,var(--bk-panel));border:1px solid color-mix(in srgb,var(--bk-accent) 45%,transparent);border-bottom-right-radius:3px}
.bk-who{font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--bk-soft)}
.bk-msg.fo .bk-who{color:var(--bk-accent)}
.bk-note{font-size:13.5px;font-style:italic;color:var(--bk-soft);padding:2px 10px;align-self:center;text-align:center}
.bk-send{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--bk-line);padding-top:10px}
.bk-in{flex:1 1 200px;min-width:0;font:inherit;font-size:15px;padding:10px 12px;border-radius:8px;border:1px solid var(--bk-line);background:var(--bk-field);color:var(--bk-ink)}
.bk-review{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.bk-review .bk-log{max-height:none}
.bk-review .bk-msg{max-width:100%}
.bk-rv{border:1px solid var(--bk-line);border-radius:8px;padding:8px 10px;font-size:14px}
.bk-rv.bad{border-color:var(--bk-bad)}
.bk-fb{font-size:13px;margin-top:4px}
.bk-fb.bad{color:var(--bk-bad)}
.bk-fb.good{color:var(--bk-good)}
.bk-exp{color:var(--bk-ink);margin-top:3px}
.bk-warn{font-size:13.5px;border:1px solid var(--bk-accent);background:var(--bk-alt);color:var(--bk-ink);border-radius:6px;padding:7px 10px}
.bk-seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.bk-seg button{font:inherit;font-size:13.5px;padding:8px 12px;border-radius:6px;border:1px solid var(--bk-line);background:var(--bk-field);color:var(--bk-soft);cursor:pointer}
.bk-seg button[aria-pressed="true"]{background:var(--bk-accent);border-color:var(--bk-accent);color:var(--bk-accent-ink)}

.bk{--bk-ink:var(--ink);--bk-soft:var(--inkSoft);--bk-line:var(--line);--bk-panel:var(--panel);--bk-alt:var(--panelAlt);--bk-field:var(--field);--bk-bad:var(--alert);--bk-good:var(--good);--bk-accent:var(--navy);--bk-accent-ink:var(--navyInk);--bk-mono:var(--mono)}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .18s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}}

.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.pick-item{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--field);cursor:pointer;font-size:14.5px}

const BASE_FIELDS = FIELDS.slice(), BASE_PHYS = PHYS_EVENTS.slice();
const CT_TYPES = {
  timeLow:{label:'Time (m:ss), faster is better', time:true, lower:true},
  timeHigh:{label:'Time (m:ss), longer is better', time:true, lower:false},
  numHigh:{label:'Number, higher is better', time:false, lower:false},

const ctKey = t => 'ct_'+t.id;
const ctField = (t,e) => 'ct_'+t.id+'_'+e.id;
function customTests(){ return DATA.settings.customTests || []; }
function ctByKey(k){ return customTests().find(t=>ctKey(t)===k); }
// Custom tests add their own physical event, entry columns, and import/merge keys.
function rebuildRegistry(){
  FIELDS.length=0; FIELDS.push(...BASE_FIELDS);
  PHYS_EVENTS.length=0; PHYS_EVENTS.push(...BASE_PHYS);
  customTests().forEach(t=>{
    PHYS_EVENTS.push({k:ctKey(t), short:t.short||t.name, name:t.name, custom:true});
    t.events.forEach(e=>{ const ty=CT_TYPES[e.type]||CT_TYPES.numHigh;
      FIELDS.push({k:ctField(t,e), ev:ctKey(t), label:e.name, hint:ty.time?'m:ss':(e.unit||''), type:ty.time?'time':'num', w:'w-m',
        long:`${e.name}${ty.time?' (m:ss)':e.unit?` (${e.unit})`:''}`}); });
  });
  if(typeof MERGE_KEYS!=='undefined'){ MERGE_KEYS.length=0; MERGE_KEYS.push('name','age','sex', ...FIELDS.map(f=>f.k)); }
}
// Points rows for one sex and age group, highest points first. Blank cells are skipped.
function ctColumn(e, sex, age){
  const rows=(e.tables && e.tables[sex==='F'?'F':'M']) || [];
  const bi = e.allAges ? 0 : AGE_BRACKETS.findIndex(b=>b[1]===bracket(age));
  return rows.map(r=>[+r.p, r.v[bi]]).filter(r=>r[1]!=null && !isNaN(r[1])).sort((a,b)=>b[0]-a[0]);
}
// Same rule as the official tables: the highest row the result meets. In between rounds down.
function ctPoints(e, sex, age, v){
  if(v==null || v==='' || isNaN(v)) return null;
  const rows=ctColumn(e,sex,age); if(!rows.length) return null;
  const lower=(CT_TYPES[e.type]||{}).lower;
  for(const [p,t] of rows){ if(lower ? v<=t : v>=t) return p; }
  return 0;
}
function ctMax(e){ let m=0; ['M','F'].forEach(x=>((e.tables||{})[x]||[]).forEach(r=>{ if(r.v.some(v=>v!=null)) m=Math.max(m,+r.p||0); })); return m||100; }
function ctScore(t, s){
  const pts={}; let n=0, sum=0, max=0, fail=false, noTable=false;
  t.events.forEach(e=>{ const v=s[ctField(t,e)], p=ctPoints(e,s.sex,s.age,v); pts[e.id]=p; max+=ctMax(e);
    if(v!=null && p==null) noTable=true;
    if(p!=null){ n++; sum+=p; if(e.min!=null && p<e.min) fail=true; } });
  const complete = t.events.length>0 && n===t.events.length;
  if(complete && t.totalMin!=null && sum<t.totalMin) fail=true;
  return {pts, total:n?sum:null, max, scaled:n?sum/(max||1)*500:null, fail, pass:complete&&!fail, complete, noTable};
}
function physWeight(k){ const w=(DATA.settings.physWeights||{})[k]; return w!=null ? +w : k==='aft'?70 : k==='cft'?30 : 50; }

// What each TCCC step looks like, for graders and for soldiers studying in Practice.
const TCCC_GUIDE = [
  {k:'1', t:'Gain fire superiority', b:['Return fire and suppress the enemy before you move.','Never attempt to rescue a casualty until the scene is safe enough to reach them.']},
  {k:'2', t:'Ask the 3 questions', b:['Call out to the casualty: "Can you return fire? Can you get to cover? Can you apply self-aid?"','If they can, they help themselves: returning fire, moving to cover, or putting on their own tourniquet.']},
  {k:'3', t:'Bound to the battle buddy', b:['Move to the casualty in short rushes, staying low and using cover.']},
  {k:'4', t:'Reassure the casualty', b:['The first thing you do when you reach them.','Let them know you are there and helping, and check that they respond to you.']},
  {k:'5', t:'Apply hasty tourniquets, if needed', b:['For life-threatening bleeding from an arm or leg: tourniquet "high and tight" on the limb, over the uniform.','No limb bleeding means no hasty tourniquet. Move on.']},
  {k:'6', t:'Buddy drag to safety', b:['Drag the casualty back to the start line (cover).']},
  {k:'7', t:'Reassess the tourniquets', b:['Check that each tourniquet is still tight and the bleeding has stopped.','If it has not, tighten it or add a second tourniquet.']},
  {k:'M', t:'Massive bleeding', b:['Rake each part of the body in order, checking for blood every couple of inches: Neck, Armpits, Pelvis, Inguinal (groin), Legs, Arms (NAPILA).']},
  {k:'A', t:'Airway', b:['Head tilt, chin lift. Inspect the airway for an obstruction.','You can remove a visible object only if you can do it without putting your fingers in their mouth and without pushing it deeper. Never do a blind finger sweep.','If you can\'t clear it safely, insert an NPA.']},
  {k:'R', t:'Respiration', b:['Put your hands on the bottom of the ribs and hold your ear above the mouth. Feel for equal rise and fall of the chest and listen for breathing.','Check AVPU here: Alert, Verbal, Pain, Unresponsive.']},
  {k:'C', t:'Circulation', b:['Feel for a radial pulse at the wrist. A pulse there means 80/palp.','No radial pulse: feel for a carotid pulse in the neck. A pulse there but not at the wrist means 60/palp.']},
  {k:'H', t:'Hypothermia and head injuries', b:['Cover the casualty back up with a space blanket or their OCP top so they stay warm and are not at risk of hypothermia.','Check for any head injuries.']},
  {k:'9', t:'9-line MEDEVAC', b:['Call up the 9-line. In testing, lines 1\u20135 must be sent within 10:00 of "Go."']},
];
function tcccGuideHtml(){
  return `<ol class="tguide">${TCCC_GUIDE.map(g=>`<li><span class="tg-k">${esc(g.k)}</span><div><b>${esc(g.t)}</b><ul>${g.b.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></li>`).join('')}</ol>`;
}

// Bring settings saved by older versions up to date without touching choices the admin made.
function migrateSettings(S){
  if(!S.settingsVersion || S.settingsVersion<2){
    if(S.grenadeTotal===8 && S.grenadeGo===6){ S.grenadeTotal=6; S.grenadeGo=6; }
    if(!S.grenadeList) S.grenadeList=DEFAULT_GRENADES;
    if(S.cftBest===1080) S.cftBest=1200;
    if(S.circleBonus==null) S.circleBonus=25;
    if(S.aftFailCut==null) S.aftFailCut=true;
    S.settingsVersion=2;
  }
  if(S.settingsVersion<3){
    // v3: events can be turned on and off. The old "count CFT" switch becomes the CFT event switch.
    // Older versions never had event switches, so start from the defaults (the new events start off).
    S.enabled = Object.assign({}, DEFAULT_ENABLED, {cft: !!S.includeCft});
    delete S.includeCft;
    S.settingsVersion=3;
  }
  if(S.settingsVersion<4){
    // v4: weapons standard is 2:30 for clear, disassemble, assemble, and functions check.
    S.timeLimits = Object.assign({}, S.timeLimits||{});
    WEAPON_KEYS.forEach(k=>{ if(!S.timeLimits[k]) S.timeLimits[k]=150; });
    S.settingsVersion=4;
  }
  if(S.settingsVersion<5){
    // v5: any number of PT tests, mixed by weight. The old AFT/CFT split carries over.

  const wsum = EVENTS.reduce((a,e)=>a+(+S.weights[e.k]||0),0) || 1;
  const aftTotal = n ? EVENTS.reduce((a,e)=>a+(ev[e.k]||0),0) : null;
  const aftW = n ? EVENTS.reduce((a,e)=>a+(ev[e.k]||0)*(+S.weights[e.k]||0),0)/wsum*5 : null;

  const bonus = isOn('throw') && s.circle==='yes' ? (+S.circleBonus||0) : 0;

  // It only matters when the AFT counts.
  const aftFail = aftOn && (EVENTS.some(e=>ev[e.k]!=null && ev[e.k]<60) || (n===5 && aftTotal<300));
  const missing = [];
  if(aftOn) EVENTS.forEach(e=>{ if(ev[e.k]==null) missing.push(e.short); });
  if(cftOn && s.cft==null) missing.push('CFT');
  customTests().forEach(t=>{ if(isOn(ctKey(t)) && !ct[t.id].complete) missing.push(t.short||t.name); });

}

  if(f.type==='grenade'){ const max=DATA.settings.grenadeTotal; if(!/^\d+$/.test(raw)||+raw>max) return {ok:false,msg:`Grenade: 0\u2013${max} correct`}; return {ok:true,val:+raw}; }

const MERGE_KEYS = ['name','age','sex', ...FIELDS.map(f=>f.k)];
// Old Unit Fitness Tracker files are a plain list of people with "history" (scans) and "gender".
function normalizeIncoming(s){
  const tracker = Array.isArray(s.history) && !Array.isArray(s.scans);
  if(tracker){ s.scans=s.history.filter(Boolean); delete s.history; if(s.tryout==null) s.tryout=false; }
  if(!s.sex && s.gender) s.sex = /^f/i.test(s.gender) ? 'F' : 'M';
  delete s.gender;
  if(s.age===0) s.age='';
  return fixSoldier(s);
}
// Scans merge by date (the file wins for the same date), practice merges without duplicates, a PIN already set here is kept.
function mergeHealth(mine, s, plan){
  fixSoldier(mine);
  const byDate={}; mine.scans.forEach(x=>{ if(x&&x.date) byDate[x.date]=x; });
  s.scans.forEach(x=>{ if(!x||!x.date) return; if(!byDate[x.date]) plan.scans++; byDate[x.date]=x; });
  mine.scans=Object.values(byDate).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const seen=new Set(mine.practice.map(e=>e.t+'|'+e.task));
  s.practice.forEach(e=>{ if(!seen.has(e.t+'|'+e.task)){ mine.practice.push(e); seen.add(e.t+'|'+e.task); plan.practice++; } });
  mine.practice.sort((a,b)=>a.t-b.t);
  if(!mine.pinHash && s.pinHash) mine.pinHash=s.pinHash;
  if(s.tryout===true) mine.tryout=true;
}
function readImport(file){
  const reader = new FileReader();
  reader.onload = () => {
    let inc;
    try{ inc = JSON.parse(reader.result); }catch(e){ toast('That file is not valid JSON.'); return; }
    const soldiers = Array.isArray(inc) ? inc : inc && Array.isArray(inc.soldiers) ? inc.soldiers : null;
    if(!soldiers){ toast('That file is not a scorebook or fitness tracker export.'); return; }
    const plan = {added:[], filled:0, conflicts:[], scans:0, practice:0, settings: (!Array.isArray(inc) && inc.kind!=='soldier' && inc.settings) || null, file:file.name};
    const working = clone(DATA.soldiers);
    soldiers.forEach(raw=>{
      if(!raw || !raw.name) return;
      const s = normalizeIncoming(Object.assign({id:raw.id||uid()}, raw));
      const mine = working.find(x=>x.id===s.id) || working.find(x=>normName(x.name)===normName(s.name));
      if(!mine){ plan.added.push(s); plan.scans+=s.scans.length; plan.practice+=s.practice.length; return; }
      mergeHealth(mine, s, plan);
      const fields=[];
      MERGE_KEYS.forEach(k=>{
        const a=mine[k], b=s[k];
        if(b==null||b==='') return;
        if(a==null||a===''){ mine[k]=b; plan.filled++; return; }
        if(String(a)!==String(b)) fields.push({k, mine:a, theirs:b, choice:'mine'});
      });
      if(fields.length) plan.conflicts.push({id:mine.id, name:mine.name, fields});
    });
    plan.working = working;
    if(!plan.conflicts.length){ applyImport(plan); }
    else { STATE.pendingImport = plan; STATE.tab='data'; render(); }
  };
  reader.readAsText(file);
}
function applyImport(plan){
  const working = plan.working;
  plan.conflicts.forEach(c=>{ const s=working.find(x=>x.id===c.id); c.fields.forEach(f=>{ if(f.choice==='theirs') s[f.k]=f.theirs; }); });
  plan.added.forEach(s=>working.push(s));
  DATA.soldiers = working;
  let settingsNote='';
  if(plan.settings && !DATA.settings.adminPinHash && plan.settings.adminPinHash){
    DATA.settings = migrateSettings(Object.assign(clone(DEFAULT_SETTINGS), {settingsVersion:0}, plan.settings)); rebuildRegistry(); settingsNote=' Scoring settings and PINs came with the file.';
  }
  save(); STATE.pendingImport=null; STATE.grid=null;
  toast(`Imported: ${plan.added.length} new, ${plan.filled} blank field(s) filled, ${plan.conflicts.length} conflict(s) resolved${plan.scans?`, ${plan.scans} scan(s)`:''}${plan.practice?`, ${plan.practice} practice entr${plan.practice===1?'y':'ies'}`:''}.${settingsNote}`);
  render();
}

  const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const TENS={twenty:20,thirty:30,forty:40};
  const numWord = n => n<20 ? ONES[n] : Object.keys(TENS).find(k=>TENS[k]===n-n%10) + (n%10 ? '[\\s-]'+ONES[n%10] : '');

  const NUMW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,niner:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90,hundred:100,thousand:1000};
  const NW='(?:'+Object.keys(NUMW).join('|')+')';
  // "four hundred" -> 400, "twenty-eight" -> 28, radio style "four zero" / "one six" -> 40 / 16
  const digitize = t => t.replace(new RegExp('\\b'+NW+'(?:[\\s-]+'+NW+')*\\b','g'), run=>{

    let total=0,cur=0; for(const w of ws){ const v=NUMW[w]; if(v===100) cur=(cur||1)*100; else if(v===1000){ total+=(cur||1)*1000; cur=0; } else cur+=v; }
    return String(total+cur);
  });
  const KEYS = [[/command post/i,['command post','cp','tent']],[/anti-tank/i,['anti-tank','antitank','at team','at tm','atgm','missile']],[/truck/i,['truck','technical']],[/machine gun/i,['machine gun','hmg','mg']],[/infantry/i,['infantry','inf']],[/bmp/i,['bmp']],[/mortar/i,['mortar']],[/btr/i,['btr']],[/sniper/i,['sniper']],[/zsu/i,['zsu','air defense','ada']]];
  const keysFor = tg => { for(const [re,k] of KEYS) if(re.test(tg.N)) return k; return []; };
  const CAS = {'Team':[2,4],'Squad':[6,9],'Platoon':[20,30],'Section':[4,8],'1 vehicle':[2,3],'2 vehicles':[3,5],'3 vehicles':[6,9]};
  const FUZES = ['vt','quick','delay'];
  const SIZES = [400,200,100,50];

  const COUNT = {'Team':'one','Squad':'one','Platoon':'one','Section':'one','1 vehicle':'one','2 vehicles':'two','3 vehicles':'three'};
  const NOUN = tg => ({'Unarmored supply trucks':'enemy supply trucks','Infantry':'enemy infantry '+tg.S.toLowerCase(),'Heavy machine gun':'enemy machine gun team','BMP (light armor)':tg.S==='1 vehicle'?'enemy BMP':'enemy BMPs','Mortars':'enemy mortar section','Infantry (OP)':'enemy infantry team','BTRs (light armor)':'enemy BTRs','Snipers':'enemy sniper team','Air defense (ZSU-23-4)':'enemy ZSU-23-4',
    'Infantry (recon)':'enemy recon team','Technical trucks':'enemy technical trucks','Command post':'enemy command post','Anti-tank team':'enemy anti-tank team'})[tg.N] || 'enemy target';
  const damageDesc = tg => `${COUNT[tg.S]||'one'} ${NOUN(tg)}`;
  const GENERIC = ['enemy','team','tm','squad','sqd','platoon','plt','section','sec','vehicle','veh','troops','personnel','fighters','soldiers','crew','gun','armor','apc','ifv'];
  const describesTarget = (t,tg) => [...keysFor(tg),...GENERIC].some(k=>new RegExp('\\b'+k).test(t));
  /* ---------- spelling guard: catches typos like "shout" for "shot" before a transmission is sent ---------- */
  const VOCAB = ('shot splash out over adjust fire left right add drop for effect ffe grid altitude alt direction dir mils mil this end of mission eom '+
    'destroyed destroy estimated est casualties casualty mto message observer rounds round target number tgt danger close command when ready '+
    'enemy infantry platoon squad team section trucks truck vehicle vehicles machine gun guns mortar mortars sniper snipers bmp btr btrs zsu air defense '+
    'the and with open moving stationary firing digging resting bunker woodline treeline foxholes supply unarmored heavy light armor observation post '+
    'one two three four five six seven eight nine ten quick delay meters over out '+
    'zero niner eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen twenty thirty forty fifty sixty seventy eighty ninety hundred thousand '+
    'plt sqd sec veh hmg apc ifv inf cover forest trees tree gully berm defilade positions position fighting column road dirt field junction edge '+
    'behind under near across along beside small single lone crates idling offloading building buildings house village hill ridge ridgeline '+
    'prone walking running dug concealed personnel troops fighters soldiers crew enemies approximately about est estimate').split(' ');
  // every word used to describe any target (names, SNAP, activity, protection) also counts as known
  TARGETS.forEach(tg=>[tg.t,tg.snap,tg.S,tg.N,tg.A,tg.P].join(' ').toLowerCase().replace(/[^a-z]+/g,' ').split(' ').forEach(w=>w&&VOCAB.push(w)));
  function dist(a,b){ const m=a.length,n=b.length; if(Math.abs(m-n)>2) return 9; const d=[];

  function spellCheck(text, known){
    const flags=[];
    for(const w of (String(text).toLowerCase().match(/[a-z]+/g)||[])){
      if(w.length<3 || known.has(w)) continue;
      const lim = w.length<=5 ? 1 : 2; let best=null, bd=9;
      for(const k of known){ if(k.length<3) continue; const x=dist(w,k); if(x<bd){ bd=x; best=k; } }

  }
  function corrText(e){
    return `${e.ffe?'':'Adjust fire, '}${e.dev?cap(e.dev.dir)+' '+e.dev.m+', ':''}${cap(e.rng.dir)} ${e.rng.m}${e.ffe?', Fire for effect':''}, Over.`;
  }

  function newMission(fixed, mode){
    mode = mode==='advanced' ? 'advanced' : 'standard';
    const tg=pick(TARGETS), grid=mgrs(), alt=ri(5,99)*10, dir=pad(ri(1,63)*100,4);
    const scene=pick(SCENES), light=pick(LIGHT), seed=Math.floor(Math.random()*1e9);
    const obs=fixed?'Pony 1-6':unitCS(), fdc=fixed?'Ripley 40':stationCS();
    const dist=ri(8,55)*100, ot=otFactor(dist);
    const friend=null, dc=false, atMy=false;   // bare-bones version: no danger close or timing control
    const unit=pick(['R','G']), rounds=mode==='advanced'?ri(5,6):5, tgt=pick(['AA','AB','AC','AD','AF'])+pad(ri(1000,9999),4);
    const [lo,hi]=CAS[tg.S]||[3,6], cas=ri(lo,hi);
    // Simulated impacts. Range error r (m, + = over) is never a multiple of 50, so every round is clearly over or short.
    let r=pick([25,75,125,175,225,275,325,375])*pick([1,-1]);
    let dev=Math.random()<0.15 ? 0 : pick([10,20,30,40,50,60,70,80])*pick([1,-1]);   // mils, + = right of target
    const bursts=[], expect=[];
    const r0=r, dev0=dev;
    for(let k=0;k<4;k++){
      bursts.push({dev,r});
      const m=Math.abs(dev)*ot;
      const devC = m>=30 ? {dir:dev>0?'left':'right', m} : null;
      expect.push({dev:devC, rng:{dir:r>0?'drop':'add', m:SIZES[k]}, ffe:k===3, spot:{dev, r, ot, m}});
      if(devC) dev = Math.random()<0.3 ? pick([10,-10]) : 0;
      r += r>0 ? -SIZES[k] : SIZES[k];

    bursts.push({dev:0, r:0, ffe:true});

    const loc=pick([`You plot the target at grid ${grid} at an altitude of ${alt}m.`,`You laser the target and determine it is at grid ${grid}, altitude ${alt}m.`,`You pull out your map and plot the target at grid ${grid}, altitude ${alt}m.`]);
    const text=[`${pick(OBS)} ${tg.t}.`, scene.say, light.say, loc, `The target is about ${dist} meters from your position.`,
      pick([`The direction from your position to the target is ${dir} mils.`,`Your compass reads ${dir} mils.`]),
      friend?`A friendly squad is maneuvering about ${friend} meters from the target.`:'',
      atMy?pick(['You want to control exactly when the guns fire.','You want to hold the rounds until you give the word.']):'',
      `You are ${obs}, and your FDC is ${fdc}.`, 'Call for fire, adjust the rounds onto the target, and end the mission.'].filter(Boolean).join(' ');

      t1:`${fdc}, this is ${obs}, Adjust Fire, Over.`,

      mtoFdc:`${obs}, this is ${fdc}, MTO: ${unit}, ${tg.f} i/e, ${rounds} rounds, target number ${tgt}, Over.`,

  function roundSteps(steps, i, ffe){

  function check(M, st, raw, secs){

  /* ---------- binocular view (fixed palette: it's a picture through glass, same in both themes) ---------- */

  const INK='#23251C', INK2='#3E4133', HL='#5A5D4B';
  const man = (x,y,pose,c=INK) => {
    const s=`stroke="${c}" stroke-width="1.3" stroke-linecap="round" fill="none"`;
    if(pose==='prone') return `<g><ellipse cx="${x}" cy="${y-1.3}" rx="4.2" ry="1.3" fill="${c}"/><circle cx="${x+4.6}" cy="${y-2}" r="1.4" fill="${c}"/><line x1="${x+5}" y1="${y-2.2}" x2="${x+9}" y2="${y-2.6}" ${s} stroke-width="0.9"/></g>`;

  function view(M, idx, hint){

  /* ---------- instance ---------- */
  function create(opts){
    const I={opts:opts||{}, mode:(opts&&opts.mode)||'standard', M:null, started:false, startedAt:null, t3At:null, pos:0, log:[], errors:[], done:false, hint:false, burstIdx:null, el:null, draft:''};
    I.M = newMission(!!I.opts.fixed, I.mode);
    I.setMode = m=>{ if(I.started) return; I.mode=m; I.M=newMission(!!I.opts.fixed, m); I.draw(); };
    I.known = ()=>{ const k=new Set(VOCAB); (I.M.text+' '+I.log.filter(m=>m.who!=='FO').map(m=>m.text).join(' ')).toLowerCase().match(/[a-z]+/g).forEach(w=>k.add(w)); return k; };
    I.result = ()=> I.errors.length ? 'nogo' : (I.done ? 'go' : null);
    function advance(){
      // Play FDC lines until it's the observer's turn
      while(I.pos<I.M.steps.length){
        const st=I.M.steps[I.pos];
        const lines = st.fdcs || (st.fdc ? [st.fdc] : []);
        if(lines.length && !st._said){ lines.forEach(l=>I.log.push({who:'FDC', text:l})); st._said=true; if(st.burst!=null) I.burstIdx=st.burst; }
        if(st.bda && !st._noted){ st._noted=true; I.log.push({who:'note', text:`The smoke clears. Through your binoculars you see the target is destroyed. You estimate ${I.M.cas} enemy casualties.`}); }
        return;
      }
    }
    I.start = ()=>{ I.started=true; I.startedAt=Date.now(); advance(); I.draw(); };
    I.send = (text)=>{
      if(I.done) return;
      const st=I.M.steps[I.pos];
      const secs = st.k==='t3' && I.startedAt ? (Date.now()-I.startedAt)/1000 : null;
      if(st.k==='t3') I.t3At=Date.now();
      const errs=check(I.M, st, text, secs);
      I.log.push({who:'FO', text, errs, expect:expected(I.M,st), why:why(I.M,st), label:st.label});
      errs.forEach(x=>I.errors.push(`${st.label}: ${x}`));
      if(!errs.length && st.k==='corr' && I.M.mode==='standard'){
        const x=I.M.expect[st.i], dv=norm(text).match(/\b(left|right)\s*(\d+)/);
        if(!x.dev && dv && x.spot.dev!==0){
          const d0=x.spot.dev;
          for(let j=st.i+1;j<4;j++){ if(I.M.bursts[j].dev===d0){ I.M.bursts[j].dev=0; const ej=I.M.expect[j]; ej.dev=null; ej.spot.dev=0; ej.spot.m=0; } }
        }
      }
      if(!errs.length && st.k==='corr' && I.M.mode==='advanced'){
        const M=I.M, b=M.bursts[st.i], p=advParse(digitize(norm(text)));
        let dev=b.dev, r=b.r;
        if(p.dv){ dev += (p.dv[1]==='left'?-1:1)*(+p.dv[2])/M.ot; if(!p.ffe && Math.abs(b.dev)*M.ot>=30 && Math.random()<0.3) dev=pick([10,-10]); }
        if(p.rg) r += (p.rg[1]==='drop'?-1:1)*(+p.rg[2]);
        dev=Math.round(dev);
        if(p.ffe){
          const offLat=Math.abs(dev)*M.ot;
          M.bursts.push({dev, r, ffe:true});
          if(Math.abs(r)>50 || offLat>=30){ const msg=`Fire for effect landed ${Math.abs(r)}m ${r>0?'over':'short'}${offLat?` and ${offLat}m ${dev>0?'right':'left'}`:''}, outside the effect area.`; errs.push(msg); I.errors.push(`${st.label}: ${msg}`); I.log[I.log.length-1].errs=errs; I.burstIdx=M.bursts.length-1; }
          else M.steps.push(eomStep(M.bursts.length-1));
        } else if(st.i+1>=M.rounds){
          const msg=`Out of rounds: the MTO gave ${M.rounds} adjusting rounds, and fire for effect wasn't called by the last one.`;
          errs.push(msg); I.errors.push(`${st.label}: ${msg}`); I.log[I.log.length-1].errs=errs;
        } else {
          M.bursts.push({dev, r});
          roundSteps(M.steps, st.i+1, false);
        }
      }
      I.pos++;
      if(errs.length){ I.done=true; I.failedAt=st.label; if(I.opts.onResult) I.opts.onResult('nogo', I); I.draft=''; I.draw(); return; }
      if(I.pos>=I.M.steps.length){
        I.done=true;
        I.log.push({who:'FDC', text:`End of mission, ${damageDesc(I.M.tg)} destroyed, estimated ${I.M.cas} enemy casualties, Out.`});
        if(I.opts.onResult) I.opts.onResult(I.result(), I);
      } else advance();
      I.draft=''; I.draw(true);
    };
    I.draw = (focus)=>{
      const el=I.el; if(!el) return;
      const M=I.M, st=M.steps[I.pos], res=I.result();
      const status = !I.started ? '' : res==='nogo' ? `<span class="bk-badge bad">NO-GO</span>` : res==='go' ? `<span class="bk-badge good">GO</span>` : `<span class="bk-badge">In progress</span>`;
      el.innerHTML = `<div class="bk">

        </div>

              <button type="button" data-bkm="advanced" aria-pressed="${I.mode==='advanced'}">Advanced: any corrections</button>
            </div>
            <button class="bk-btn primary" id="bkStart">Start mission (starts the 5:00 clock)</button></div>
            <p class="bk-small" style="margin:0">${I.mode==='standard'?'Successive bracketing: Add/Drop 400, 200, 100, then 50 with fire for effect.':'Make whatever corrections you judge best, but call fire for effect before you run out of the rounds given in the MTO.'}</p>` : `
        ${res==='nogo' ? `<div class="bk-nogo"><b>No-Go.</b> Mission ended at: ${esc(I.failedAt)}.</div>`:''}
        ${res==='go' ? `<div class="bk-go"><b>Go.</b> Mission complete.</div>`:''}

            ${view(M, I.burstIdx, I.hint)}
          </div>
          <div class="bk-radio"><div class="bk-radio-h"><span><span class="dot"></span>Radio \u00B7 ${esc(M.fdc)}</span><span>${esc(M.obs)}</span></div>
            <ol class="bk-log" id="bkLog">${I.log.map(m=> m.who==='note' ? `<li class="bk-note">${esc(m.text)}</li>` :
              `<li class="bk-msg ${m.who==='FO'?'fo':'fdc'}"><span class="bk-who">${m.who==='FO'?'You':'FDC'}</span><span>${esc(m.text)}</span></li>`).join('')}</ol>
            ${I.done ? `<div class="bk-row"><button class="bk-btn" id="bkSol">Grader review</button><button class="bk-btn" id="bkNew">New mission</button></div><div id="bkSolBox" hidden></div>` : `
            <div class="bk-send" id="bkForm">
              <label class="bk-small" for="bkIn">Your transmission: ${esc(st.label)}</label>
              ${I.warn?`<div class="bk-warn" role="alert">Check spelling: ${I.warn.map(f=>`\u201C${esc(f.w)}\u201D (did you mean \u201C${esc(f.s)}\u201D?)`).join(', ')}. Fix it, or press Send again to send it as typed.</div>`:''}
              <div class="bk-row"><input class="bk-in" id="bkIn" autocomplete="off" spellcheck="false" value="${esc(I.draft)}" placeholder="Type what you would say on the radio"><button class="bk-btn primary" type="button" id="bkSend">Send</button></div>
            </div>`}
          </div>
        </div>`}
      </div>`;
      const s=el.querySelector('#bkStart'); if(s) s.onclick=I.start;
      el.querySelectorAll('[data-bkm]').forEach(b=>b.onclick=()=>I.setMode(b.dataset.bkm));
      const f=el.querySelector('#bkForm'); if(f){ const inp=el.querySelector('#bkIn'); inp.oninput=()=>{ I.draft=inp.value; };
        // Plain button + Enter key, not a <form>: Claude's sandbox blocks form submission.
        const submit=()=>{ const v=inp.value; if(!v.trim()) return;
          if(I.warnedText!==v){ const fl=spellCheck(v, I.known()); if(fl.length){ I.warn=fl; I.warnedText=v; I.draft=v; I.draw(true); return; } }
          I.warn=null; I.warnedText=null; I.send(v); };
        el.querySelector('#bkSend').onclick=submit;
        inp.onkeydown=ev=>{ if(ev.key==='Enter' && !ev.isComposing){ ev.preventDefault(); submit(); } };
        if(focus) inp.focus({preventScroll:true}); }
      const lg=el.querySelector('#bkLog'); if(lg) lg.scrollTop=lg.scrollHeight;
      const sb=el.querySelector('#bkSol'); if(sb) sb.onclick=()=>{ const box=el.querySelector('#bkSolBox'); box.hidden=!box.hidden;
        if(!box.hidden){
          const fo=I.log.filter(m=>m.who==='FO');
          box.innerHTML=`<div class="bk-review">${fo.map(m=>`<div class="bk-rv ${m.errs.length?'bad':''}"><div class="bk-small">${esc(m.label)}</div><div>Sent: ${esc(m.text)}</div>${m.errs.length?`<div class="bk-fb bad">${m.errs.map(esc).join('<br>')}<div class="bk-exp">Correct: ${esc(m.expect)}</div>${m.why?`<div class="bk-small">${esc(m.why)}</div>`:''}</div>`:`<div class="bk-fb good">Correct</div>`}</div>`).join('')}
            <p class="bk-small">OT factor ${M.ot} (${M.dist}m). Full correct mission:</p>
            <ol class="bk-log">${M.steps.map(st=>`${(st.fdcs||(st.fdc?[st.fdc]:[])).map(l=>`<li class="bk-msg fdc"><span class="bk-who">FDC</span><span>${esc(l)}</span></li>`).join('')}<li class="bk-msg fo"><span class="bk-who">FO</span><span>${esc(expected(M,st))}</span>${st.k==='corr'?`<div class="bk-small">${esc(why(M,st))}</div>`:''}</li>`).join('')}</ol></div>`;
        }
        sb.textContent=box.hidden?'Grader review':'Hide review'; };
      const nb=el.querySelector('#bkNew'); if(nb) nb.onclick=()=>{ if(I.opts.onNew) I.opts.onNew(); };
      I.tick();
    };
    I.tick = ()=>{
      const c=I.el && I.el.querySelector('#bkClock'); if(!c) return;
      const used = I.startedAt ? ((I.t3At||Date.now())-I.startedAt)/1000 : 0, left=300-Math.floor(used);

  }
  setInterval(()=>{ if(Bracket._live && Bracket._live.startedAt && !Bracket._live.t3At) Bracket._live.tick(); }, 250);

})();

function testMed(el, k){
  const M=MED[k]; STATE.med=STATE.med||{};
  if(!STATE.med[k]) STATE.med[k]={sc:M.gen(!STATE.randomCalls), seq:[], show:false};
  const R=STATE.med[k], sc=R.sc, seq=R.seq;
  const expected=sc.steps.map((s,i)=>s.applies?i:null).filter(i=>i!=null), done=seq.filter(i=>sc.steps[i].applies);
  let firstBad=-1; for(let i=0;i<done.length;i++){ if(done[i]!==expected[i]){ firstBad=i; break; } }
  const maxDone = done.length?Math.max(...done):-1, missed=new Set(firstBad>=0?expected.filter(i=>!done.includes(i)&&i<maxDone):[]);
  const complete = firstBad<0 && done.length===expected.length, verdict = firstBad>=0 ? 'nogo' : complete ? 'go' : null;
  el.innerHTML=`<div class="stack">
    <div class="panel"><h2>${esc(M.title)}</h2>
      <p class="sub">${esc(M.setup)} Read the scenario, say "Go," and tap each step as the soldier does it. Steps that don't apply to this casualty are dimmed. Go means every step that applies, in order, with no harm to the casualty. Standard: ${esc(M.task)}.</p>
      <p class="scenario">${esc(sc.text)}</p>
      <div class="row"><button class="btn" id="mdNew">New scenario</button><button class="btn" id="mdShow" aria-expanded="${R.show}">${R.show?'Hide':'Show'} what right looks like</button></div>
    </div>
    <div class="two">
      <div class="panel"><h2>Order tracker</h2>
        <ol class="steps">${sc.steps.map((s,i)=>{ const o=seq.indexOf(i), di=done.indexOf(i);
          const cls = !s.applies ? '' : missed.has(i) ? 'oops' : o<0 ? '' : (firstBad>=0 && di>=firstBad) ? 'oops' : 'done';
          const tag = !s.applies ? 'not needed' : missed.has(i) ? 'skipped' : o<0 ? '' : '#'+(o+1);
          return `<li><button data-mstep="${i}" class="${cls}" ${s.applies?'':'style="opacity:.55"'}><span class="k">${esc(s.k)}</span><span>${esc(s.t)}</span><span class="mono soft">${tag}</span></button></li>`; }).join('')}</ol>
        <div class="row" style="margin-top:10px;justify-content:space-between">
          <span>${!seq.length?'<span class="soft">Nothing tapped yet.</span>':firstBad>=0?`<span class="flag">Out of order: "${esc(sc.steps[done[firstBad]].t)}" came before "${esc(sc.steps[expected[firstBad]].t)}".</span>`:complete?'<span class="badge b-good">All steps, in order</span>':`<span class="soft">${done.length} of ${expected.length} done, in order so far.</span>`}</span>
          <button class="btn sm" id="mdClear">Clear</button></div>
        <p class="sub" style="margin:10px 0 0;font-size:13px">Mark No-Go below for anything that harms the casualty even if the order is right: ${k==='fracture'?'straightening or repositioning the limb, a cravat or swathe over the fracture, or pushing a bone back in':'touching an electrical casualty bare-handed, pulling off stuck clothing, breaking blisters, putting grease or ointment on the burn, or dressing the face'}.</p>
      </div>
      <div class="panel">${R.show?`<h2>What right looks like for this casualty</h2><ul class="plain">${sc.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul><h3>Each step</h3>${medGuideHtml(M.guide)}`
        :`<h2>Steps in order</h2><p class="sub">What each step looks like. "Show what right looks like" adds this casualty's specifics.</p>${medGuideHtml(M.guide)}`}</div>
    </div>
    <div class="panel" style="padding-top:4px">${recorder(k, goButtons(k))}</div>
  </div>`;
  el.querySelectorAll('[data-mstep]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.mstep, at=seq.indexOf(i); if(at>=0) seq.splice(at,1); else seq.push(i); render(); });
  $('mdClear').onclick=()=>{ R.seq=[]; render(); };
  $('mdNew').onclick=()=>{ STATE.med[k]={sc:M.gen(!STATE.randomCalls), seq:[], show:false}; render(); };
  $('mdShow').onclick=()=>{ R.show=!R.show; render(); };
  wireRecorder(k, wireGoButtons(el.querySelector('.recorder')));
  if(verdict){ const b=el.querySelector(`.recorder [data-go="${verdict}"]`); if(b) b.click(); }
}

function genSpot(fixed){
  const o=pick(OBSERVED),[tz,tzn]=pick(TZS),[mSee,mAns]=pick(METHODS),{cs,hq}=calls(fixed),grid=mgrs();
  const seen=randTime(), sent=new Date(seen.getTime()+ri(4,25)*60000);
  const bonus=Math.random()<0.35;
  let H,N,dist; if(bonus){H=pick([60,66,68,70,72]);N=ri(4,12);dist=Math.round(25.4*H/N);}
  const text=[`At ${spoken(seen,tzn)}, you are observing with ${mSee} from a hidden observation post when you spot ${o.see}.`,
    `They are at grid ${grid}. You have not been seen and have not made contact.`,
    `You send your report at ${hhmm(sent)} ${tzn}.`,
    `Your call sign is ${cs}, and your higher is ${hq}.`,'Send a SPOT report.',
    bonus?`Bonus: in your binoculars the nearest enemy is ${N} mils tall. If he is ${H} inches tall, how far away is he?`:''].filter(Boolean).join(' ');
  const lines=[
    [1,'Date time group of report',dtg(sent,tz),'DD HHMM (time zone) MONYY, when you send the report.'],
    [2,'Call sign and method of observation',`${cs} \u2013 ${mAns}`,''],
    [3,'Size',o.S,''],
    [4,'Activity',o.A,''],
    [5,'Location',grid,'Enemy grid.'],
    [6,'Uniform',o.U,''],
    [7,'Time of observation',dtg(seen,tz),'DTG of when you saw them, not when you sent the report.'],
    [8,'Equipment',o.E,''],
    [9,'Assessment of activity',o.assess,'Your judgment of the enemy\u2019s purpose. Wording can vary.'],
    [10,'Action recommendation',o.rec,`Also reasonable: ${esc(o.alt)}.`],
    [11,'Authentication','Your initials','Per your slides, authenticate with your initials.']
  ];
  const script=[`${hq}, this is ${cs}, SPOT report to follow, over.`,...lines.map(l=>`Line ${l[0]}, ${l[2]}`),'Over.'];
  let html=renderLines('Answer: SPOT report',lines,'Full call',script);
  if(bonus) html+=`<div class="script"><h3>Bonus: mil relation</h3><p>(25.4 \u00D7 ${H} in) \u00F7 ${N} mils = ${dist} meters</p></div>`;
  const ck=['dtg','free','free','free','grid','free','dtg','free','free','free','free'];
  return {text,html,script,key:lines.map((l,i)=>({n:l[0],label:l[1],ans:l[2],why:l[3],check:ck[i]}))};
}

function genTccc(fixed){
  const sc=genTCCC(fixed), tq=sc.inj.tq;
  const note={4: tq?`Needed: ${tq}, high and tight.`:'Not needed for this casualty; skip it.', 6: tq?'Check the tourniquet is still tight and the bleeding has stopped.':'No tourniquet to reassess; skip it.'};
  const march=sc.inj.march.concat(['H: Prevent hypothermia. Keep him covered and off the ground.']);
  const rows=[];
  TCCC_STEPS.forEach((st,i)=>{
    if(st.grp){ if(TCCC_STEPS[i-1] && TCCC_STEPS[i-1].grp) return;
      rows.push(['M','Tactical field care (MARCH)','Massive bleeding sweep, in order: '+TCCC_STEPS.filter(x=>x.grp).map(x=>x.s).join(', '), esc(march.filter(m=>m.startsWith('M')).join(' '))]); return; }
    rows.push([st.k, i<7?'Care under fire':st.k==='9'?'Evacuation':'Tactical field care (MARCH)', st.t,
      note[i] ? esc(note[i]) : ['A','R','C','H'].includes(st.k) ? esc(march.filter(m=>m.startsWith(st.k+':')).join(' ')) : '']);
  });
  const html = renderLines('Answer: TCCC, in order', rows, 'Casualty-specific notes', march)

const PKEY='teamTryoutScorebook_practice_v1';
const PTASKS=[
  ['medevac','9-line MEDEVAC'],['cff','Call for fire: initial call'],['mission','Call for fire: full mission'],['spot','SPOT report'],['salute','SALUTE report'],
  ['tccc','TCCC'],['fracture','Fractures'],['burn','Burns'],['grenade','Grenade ID'],['m249','M249 order'],['m240b','M240B order'],['m4','M4 order'],
];
let PMEM={log:[]};   // used if the browser won't let the page save
let PSTORE=null;     // set when a soldier is signed in: progress goes on their profile instead of this device
function pLoad(){ if(PSTORE) return PSTORE.load(); try{ const d=JSON.parse(localStorage.getItem(PKEY)||'null'); if(d && Array.isArray(d.log)) return d; }catch(e){} return PMEM; }
function pSave(d){ if(PSTORE){ PSTORE.save(d); return; } PMEM=d; try{ localStorage.setItem(PKEY, JSON.stringify(d)); }catch(e){} }
function precord(task, ok, detail){ const d=pLoad(); d.log.push({t:Date.now(), task, ok:!!ok, detail:detail||''}); if(d.log.length>2000) d.log=d.log.slice(-2000); pSave(d); }
const pDay = t => { const d=new Date(t); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
function pWhen(t){ const d=new Date(t), now=new Date(), days=Math.round((new Date(now.toDateString())-new Date(d.toDateString()))/864e5);
  const hm=d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); return days===0?`Today ${hm}`:days===1?`Yesterday ${hm}`:d.toLocaleDateString([], {month:'short', day:'numeric'}); }
function progressHtml(given){
  const log=given||pLoad().log, embed=!!given;
  if(!log.length) return `<h2>My progress</h2><p class="sub" style="margin:0 0 6px">Nothing yet. Every scenario you check, fire mission you run, grenade quiz, and weapons order you finish is added here.</p><p class="pg-note">${PSTORE?'Saved to your profile.':'Saved on this device only. It is not part of the tryout scores.'}</p>`;
  const days=new Set(log.map(e=>pDay(e.t))).size, total=log.length, good=log.filter(e=>e.ok).length;
  let streak=0; { const set=new Set(log.map(e=>pDay(e.t))); const d=new Date(); if(!set.has(pDay(d))) d.setDate(d.getDate()-1); while(set.has(pDay(d))){ streak++; d.setDate(d.getDate()-1); } }
  const rows=PTASKS.map(([k,label])=>{
    const L=log.filter(e=>e.task===k); if(!L.length) return `<tr class="pg-none"><td>${esc(label)}</td><td class="pg-n">0</td><td></td><td></td><td class="soft">Not tried yet</td></tr>`;
    const n=L.length, ok=L.filter(e=>e.ok).length, last10=L.slice(-10), r10=last10.filter(e=>e.ok).length;
    let run=0; for(let i=L.length-1;i>=0 && L[i].ok;i--) run++;
    return `<tr><td>${esc(label)}</td><td class="pg-n">${n}</td><td class="pg-n">${Math.round(ok/n*100)}%</td>
      <td><span class="pg-dots" aria-label="Last ${last10.length}: ${r10} right">${last10.map(e=>`<i class="${e.ok?'ok':'bad'}" title="${esc(pWhen(e.t)+(e.detail?': '+e.detail:''))}"></i>`).join('')}</span></td>
      <td class="soft">${run>1?`${run} in a row`:''}${run>1?' \u00B7 ':''}${pWhen(L[L.length-1].t)}</td></tr>`; }).join('');
  const weak=PTASKS.map(([k,label])=>{ const L=log.filter(e=>e.task===k).slice(-10); return L.length>=3?{label, r:L.filter(e=>e.ok).length/L.length}:null; }).filter(x=>x && x.r<0.7).sort((a,b)=>a.r-b.r);
  const recent=log.slice(-12).reverse();
  return `<h2>My progress</h2>
    <div class="pg-tiles">
      <div><b>${total}</b><span>attempts</span></div><div><b>${Math.round(good/total*100)}%</b><span>right overall</span></div>
      <div><b>${days}</b><span>day${days===1?'':'s'} practiced</span></div><div><b>${streak}</b><span>day streak</span></div>
    </div>
    ${weak.length?`<p class="pg-focus"><b>Work on:</b> ${weak.map(w=>`${esc(w.label)} (${Math.round(w.r*100)}% of your last tries)`).join(', ')}.</p>`:''}
    <div class="pg-scroll"><table class="pg-table"><thead><tr><th>Task</th><th class="pg-n">Tries</th><th class="pg-n">Right</th><th>Last 10</th><th>Streak \u00B7 last</th></tr></thead><tbody>${rows}</tbody></table></div>
    <h3 class="pg-h">Recent</h3>
    <ol class="pg-recent">${recent.map(e=>`<li><span class="pg-mark ${e.ok?'ok':'bad'}">${e.ok?'Right':'Missed'}</span><span>${esc((PTASKS.find(p=>p[0]===e.task)||[0,e.task])[1])}${e.detail?` <span class="soft">\u00B7 ${esc(e.detail)}</span>`:''}</span><span class="soft">${esc(pWhen(e.t))}</span></li>`).join('')}</ol>
    ${embed?'':`<p class="pg-note">${PSTORE?'Saved to your profile. Leadership can see it; graders can\'t.':'Saved on this device only, in this browser. It is not part of the tryout scores and graders can\'t see it. Sign in as a soldier to save practice to your profile.'}</p>
    <div class="actions" style="margin-top:10px"><button class="btn" id="pgReset">Clear my progress</button></div><div id="pgMsg"></div>`}`;
}

function wireGate(){
  const S=DATA.settings, g=STATE.gate;
  const on=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  on('gAdmin',()=>{ STATE.gate={step:S.adminPinHash?'adminLogin':'adminCreate',error:''}; render(); });
  on('gTester',()=>{ if(S.testerPinHash){ STATE.gate={step:'testerLogin',error:''}; render(); } else enter('tester'); });
  on('gBack',()=>{ STATE.gate={step:'choose',error:''}; render(); });
  on('gPractice',()=>{ STATE.session={role:'practice'}; render(); });
  on('gSoldier',()=>{ STATE.gate={step:'soldierPick',error:''}; render(); });
  on('gsBack',()=>{ STATE.gate={step:'soldierPick',error:''}; render(); });
  on('gsNew',()=>{ STATE.gate={step:'soldierNew',error:''}; render(); });
  const enterSoldier = x => { STATE.session={role:'soldier', soldierId:x.id}; STATE.tab = x.scans.length ? 'myhealth' : 'mylog'; render(); };
  if(g.step==='soldierPick'){
    const draw=q=>{ q=normName(q); const L=DATA.soldiers.slice().sort((a,b)=>a.name.localeCompare(b.name)).filter(x=>normName(x.name).includes(q));
      $('gsList').innerHTML = L.map(x=>`<button data-sid="${x.id}"><span>${esc(x.name)}</span></button>`).join('') || '<p class="sub">No matches. Use "I\'m not on this list".</p>';
      $('gsList').querySelectorAll('[data-sid]').forEach(b=>b.onclick=()=>{ STATE.gate={step:'soldierPin',error:'',sid:b.dataset.sid}; render(); }); };
    draw(''); $('gsQ').oninput=e=>draw(e.target.value);
  }
  if(g.step==='soldierPin'){
    const x=soldierById(g.sid), go=()=>{
      const p1=$('gsP1').value;
      if(x.pinHash){ if(hash(p1)!==x.pinHash){ g.error='Incorrect PIN.'; render(); return; } enterSoldier(x); return; }
      if(p1.length<4){ g.error='PIN must be at least 4 digits.'; render(); return; }
      if(p1!==$('gsP2').value){ g.error='The PINs do not match.'; render(); return; }
      x.pinHash=hash(p1); save(); enterSoldier(x); };
    $('gsGo').onclick=go; $('gsP1').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } }; $('gsP1').focus();
  }
  if(g.step==='soldierNew'){
    $('gsCreate').onclick=()=>{
      const name=$('gsName').value.trim(), age=$('gsAge').value.trim(), p1=$('gsP1').value;
      if(!name){ g.error='Name is required.'; render(); return; }
      if(DATA.soldiers.some(x=>normName(x.name)===normName(name))){ g.error=`${name} is already on the list. Go back and pick your name.`; render(); return; }
      if(age && (!/^\d+$/.test(age)||+age<16||+age>70)){ g.error='Age must be a number from 16 to 70.'; render(); return; }
      if(p1.length<4){ g.error='PIN must be at least 4 digits.'; render(); return; }
      if(p1!==$('gsP2').value){ g.error='The PINs do not match.'; render(); return; }
      const x=fixSoldier({id:uid(), name, age:age?+age:'', sex:$('gsSex').value, tryout:false, pinHash:hash(p1)}); FIELDS.forEach(f=>x[f.k]=null);
      DATA.soldiers.push(x); save(); enterSoldier(x);
    };
  }
  on('gCreate',()=>{
    const a=$('p1').value, b=$('p2').value;
    if(a.length<4){ g.error='PIN must be at least 4 digits.'; render(); return; }
    if(a!==b){ g.error='The PINs do not match.'; render(); return; }
    S.adminPinHash=hash(a); save(); enter('admin');
  });
  const f=$('gForm');
  // Plain button + Enter key, not a <form>: Claude's sandbox blocks form submission.
  if(f){ const go=()=>{ const p=$('pin').value;
    const want = g.step==='adminLogin' ? S.adminPinHash : S.testerPinHash;
    if(hash(p)!==want){ g.error='Incorrect PIN.'; render(); return; }
    enter(g.step==='adminLogin'?'admin':'grader'); };
    $('gSubmit').onclick=go; $('pin').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } }; }
}
function enter(role){ STATE.session={role}; STATE.tab = role==='admin' ? 'rank' : 'team'; STATE.grid=null; render(); }

function chip(r,label){ return `<span class="chip ${r==='go'?'go':r==='nogo'?'ng':'na'}" title="${label}: ${r==='go'?'Go':r==='nogo'?'No-Go':'not tested'}">${label}</span>`; }
function renderRank(c){
  if(!viewsOn().includes(STATE.view)) STATE.view='overall';
  const S=DATA.settings, view=STATE.view, rows=ranked(view), cut=cutIndex(rows), failed=rows.filter(r=>isCut(r.sc)).length;
  const overall=ranked('overall'), topF=overall.slice(0,cut).filter(r=>r.s.sex==='F').length;
  const womenBelow=overall.map((r,i)=>({r,i})).filter(x=>x.i>=cut && x.r.s.sex==='F').slice(0,Math.max(S.minFemale-topF,0)+2);

      : `<div class="note warn"><b>Only ${topF} ${topF===1?'woman is':'women are'} above the cut line.</b> You want at least ${S.minFemale}.${womenBelow.length?` Highest-ranked women below the line (overall):<ul class="plain">${womenBelow.map(x=>`<li>#${x.i+1} ${esc(x.r.s.name)}: ${fmt1(x.r.sc.total)} pts${cutScore!=null?`, ${fmt1(cutScore-x.r.sc.total)} behind #${cut}`:''}</li>`).join('')}</ul>`:' No women below the line to move up.'}</div>`;
  }

    <div class="panel">
      <div class="row" style="justify-content:space-between;align-items:flex-start">

    ${!physOn() ? `<div class="note info">AFT and CFT are both turned off, so the ranking is Go points only.</div>` : ''}
    <div class="panel" style="padding:8px 10px">
      ${rows.length ? `<div class="scroll"><table>
        <thead><tr><th class="num">#</th><th>Name</th><th>Sex</th><th class="num">Age</th>${SK.length?'<th>Skills</th><th class="num">Gos</th>':''}
          ${aftOn?EVENTS.map(e=>`<th class="num" title="${e.name}">${e.short}</th>`).join('')+'<th class="num">AFT</th>':''}${cftOn?'<th class="num">CFT</th>':''}${CTS.map(t=>`<th class="num" title="${esc(t.name)}">${esc(t.short||t.name)}</th>`).join('')}${physOn()?'<th class="num">Physical</th>':''}<th class="num">Total</th><th></th></tr></thead>
        <tbody>${rows.map((r,i)=>{
          const s=r.s, sc=r.sc;
          const main = view==='run' ? `<td class="num">${s.run!=null?fmtTime(s.run):''}</td>` : '';
          return `${i===cut?`<tr class="cut"><td colspan="${NC}"></td></tr><tr class="cutlabel"><td colspan="${NC}">Cut line: top ${cut} above${failed?` \u00B7 ${failed} failed a PT test (automatic cut)`:''}</td></tr>`:''}
          <tr class="${i>=cut?'below':''}">
            <td class="num">${i+1}</td>
            <td><button class="btn sm" style="border:0;background:none;padding:0;text-decoration:underline;text-underline-offset:3px;white-space:nowrap;text-align:left" data-open="${s.id}">${esc(s.name)}</button></td>
            <td>${s.sex==='F'?'<span class="badge b-brass">F</span>':'M'}</td><td class="num">${esc(s.age)}</td>
            ${SK.length?`<td><span class="chips">${SK.map(k=>chip(skillResult(s,k.k),k.short)).join('')}</span></td>
            <td class="num">${sc.gos}</td>`:''}
            ${aftOn?EVENTS.map(e=>`<td class="num" title="${e.name}: ${fieldDisplay({type:e.time?'time':'int'},s[e.k])}">${sc.ev[e.k]??'<span class="soft">\u2013</span>'}</td>`).join('')+`<td class="num">${sc.aftTotal??'\u2013'}</td>`:''}
            ${cftOn?`<td class="num" title="${s.cft!=null?fmtTime(s.cft):''}">${sc.cftPts==null?'\u2013':fmt1(sc.cftPts)}</td>`:''}

  </div>`;
  c.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ STATE.view=b.dataset.v; render(); });
  c.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{ STATE.selectedId=b.dataset.open; STATE.newMode=false; STATE.tab='one'; render(); });
  $('xl').onclick=exportXlsx;
  const gt=$('goTeam'); if(gt) gt.onclick=()=>{ STATE.tab='team'; render(); };
  const sm=$('sample'); if(sm) sm.onclick=loadSample;

function sampleScans(F, rnd){
  const h=F?rnd(61,68):rnd(66,74), w0=F?rnd(125,170):rnd(155,215), p0=F?rnd(18,31):rnd(9,22), out=[];
  ['2026-06-01','2026-07-15','2026-09-01'].forEach((d,i)=>{ const w=w0-i*rnd(0,2), pbf=p0-i*rnd(0,1.2), fm=w*pbf/100, smm=(w-fm)*0.56;
    out.push({date:d, heightIn:h.toFixed(0), weightLb:w.toFixed(1), smmLb:smm.toFixed(1), bodyFatMassLb:fm.toFixed(1), pbf:pbf.toFixed(1), visceralFat:String(Math.round(rnd(3,12))), bmr:String(Math.round(370+21.6*(w-fm)*0.4536)), activityLevel:'standard'}); });
  return out;
}
function samplePractice(rnd){
  const T=['medevac','cff','mission','spot','salute','tccc','grenade','m249','m240b','m4'], n=Math.floor(rnd(0,25)), out=[];
  for(let i=0;i<n;i++) out.push({t:Date.now()-Math.floor(rnd(0,20))*864e5-Math.floor(rnd(0,8e7)), task:T[Math.floor(rnd(0,T.length))], ok:Math.random()<.75, detail:''});
  return out.sort((a,b)=>a.t-b.t);
}
function loadSample(){
  const first=['Avery','Jordan','Taylor','Morgan','Riley','Casey','Quinn','Reese','Drew','Parker','Hayden','Rowan','Emerson','Blake','Skyler','Logan','Cameron','Sawyer','Jamie','Dakota'];
  const rnd=(a,b)=>a+Math.random()*(b-a);
  first.forEach((f,i)=>{
    const F = i%5===1 || i===12; const age = Math.floor(rnd(18,24));
    DATA.soldiers.push({id:uid(), name:`${f} (example)`, age, sex:F?'F':'M', sample:true,
      mdl: Math.round(rnd(F?140:190, F?230:340)/10)*10, hrp: Math.round(rnd(F?15:25, F?45:60)),
      sdc: Math.round(rnd(F?110:95, F?160:135)), plk: Math.round(rnd(95, 215)), run: Math.round(rnd(F?900:790, F?1260:1110)),
      cft:null, cff: Math.random()<.8?'go':'nogo', grenade: Math.floor(rnd(4,7)), throw: Math.random()<.8?'go':'nogo', circle: Math.random()<.35?'yes':'no', tccc: Math.random()<.75?'go':'nogo', fracture: Math.random()<.8?'go':'nogo', burn: Math.random()<.85?'go':'nogo',
      m249: Math.random()<.8?'go':'nogo', m240b: Math.random()<.75?'go':'nogo', m4: Math.random()<.85?'go':'nogo',
      medevac: Math.random()<.8?'go':'nogo', spot: Math.random()<.8?'go':'nogo', salute: Math.random()<.85?'go':'nogo',
      tryout:true, scans:sampleScans(F, rnd), practice:samplePractice(rnd)});

}

function pasteRows(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length){ toast('Paste some rows first.'); return; }
  let n=0;
  lines.forEach((ln,i)=>{
    const cells = ln.includes('\t') ? ln.split('\t') : ln.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(x=>x.replace(/^"|"$/g,''));
    if(i===0 && /^\s*name\s*$/i.test(cells[0])) return;
    const [name,age,sex,...rest]=cells.map(x=>x.trim());
    if(!name) return;
    let row=STATE.grid.find(r=>normName(r.name)===normName(name));
    if(!row){ row=STATE.grid.find(r=>!r.name && !r.id); if(!row){ row=blankRow(); STATE.grid.push(row); } }
    row.name=name; if(age) row.age=age; if(sex) row.sex=normSex(sex)||sex;
    visFields().forEach((f,j)=>{ const v=rest[j]; if(v!=null && v!=='') row.vals[f.k] = f.type==='gonogo' ? (normGo(v)||v) : f.type==='yesno' ? (normYes(v)||v) : v; });
    n++;
  });
  toast(`Added ${n} row(s). Check them, then Save all rows.`); render();
}
function saveGrid(){
  const admin=isAdmin(), errs={}, msgs=[]; let created=0, updated=0;
  const work=[], VF=visFields();
  STATE.grid.forEach(r=>{
    const blank = !r.name.trim() && !r.age && !r.sex && VF.every(f=>!String(r.vals[f.k]??'').trim());
    if(blank) return;
    const e = k=>{ errs[r.rid+':'+k]=1; };
    const label = r.name.trim()||'(no name)';
    if(!r.name.trim()){ e('name'); msgs.push('A row has results but no name.'); }
    let target = r.id ? soldierById(r.id) : DATA.soldiers.find(s=>normName(s.name)===normName(r.name));
    const age = String(r.age).trim(), sex = normSex(r.sex);
    if(age && (!/^\d+$/.test(age) || +age<16 || +age>70)){ e('age'); msgs.push(`${label}: age must be a number from 16 to 70.`); }
    if(!target){ if(!age){ e('age'); msgs.push(`${label}: age is required for a new soldier.`); } if(!sex){ e('sex'); msgs.push(`${label}: sex is required for a new soldier.`); } }
    const vals={};
    VF.forEach(f=>{ const p=parseField(f, r.vals[f.k]); if(!p.ok){ e(f.k); msgs.push(`${label}: ${p.msg}.`); } else vals[f.k]=p; });
    work.push({r,target,age,sex,vals});
  });
  STATE.gridErrors=errs;
  if(msgs.length){ render(); $('gridMsg').innerHTML=`<div class="note warn"><b>Nothing was saved.</b> Fix the highlighted cells:<ul class="plain">${[...new Set(msgs)].slice(0,12).map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div>`; return; }
  work.forEach(({r,target,age,sex,vals})=>{
    let s=target;
    if(!s){ s=fixSoldier({id:uid(), name:r.name.trim(), age:+age, sex, tryout:true}); FIELDS.forEach(f=>s[f.k]=null); DATA.soldiers.push(s); created++; }
    else { updated++; s.name=r.name.trim()||s.name; if(age) s.age=+age; if(sex) s.sex=sex; s.tryout=true; }
    VF.forEach(f=>{ const p=vals[f.k]; if(p.empty){ if(admin) s[f.k]=null; } else s[f.k]=p.val; });
    s.updated=new Date().toISOString();
  });
  save(); STATE.grid=null; STATE.gridErrors={};
  toast(`Saved ${created} new and ${updated} existing soldier(s).`); render();
}

/* generic "do the steps in order" tracker: flags skipped and out-of-order steps */
function orderTracker(steps, seq){
  let firstBad=-1; for(let i=0;i<seq.length;i++){ if(seq[i]!==i){ firstBad=i; break; } }
  const maxDone = seq.length ? Math.max(...seq) : -1;
  const missed = new Set(firstBad>=0 ? steps.map((_,i)=>i).filter(i=>!seq.includes(i) && i<maxDone) : []);
  const complete = firstBad<0 && seq.length===steps.length;
  const list = `<ol class="steps">${steps.map((t,i)=>{ const o=seq.indexOf(i);
      const cls = missed.has(i) ? 'oops' : o<0 ? '' : (firstBad>=0 && o>=firstBad) ? 'oops' : 'done';
      return `<li><button data-os="${i}" class="${cls}"><span class="k">${i+1}</span><span>${esc(t)}</span><span class="mono soft">${missed.has(i)?'skipped':o<0?'':'#'+(o+1)}</span></button></li>`; }).join('')}</ol>`;
  const status = !seq.length ? '<span class="soft">Nothing tapped yet.</span>'
    : firstBad>=0 ? `<span class="flag">Out of order: "${esc(steps[seq[firstBad]])}" was done before "${esc(steps[firstBad])}".</span>`

/* ============================== weapons: steps in order, timed ============================== */
function weaponSteps(k){
  const out=[];
  Drill.WEAPONS[k].phases.forEach((ph,pi)=>{
    if(ph.type==='seq') ph.steps.forEach(t=>out.push({pi, t}));
    else if(ph.type==='set') out.push({pi, t:'Disassemble the weapon into its groups.', groups:ph.steps});
    else out.push({pi, t:ph.steps[0]});
  });
  return out;
}
function phaseTitle(ph){ return ph.type==='set' ? 'Disassemble the weapon' : ph.t; }
function wtElapsed(T){ return Math.floor((T.elapsed+(T.startedAt?Date.now()-T.startedAt:0))/1000); }
function tickWtClock(){
  const el=$('wtClock'); if(!el) return; const k=el.dataset.k, T=STATE.wt[k].T, lim=DATA.settings.timeLimits[k], used=wtElapsed(T);
  el.textContent = wtClockText(used, lim); const over = lim && used>lim; el.classList.toggle('over', !!over);
  const n=$('wtOver'); if(n) n.hidden=!over;
}
// Counts down from the time limit (negative once over); counts up when no limit is set.
function wtClockText(used, lim){ if(!lim) return fmtTime(used); const left=lim-used; return left>=0 ? fmtTime(left) : '-'+fmtTime(-left); }

      ${lim?'':`<div class="note warn" style="margin-bottom:12px">No time limit is set for the ${esc(wp.name)}. ${admin?'Set one in Settings.':'The admin sets it in Settings.'} Until then, only the steps are graded.</div>`}
      <div class="row" style="justify-content:space-between;align-items:flex-start;gap:18px">
        <div class="stack" style="gap:6px">
          <div class="soft" style="font-size:13px">${lim?`Time left (limit ${fmtTime(lim)})`:'Time'}</div>

    <div class="panel"><h2>Order tracker</h2>${html}
      <div class="row" style="margin-top:12px;justify-content:space-between"><span>${status}</span><button class="btn sm" id="wtClear">Clear steps</button></div>

  tickWtClock();

/* ============================== 9-line, SPOT, SALUTE: spoken or typed ============================== */
const REPORT_GEN = { medevac:f=>Drill.genMedevac(f), spot:f=>Drill.genSpot(f), salute:f=>Drill.genSalute(f) };
const normRpt = v => String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function countMap(v){ const m={}; String(v||'').toUpperCase().replace(/(\d+)\s*([A-Z])\b/g,(_,n,l)=>{ m[l]=(m[l]||0)+ +n; return ''; }); return JSON.stringify(Object.keys(m).sort().map(k=>k+m[k])); }
function letterSet(v){ return [...new Set(String(v||'').toUpperCase().split(/[^A-Z]+/).filter(t=>t.length===1))].sort().join(''); }
// Returns true/false for lines the tool can grade, or null when the grader has to judge the wording.
function autoCheck(line, typed){
  if(!String(typed||'').trim()) return false;
  switch(line.check){
    case 'grid': case 'dtg': return normRpt(typed)===normRpt(line.ans);
    case 'count': return countMap(typed)===countMap(line.ans) && countMap(line.ans)!=='[]';
    case 'letters': return letterSet(typed)===letterSet(line.ans) && letterSet(line.ans)!=='';
    case 'freqcs': return line.parts.every(p=>normRpt(typed).includes(normRpt(p)));
    default: return null;
  }
}

/* ============================== custom PT test builder (admin) ============================== */
const NB = AGE_BRACKETS.length;
const shortId = p => p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function ctBlankRows(n){ return Array.from({length:n},()=>({p:'', v:Array(NB).fill('')})); }
function ctNewEvent(){ return {id:shortId('e'), name:'', type:'numHigh', unit:'', min:'', allAges:false, tables:{M:ctBlankRows(5), F:ctBlankRows(5)}}; }
function ctNewDraft(){ return {id:shortId('t'), isNew:true, name:'', short:'', totalMin:'', failCut:true, events:[ctNewEvent()]}; }
function ctToDraft(t){
  const show=(e,v)=> v==null ? '' : (CT_TYPES[e.type]||{}).time ? fmtTime(v) : String(v);
  return {id:t.id, isNew:false, name:t.name, short:t.short||'', totalMin:t.totalMin??'', failCut:!!t.failCut,
    events:t.events.map(e=>({id:e.id, name:e.name, type:e.type, unit:e.unit||'', min:e.min??'', allAges:!!e.allAges,
      tables:{M:(e.tables.M||[]).map(r=>({p:String(r.p), v:Array.from({length:NB},(_,i)=>show(e,r.v[i]))})),
              F:(e.tables.F||[]).map(r=>({p:String(r.p), v:Array.from({length:NB},(_,i)=>show(e,r.v[i]))}))}}))};
}
// Check the draft and turn it into a saved test. Returns {test} or {errors}.
function ctFromDraft(d){
  const errs=[], num=v=>String(v).trim()===''?null:+v;
  if(!d.name.trim()) errs.push('Give the test a name.');
  const short=(d.short.trim()||d.name.trim().slice(0,8)).slice(0,10);
  if(['AFT','CFT'].includes(short.toUpperCase())) errs.push('Use a short name other than AFT or CFT.');
  const totalMin=num(d.totalMin); if(totalMin!=null && !(totalMin>=0)) errs.push('Minimum total must be a number, or blank.');
  if(!d.events.length) errs.push('Add at least one event.');
  const events=d.events.map((e,ei)=>{
    const label=e.name.trim()||`Event ${ei+1}`, ty=CT_TYPES[e.type]||CT_TYPES.numHigh;
    if(!e.name.trim()) errs.push(`Event ${ei+1} needs a name.`);
    const min=num(e.min); if(min!=null && !(min>=0)) errs.push(`${label}: minimum points must be a number, or blank.`);
    const tables={};
    ['M','F'].forEach(sx=>{
      const cols = e.allAges ? 1 : NB, rows=[];
      e.tables[sx].forEach(r=>{
        const vals=r.v.slice(0,cols).map(x=>String(x).trim());
        if(String(r.p).trim()==='' && vals.every(x=>x==='')) return;
        const p=+r.p; if(String(r.p).trim()==='' || isNaN(p)) { errs.push(`${label} (${sx==='M'?'men':'women'}): every row needs a points number.`); return; }
        const v=vals.map((x,ci)=>{ if(x==='') return null; const pv = ty.time ? parseTime(x) : (/^\d+(\.\d+)?$/.test(x)?+x:NaN);
          if(pv==null || isNaN(pv)){ errs.push(`${label} (${sx==='M'?'men':'women'}), ${p} points${e.allAges?'':', ages '+AGE_BRACKETS[ci][1]}: "${x}" isn't ${ty.time?'a time like 14:30':'a number'}.`); return null; } return pv; });
        rows.push({p, v});
      });
      if(!rows.some(r=>r.v.some(v=>v!=null))) errs.push(`${label}: the ${sx==='M'?"men's":"women's"} table is empty.${sx==='F'?' Use "Copy men\'s table to women\'s" if they are the same.':''}`);
      tables[sx]=rows.sort((a,b)=>b.p-a.p);
    });
    return {id:e.id, name:e.name.trim(), type:e.type, unit:ty.time?'':e.unit.trim(), min, allAges:!!e.allAges, tables};
  });
  if(errs.length) return {errors:[...new Set(errs)]};
  return {test:{id:d.id, name:d.name.trim(), short, totalMin, failCut:!!d.failCut, events}};
}
function ctParsePaste(text, allAges){
  const out=[];
  text.split(/\r?\n/).forEach(line=>{
    if(!line.trim()) return;
    const cells=(line.includes('\t')?line.split('\t'):line.split(/,|\s{2,}/)).map(x=>x.trim());
    if(isNaN(+cells[0]) || cells[0]==='') return;           // skip header rows
    const v=Array(NB).fill(''); cells.slice(1, allAges?2:NB+1).forEach((x,i)=>v[i]=x);
    out.push({p:cells[0], v});
  });
  return out;
}

  const bind=(id,fn)=>{ const el=$(id); if(el) el.oninput=el.onchange=()=>fn(el); };

<style id="appStyle">
:root{
  /* Anvil Steel: one dark theme for every device */
  color-scheme:dark;
  --bg:#111214; --panel:#191B1E; --panelAlt:#23262A; --field:#0C0D0F; --ink:#E6E7E9; --inkSoft:#9EA2A8;
  --line:#30343A; --alert:#F2717F; --alertBg:#381D24; --good:#62C0A6; --goodBg:#16302A;
  --brass:#D49A5C; --brassBg:#302518; --navy:#C25B2C; --navyInk:#140A06;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
h1,h2,h3{text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.soft{color:var(--inkSoft)}
.app-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px 20px;padding-block:14px;padding-inline:max(16px,calc((100% - 1160px)/2));border-bottom:1px solid var(--line);background:var(--panel)}
.app-title{font-family:var(--serif);font-weight:600;font-size:20px;display:flex;align-items:center;gap:10px}
.app-logo{width:46.5px;height:26.5px;image-rendering:pixelated;flex:none}
.gate-logo{display:block;width:186px;height:106px;image-rendering:pixelated;margin:4px auto 16px}
.gate-head{text-align:center}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--panelAlt);padding:4px;border-radius:6px}
.tab{border:0;background:transparent;padding:7px 11px;font-size:13.5px;color:var(--inkSoft);border-radius:4px;cursor:pointer}
.tab[aria-current="page"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 0 var(--line) inset}
.who{white-space:nowrap;margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--inkSoft)}
.main{max-width:1160px;margin:0 auto;padding-block:22px 60px;padding-inline:16px}
.stack{display:flex;flex-direction:column;gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px 20px}
.panel h2{font-family:var(--serif);font-weight:600;font-size:18px;margin:0 0 4px}
.panel h3{font-family:var(--serif);font-weight:600;font-size:16px;margin:14px 0 6px}
.sub{color:var(--inkSoft);font-size:14px;margin:0 0 14px;max-width:72ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.grid>.field>span:first-child{min-height:2.6em;display:flex;align-items:flex-end;line-height:1.3}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px}
.field>span{color:var(--inkSoft);font-size:12.5px}
.input{border:1px solid var(--line);background:var(--field);border-radius:4px;padding:7px 9px;font-size:14px;width:100%;min-width:0}
input.input,select.input{height:38px}
.input.bad{border-color:var(--alert);box-shadow:0 0 0 1px var(--alert)}
textarea.input{min-height:110px;font-family:var(--mono);font-size:12.5px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:5px;padding:9px 16px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--navy);color:var(--navyInk);border-color:var(--navy)}
.btn.brass{background:var(--brass);color:var(--navyInk);border-color:var(--brass);font-weight:600}
.btn.danger{color:var(--alert);border-color:var(--alert)}
.btn.sm{padding:6px 11px;font-size:13px}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--field);padding:7px 13px;border-radius:5px;font-size:13.5px;cursor:pointer;color:var(--inkSoft)}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navyInk);border-color:var(--navy)}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.b-good{background:var(--goodBg);color:var(--good)}
.b-bad{background:var(--alertBg);color:var(--alert)}
.b-brass{background:var(--brassBg);color:var(--brass)}
.b-none{background:var(--panelAlt);color:var(--inkSoft)}
.note{border-radius:6px;padding:12px 14px;font-size:14px}
.note.warn{background:var(--alertBg);color:var(--ink);border:1px solid var(--alert)}
.note.ok{background:var(--goodBg);border:1px solid var(--good)}
.note.info{background:var(--brassBg);border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--navy);color:var(--navyInk);padding:10px 16px;border-radius:6px;font-size:14px;max-width:calc(100% - 32px);z-index:10}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--inkSoft);font-weight:500;font-size:12.5px;white-space:nowrap}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.cut td{border-bottom:2px dashed var(--alert);padding:0;height:0}
tr.cutlabel td{color:var(--alert);font-size:12px;font-weight:600;padding:3px 8px;border-bottom:0}
tr.below td{opacity:.72}
.chips{display:inline-flex;gap:4px}
.chip{font-size:11px;font-weight:600;padding:1px 6px;border-radius:3px;font-family:var(--mono)}
.chip.go{background:var(--goodBg);color:var(--good)}
.chip.ng{background:var(--alertBg);color:var(--alert)}
.chip.na{background:var(--panelAlt);color:var(--inkSoft)}
.entry td{padding:4px}

const BASE_FIELDS = FIELDS.slice(), BASE_PHYS = PHYS_EVENTS.slice();
const CT_TYPES = {
  timeLow:{label:'Time (m:ss), faster is better', time:true, lower:true},
  timeHigh:{label:'Time (m:ss), longer is better', time:true, lower:false},
  numHigh:{label:'Number, higher is better', time:false, lower:false},
  numLow:{label:'Number, lower is better', time:false, lower:true},
};
const ctKey = t => 'ct_'+t.id;
const ctField = (t,e) => 'ct_'+t.id+'_'+e.id;
function customTests(){ return DATA.settings.customTests || []; }
function ctByKey(k){ return customTests().find(t=>ctKey(t)===k); }
// Custom tests add their own physical event, entry columns, and import/merge keys.
function rebuildRegistry(){
  FIELDS.length=0; FIELDS.push(...BASE_FIELDS);
  PHYS_EVENTS.length=0; PHYS_EVENTS.push(...BASE_PHYS);
  customTests().forEach(t=>{
    PHYS_EVENTS.push({k:ctKey(t), short:t.short||t.name, name:t.name, custom:true});
    t.events.forEach(e=>{ const ty=CT_TYPES[e.type]||CT_TYPES.numHigh;
      FIELDS.push({k:ctField(t,e), ev:ctKey(t), label:e.name, hint:ty.time?'m:ss':(e.unit||''), type:ty.time?'time':'num', w:'w-m',
        long:`${e.name}${ty.time?' (m:ss)':e.unit?` (${e.unit})`:''}`}); });
  });
  if(typeof MERGE_KEYS!=='undefined'){ MERGE_KEYS.length=0; MERGE_KEYS.push('name','age','sex', ...FIELDS.map(f=>f.k)); }
  if(typeof applyContent==='function') applyContent();
}
// Points rows for one sex and age group, highest points first. Blank cells are skipped.
function ctColumn(e, sex, age){
  const rows=(e.tables && e.tables[sex==='F'?'F':'M']) || [];
  const bi = e.allAges ? 0 : AGE_BRACKETS.findIndex(b=>b[1]===bracket(age));
  return rows.map(r=>[+r.p, r.v[bi]]).filter(r=>r[1]!=null && !isNaN(r[1])).sort((a,b)=>b[0]-a[0]);
}
// Same rule as the official tables: the highest row the result meets. In between rounds down.
function ctPoints(e, sex, age, v){
  if(v==null || v==='' || isNaN(v)) return null;
  const rows=ctColumn(e,sex,age); if(!rows.length) return null;
  const lower=(CT_TYPES[e.type]||{}).lower;
  for(const [p,t] of rows){ if(lower ? v<=t : v>=t) return p; }
  return 0;
}
function ctMax(e){ let m=0; ['M','F'].forEach(x=>((e.tables||{})[x]||[]).forEach(r=>{ if(r.v.some(v=>v!=null)) m=Math.max(m,+r.p||0); })); return m||100; }
function ctScore(t, s){
  const pts={}; let n=0, sum=0, max=0, fail=false, noTable=false;
  t.events.forEach(e=>{ const v=s[ctField(t,e)], p=ctPoints(e,s.sex,s.age,v); pts[e.id]=p; max+=ctMax(e);
    if(v!=null && p==null) noTable=true;
    if(p!=null){ n++; sum+=p; if(e.min!=null && p<e.min) fail=true; } });
  const complete = t.events.length>0 && n===t.events.length;
  if(complete && t.totalMin!=null && sum<t.totalMin) fail=true;
  return {pts, total:n?sum:null, max, scaled:n?sum/(max||1)*500:null, fail, pass:complete&&!fail, complete, noTable};
}
function physWeight(k){ const w=(DATA.settings.physWeights||{})[k]; return w!=null ? +w : k==='aft'?70 : k==='cft'?30 : /^avg/.test(k)?20 : 50; }
function physKeysOn(){ return [...PHYS_EVENTS, ...TIME_EVENTS].map(e=>e.k).filter(isOn); }

    if(S.circleBonus==null) S.circleBonus=25;

    S.enabled = Object.assign({}, DEFAULT_ENABLED, {cft: !!S.includeCft});
    delete S.includeCft;

    WEAPON_KEYS.forEach(k=>{ if(!S.timeLimits[k]) S.timeLimits[k]=150; });

function score(s){
  const S=DATA.settings, ev={}; let n=0;
  EVENTS.forEach(e=>{ ev[e.k]=eventPts(e.k,s.sex,s.age,s[e.k]); if(ev[e.k]!=null) n++; });
  const wsum = EVENTS.reduce((a,e)=>a+(+S.weights[e.k]||0),0) || 1;
  const aftTotal = n ? EVENTS.reduce((a,e)=>a+(ev[e.k]||0),0) : null;
  const aftW = n ? EVENTS.reduce((a,e)=>a+(ev[e.k]||0)*(+S.weights[e.k]||0),0)/wsum*5 : null;
  const cftPts = cftPoints(s.cft);
  const aftOn=isOn('aft'), cftOn=isOn('cft');
  const ct={}; customTests().forEach(t=>{ ct[t.id]=ctScore(t,s); });
  // Physical score (0-500): each PT test that counts, on a 500 scale, mixed by its weight. None on: Go points only.
  const avg={run:avgTime(s,'run'), ruck:avgTime(s,'ruck')}, TE=k=>TIME_EVENTS.find(e=>e.k===k);
  const parts=physKeysOn().map(k=>[k, k==='aft'?aftW : k==='cft'?(cftPts==null?null:cftPts*5) : TE(k)?(avg[TE(k).kind].pts==null?null:avg[TE(k).kind].pts*5) : ct[ctByKey(k).id].scaled]);

  if(parts.some(p=>p[1]!=null)){ const W=parts.map(p=>physWeight(p[0])), ws=W.reduce((a,b)=>a+b,0)||1; phys=parts.reduce((a,p,i)=>a+W[i]*(p[1]||0),0)/ws; }

  const bonus = isOn('throw') && s.circle==='yes' ? (+S.circleBonus||0) : 0;
  const total = (phys||0) + S.goPoints*gos + bonus;
  // General standard: at least 60 points in every event and 300 total. A failure is known as soon as one event is under 60.
  // It only matters when the AFT counts.
  const aftFail = aftOn && (EVENTS.some(e=>ev[e.k]!=null && ev[e.k]<60) || (n===5 && aftTotal<300));
  const missing = [];
  if(aftOn) EVENTS.forEach(e=>{ if(ev[e.k]==null) missing.push(e.short); });
  if(cftOn && s.cft==null) missing.push('CFT');
  customTests().forEach(t=>{ if(isOn(ctKey(t)) && !ct[t.id].complete) missing.push(t.short||t.name); });
  timeEventsOn().forEach(e=>{ if(!avg[e.kind].n) missing.push(e.short); });
  SKILLS_ON().forEach(sk=>{ if(!skillResult(s,sk.k)) missing.push(sk.short); });

  return {ev, aftTotal, aftW, cftPts, ct, avg, phys, gos, skillsDone, bonus, total, missing, aftFail, aftPass: n===5 && !aftFail, cutBy};
}

function parseField(f, raw){

  if(f.type==='int'){ if(!/^\d+$/.test(raw)) return {ok:false, msg:`${f.label}: whole number`}; const v=+raw; if(v<f.min||v>f.max) return {ok:false,msg:`${f.label}: ${f.min}\u2013${f.max}`}; return {ok:true,val:v}; }
  if(f.type==='num'){ if(!/^\d+(\.\d+)?$/.test(raw)) return {ok:false, msg:`${f.label}: a number`}; return {ok:true,val:+raw}; }
  if(f.type==='grenade'){ const max=DATA.settings.grenadeTotal; if(!/^\d+$/.test(raw)||+raw>max) return {ok:false,msg:`Grenade: 0\u2013${max} correct`}; return {ok:true,val:+raw}; }
  if(f.type==='time'){ const v=parseTime(raw); if(v==null||isNaN(v)) return {ok:false,msg:`${f.label}: use m:ss`}; return {ok:true,val:v}; }
  if(f.type==='gonogo'){ const v=normGo(raw); if(v==='?') return {ok:false,msg:`${f.label}: Go or No-Go`}; return {ok:true,val:v||null}; }
  if(f.type==='yesno'){ const v=normYes(raw); if(v==='?') return {ok:false,msg:`${f.label}: Yes or No`}; return {ok:true,val:v||null}; }
  return {ok:true,val:raw};

const CRC_TABLE = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();

async function offerFile(filename, data, mime){

      const dl = await window.claude.use('downloads');
      if(dl){ await dl.save({filename, data}); toast(`Saved ${filename}.`); return; }
    }
  }catch(e){
    if(e && e.code==='declined'){ toast('Download canceled.'); return; }
    if(e && e.code && e.code!=='unavailable' && e.code!=='not_granted'){ toast('Could not save the file: '+(e.message||e.code)); return; }
  }
  const blob = new Blob([data], {type:mime}); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000); toast(`Saved ${filename}.`);
}

const MERGE_KEYS = ['name','age','sex', ...FIELDS.map(f=>f.k)];
// Old Unit Fitness Tracker files are a plain list of people with "history" (scans) and "gender".
function normalizeIncoming(s){
  const tracker = Array.isArray(s.history) && !Array.isArray(s.scans);
  if(tracker){ s.scans=s.history.filter(Boolean); delete s.history; if(s.tryout==null) s.tryout=false; }
  if(!s.sex && s.gender) s.sex = /^f/i.test(s.gender) ? 'F' : 'M';
  delete s.gender;
  if(s.age===0) s.age='';
  return fixSoldier(s);
}
// Scans merge by date (the file wins for the same date), practice merges without duplicates, a PIN already set here is kept.
function mergeHealth(mine, s, plan){
  fixSoldier(mine);
  const byDate={}; mine.scans.forEach(x=>{ if(x&&x.date) byDate[x.date]=x; });
  s.scans.forEach(x=>{ if(!x||!x.date) return; if(!byDate[x.date]) plan.scans++; byDate[x.date]=x; });
  mine.scans=Object.values(byDate).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const seen=new Set(mine.practice.map(e=>e.t+'|'+e.task));
  s.practice.forEach(e=>{ if(!seen.has(e.t+'|'+e.task)){ mine.practice.push(e); seen.add(e.t+'|'+e.task); plan.practice++; } });
  mine.practice.sort((a,b)=>a.t-b.t);
  if(!mine.pinHash && s.pinHash) mine.pinHash=s.pinHash;
  if(s.tryout===true) mine.tryout=true;
}
function readImport(file){
  const reader = new FileReader();
  reader.onload = () => {
    let inc;
    try{ inc = JSON.parse(reader.result); }catch(e){ toast('That file is not valid JSON.'); return; }
    const soldiers = Array.isArray(inc) ? inc : inc && Array.isArray(inc.soldiers) ? inc.soldiers : null;
    if(!soldiers){ toast('That file is not a scorebook or fitness tracker export.'); return; }
    const plan = {added:[], filled:0, conflicts:[], scans:0, practice:0, settings: (!Array.isArray(inc) && inc.kind!=='soldier' && inc.settings) || null, file:file.name};
    const working = clone(DATA.soldiers), idMap={};
    soldiers.forEach(raw=>{
      if(!raw || !raw.name) return;
      const s = normalizeIncoming(Object.assign({id:raw.id||uid()}, raw));
      const mine = working.find(x=>x.id===s.id) || working.find(x=>normName(x.name)===normName(s.name));
      if(!mine){ plan.added.push(s); plan.scans+=s.scans.length; plan.practice+=s.practice.length; return; }
      idMap[s.id]=mine.id;
      mergeHealth(mine, s, plan);
      const fields=[];
      MERGE_KEYS.forEach(k=>{
        const a=mine[k], b=s[k];
        if(b==null||b==='') return;
        if(a==null||a===''){ mine[k]=b; plan.filled++; return; }
        if(String(a)!==String(b)) fields.push({k, mine:a, theirs:b, choice:'mine'});
      });
      if(fields.length) plan.conflicts.push({id:mine.id, name:mine.name, fields});
    });
    plan.working = working;
    const haveCal=new Set((DATA.calendar||[]).map(e=>e.id));
    plan.cal=(Array.isArray(inc)||!Array.isArray(inc.calendar)?[]:inc.calendar).filter(e=>e && e.id && e.title && !haveCal.has(e.id));
    // Rope bridge, ruck, and run times: add the ones this device doesn't have yet, pointed at the matching soldier here.
    const have=new Set(timeLogs().map(e=>e.id));
    plan.times = (Array.isArray(inc)||!Array.isArray(inc.timeLogs) ? [] : inc.timeLogs)
      .filter(e=>e && e.id && TL_KINDS[e.kind] && e.sec>0 && !have.has(e.id))
      .map(e=>Object.assign({}, e, e.sid && idMap[e.sid] ? {sid:idMap[e.sid]} : {}));
    if(!plan.conflicts.length){ applyImport(plan); }
    else { STATE.pendingImport = plan; STATE.tab='data'; render(); }
  };
  reader.readAsText(file);
}
function applyImport(plan){
  const working = plan.working;
  plan.conflicts.forEach(c=>{ const s=working.find(x=>x.id===c.id); c.fields.forEach(f=>{ if(f.choice==='theirs') s[f.k]=f.theirs; }); });
  plan.added.forEach(s=>working.push(s));
  DATA.soldiers = working;
  (plan.times||[]).forEach(e=>timeLogs().push(e));
  (plan.cal||[]).forEach(e=>calList().push(e));
  let settingsNote='';
  if(plan.settings && !DATA.settings.adminPinHash && plan.settings.adminPinHash){
    DATA.settings = migrateSettings(Object.assign(clone(DEFAULT_SETTINGS), {settingsVersion:0}, plan.settings)); rebuildRegistry(); settingsNote=' Scoring settings and PINs came with the file.';
  }
  save(); STATE.pendingImport=null; STATE.grid=null;
  toast(`Imported: ${plan.added.length} new, ${plan.filled} blank field(s) filled, ${plan.conflicts.length} conflict(s) resolved${plan.scans?`, ${plan.scans} scan(s)`:''}${plan.practice?`, ${plan.practice} practice entr${plan.practice===1?'y':'ies'}`:''}${plan.times&&plan.times.length?`, ${plan.times.length} logged time${plan.times.length===1?'':'s'}`:''}${plan.cal&&plan.cal.length?`, ${plan.cal.length} calendar entr${plan.cal.length===1?'y':'ies'}`:''}.${settingsNote}`);
  render();
}

      const a=t.match(/alt(?:itude)?\D{0,4}(\d+)/); need(a && +a[1]===M.alt, `Altitude should be ${M.alt}m.`);
      const d=t.match(/dir(?:ection)?\D{0,4}(\d+)/); need(d && +d[1]===+M.dir, `Direction should be ${M.dir} mils.`);
      need(endsOver(t), 'End with "Over".');
    } else if(st.k==='t3'){
      const generic=['enemy','team','tm','squad','sqd','platoon','plt','section','sec','vehicle','veh','troops','personnel','fighters','soldiers','crew','gun','armor','apc','ifv'];
      need([...keysFor(M.tg),...generic].some(k=>new RegExp('\\b'+k).test(t)), `Describe the target (for example: ${M.tg.snap}).`);
      if(M.dc) need(/danger close/.test(t), `Call "Danger Close": friendlies are ${M.friend}m from the target.`);
      else need(!/danger close/.test(t), 'Not danger close: no friendlies within 600m.');
      if(M.atMy) need(/at my command/.test(t), 'The scenario says you control the timing: "At my command".');
      need(endsOver(t), 'End with "Over".');
      if(secs!=null && secs>300) e.push(`Initial call for fire took ${mmss(secs)}. The limit is 5:00.`);
    } else if(st.k==='mto'){
      need(/\bmto\b|message to observer/.test(t), 'Start the read-back with "MTO".');
      need(new RegExp('\\b'+M.unit.toLowerCase()+'\\b').test(t), `Unit firing is ${M.unit}.`);
      need(new RegExp('\\b'+M.tg.f.toLowerCase()+'\\b').test(t), `Read back ${M.tg.f} i/e.`);
      need(/i\/e|\bie\b|in effect/.test(t), 'Read back "i/e".');
      need(hasNum(t,M.rounds), `Read back ${M.rounds} rounds.`);
      need(sq(t).includes(sq(M.tgt)), `Read back target number ${M.tgt}.`);
      need(endsOut(t) && !/\bover\W*$/.test(t), 'A read-back ends with "Out".');
    } else if(st.k==='shot' || st.k==='splash'){
      const w={shot:/\bshot\b/, splash:/\bsplash\b/}[st.k];
      need(w.test(t), `Answer with "${expected(M,st).replace(/,? Out\.$/,'')}".`);
      need(endsOut(t) && !/\bover\W*$/.test(t), 'Acknowledge with "Out".');
    } else if(st.k==='corr' && M.mode==='advanced'){
      const r=advCheck(M, st.i, t); e.push(...r.e);
    } else if(st.k==='corr'){
      const x=M.expect[st.i];
      const dv=t.match(/\b(left|right)\s*(\d+)/), rg=t.match(/\b(add|drop)\s*(\d+)/);
      const ffe=/fire\s*for\s*effect|\bffe\b/.test(t);
      if(x.dev){ if(!dv) e.push(`Missing deviation: ${cap(x.dev.dir)} ${x.dev.m}.`); else if(dv[1]!==x.dev.dir||+dv[2]!==x.dev.m) e.push(`Deviation should be ${cap(x.dev.dir)} ${x.dev.m}.`); }
      else if(dv){
        if(x.spot.dev===0) e.push('The round was on line, so no left/right correction.');
        else { const wd=x.spot.dev>0?'left':'right'; if(dv[1]!==wd||+dv[2]!==x.spot.m) e.push(`Deviation should be ${cap(wd)} ${x.spot.m} (optional here: ${Math.abs(x.spot.dev)} mils \u00D7 OT ${x.spot.ot} = ${x.spot.m}m is under the 30m minimum).`); }
      }
      if(!rg) e.push(`Missing range: ${cap(x.rng.dir)} ${x.rng.m}.`); else if(rg[1]!==x.rng.dir||+rg[2]!==x.rng.m) e.push(`Range should be ${cap(x.rng.dir)} ${x.rng.m}.`);
      if(dv && rg && dv.index>rg.index) e.push('Send deviation (left/right) before range (add/drop).');
      if(x.ffe && !ffe) e.push('The 50m correction goes with "Fire for effect".');
      if(!x.ffe && ffe) e.push('Too early for fire for effect; keep bracketing.');
      if(!x.ffe && !/adjust fire/.test(t)) e.push('Start the correction with "Adjust fire".');
      need(endsOver(t), 'End with "Over".');
    } else if(st.k==='eom'){
      need(/\beom\b|end of mission/.test(t), 'Start with "End of mission".');
      need(describesTarget(t,M.tg), `Describe the damage to the target (for example: ${damageDesc(M.tg)} destroyed).`);
      need(/destroy/.test(t), 'Give the effect on target: destroyed.');
      need(/casualt/.test(t) && hasNum(t,M.cas), `Estimated casualties: ${M.cas}.`);
      need(endsOver(t), 'End with "Over".');
    }
    return e;
  }

  function why(M,st){
    if(st.k!=='corr') return '';
    if(M.mode==='advanced') return advWhy(M,st.i);
    const x=M.expect[st.i], s=x.spot;
    const devWhy = s.dev===0 ? 'Round on line: no deviation.' : `${Math.abs(s.dev)} mils ${s.dev>0?'right':'left'} \u00D7 OT ${s.ot} = ${s.m}m${x.dev?` \u2192 ${cap(x.dev.dir)} ${x.dev.m}`:`, under the 30m minimum: leaving it out or sending ${cap(s.dev>0?'left':'right')} ${s.m} are both correct`}.`;
    return `${devWhy} Round ${s.r>0?'over':'short'} \u2192 ${cap(x.rng.dir)} ${x.rng.m}${x.ffe?', Fire for effect':''}.`;
  }

  /* ---------- binocular view (fixed palette: it's a picture through glass, same in both themes) ---------- */
  // Seeded random so a mission's picture stays the same every time it redraws.
  function rng(seed){ let a=seed>>>0; return ()=>{ a=(a+0x6D2B79F5)>>>0; let t=a; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
  const SKY = {day:['#8FB3CC','#D9E5E8'], dawn:['#6F7FA0','#F3C38C'], dusk:['#4E5C80','#E59B6B'], overcast:['#8E989C','#C9CECE']};
  const LAND = { // far hills, ground, foreground, tree, tree dark
    grass:['#8C9A78','#7D8B57','#66743F','#4A5A2C','#36441F'],
    desert:['#CDBB95','#C8AF7F','#B39868','#8A8455','#6C6640'],
    woodland:['#6F7F62','#687649','#525F35','#3B4B25','#2A3719'],
    steppe:['#9DA592','#A4A06C','#8D8A57','#6D7040','#555A31'],
    winter:['#C9D2D9','#E5EAEE','#D3DADF','#6B6660','#4F4A45'],
    mountain:['#8A93A0','#8C8468','#756D55','#4D5537','#3A4128'],
  };
  const INK='#23251C', INK2='#3E4133', HL='#5A5D4B';
  const man = (x,y,pose,c=INK) => {
    const s=`stroke="${c}" stroke-width="1.3" stroke-linecap="round" fill="none"`;
    if(pose==='prone') return `<g><ellipse cx="${x}" cy="${y-1.3}" rx="4.2" ry="1.3" fill="${c}"/><circle cx="${x+4.6}" cy="${y-2}" r="1.4" fill="${c}"/><line x1="${x+5}" y1="${y-2.2}" x2="${x+9}" y2="${y-2.6}" ${s} stroke-width="0.9"/></g>`;
    if(pose==='sit') return `<g><circle cx="${x}" cy="${y-6.4}" r="1.5" fill="${c}"/><rect x="${x-1.3}" y="${y-5}" width="2.6" height="3.6" rx="1" fill="${c}"/><path d="M${x} ${y-1.6} L${x+3.4} ${y-1.2} L${x+3.6} ${y}" ${s}/></g>`;
    if(pose==='kneel') return `<g><circle cx="${x}" cy="${y-7}" r="1.5" fill="${c}"/><rect x="${x-1.3}" y="${y-5.6}" width="2.6" height="3.8" rx="1" fill="${c}"/><path d="M${x-0.6} ${y-2} L${x+2.6} ${y-2} L${x+2.8} ${y}" ${s}/><path d="M${x-0.6} ${y-2} L${x-2} ${y}" ${s}/></g>`;
    if(pose==='dig') return `<g><circle cx="${x+1.2}" cy="${y-7.2}" r="1.5" fill="${c}"/><path d="M${x+0.8} ${y-6} L${x-0.4} ${y-2.8}" ${s} stroke-width="2.4"/><path d="M${x-0.4} ${y-2.8} L${x-1.6} ${y}" ${s}/><path d="M${x-0.4} ${y-2.8} L${x+1} ${y}" ${s}/><line x1="${x+1}" y1="${y-5}" x2="${x+4.6}" y2="${y+0.2}" ${s} stroke-width="0.9"/></g>`;
    const walk=pose==='walk';
    return `<g><circle cx="${x}" cy="${y-8.6}" r="1.5" fill="${c}"/><rect x="${x-1.4}" y="${y-7.2}" width="2.8" height="4.4" rx="1" fill="${c}"/>
      <path d="M${x-0.6} ${y-3} L${x-(walk?2.2:0.9)} ${y}" ${s}/><path d="M${x+0.6} ${y-3} L${x+(walk?2.2:0.9)} ${y}" ${s}/>
      <line x1="${x-1.6}" y1="${y-6.6}" x2="${x+2.8}" y2="${y-4}" ${s} stroke-width="0.9"/></g>`;
  };
  const wheel = (x,y,r) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#141510"/><circle cx="${x}" cy="${y}" r="${r*0.4}" fill="${HL}"/>`;
  const truck = (x,y,f=1,kind='cargo') => { // f=1 faces right
    const X=v=>x+v*f; const box = kind==='fuel' ? `<rect x="${Math.min(X(-13),X(2))}" y="${y-9}" width="15" height="7" rx="3.5" fill="${INK2}"/>`
      : kind==='tech' ? `<path d="M${X(-13)} ${y-5} L${X(2)} ${y-5} L${X(2)} ${y-3} L${X(-13)} ${y-3}Z" fill="${INK2}"/><line x1="${X(-6)}" y1="${y-5}" x2="${X(-6)}" y2="${y-10}" stroke="${INK}" stroke-width="1.2"/><line x1="${X(-7)}" y1="${y-10}" x2="${X(1)}" y2="${y-11.5}" stroke="${INK}" stroke-width="1.3"/>`
      : `<rect x="${Math.min(X(-13),X(2))}" y="${y-11}" width="15" height="9" fill="${INK2}"/><line x1="${Math.min(X(-13),X(2))}" y1="${y-7}" x2="${Math.max(X(-13),X(2))}" y2="${y-7}" stroke="${HL}" stroke-width=".6"/>`;
    return `<g>${box}<path d="M${X(2)} ${y-2} L${X(2)} ${y-9} L${X(7)} ${y-9} L${X(10)} ${y-5} L${X(10)} ${y-2}Z" fill="${INK}"/><path d="M${X(3.5)} ${y-8} L${X(6.5)} ${y-8} L${X(8.6)} ${y-5.2} L${X(3.5)} ${y-5.2}Z" fill="#6E7A7C"/>
      <rect x="${Math.min(X(-13),X(10))}" y="${y-3}" width="23" height="1.6" fill="${INK}"/>${wheel(X(-9),y-1,2.3)}${wheel(X(-4),y-1,2.3)}${wheel(X(6),y-1,2.3)}</g>`;
  };
  const tracks = (x,y,w) => `<rect x="${x-w/2}" y="${y-3.6}" width="${w}" height="3.6" rx="1.8" fill="#161711"/>${Array.from({length:Math.round(w/4.2)},(_,i)=>`<circle cx="${x-w/2+2.4+i*4.2}" cy="${y-1.8}" r="1.3" fill="${HL}"/>`).join('')}`;
  const bmp = (x,y,f=1) => { const X=v=>x+v*f;
    return `<g>${tracks(x,y,24)}<path d="M${X(-12)} ${y-3.4} L${X(-12)} ${y-8} L${X(4)} ${y-9} L${X(12.5)} ${y-5} L${X(12)} ${y-3.4}Z" fill="${INK}"/>
      <path d="M${X(-3)} ${y-9} L${X(-2)} ${y-12} L${X(3)} ${y-12} L${X(4)} ${y-9}Z" fill="${INK2}"/><line x1="${X(3)}" y1="${y-11}" x2="${X(15)}" y2="${y-11.6}" stroke="${INK}" stroke-width="1"/></g>`; };
  const btr = (x,y,f=1) => { const X=v=>x+v*f;
    return `<g><path d="M${X(-13)} ${y-3} L${X(-12)} ${y-8.5} L${X(8)} ${y-9} L${X(13)} ${y-5.5} L${X(12)} ${y-3}Z" fill="${INK}"/>
      <path d="M${X(-2)} ${y-9} L${X(-1)} ${y-11.5} L${X(3)} ${y-11.5} L${X(4)} ${y-9}Z" fill="${INK2}"/><line x1="${X(3)}" y1="${y-10.6}" x2="${X(10)}" y2="${y-11}" stroke="${INK}" stroke-width=".9"/>
      ${[-9,-3.5,2,7.5].map(v=>wheel(X(v),y-1.6,2.1)).join('')}</g>`; };
  const zsu = (x,y) => `<g>${tracks(x,y,25)}<rect x="${x-12}" y="${y-8}" width="24" height="4.6" fill="${INK}"/><rect x="${x-6}" y="${y-14}" width="13" height="6.2" rx="1" fill="${INK2}"/>
      ${[0,1.6,3.2,4.8].map(o=>`<line x1="${x+4+o*0.4}" y1="${y-13+o*0.5}" x2="${x+16+o*0.4}" y2="${y-22+o*0.5}" stroke="${INK}" stroke-width=".8"/>`).join('')}<ellipse cx="${x-3}" cy="${y-16}" rx="3.2" ry="1.4" fill="${INK}"/></g>`;
  const tree = (x,y,h,col,dark,bare) => bare
    ? `<g stroke="${col}" stroke-width="1" fill="none" stroke-linecap="round"><line x1="${x}" y1="${y}" x2="${x}" y2="${y-h}"/><path d="M${x} ${y-h*0.55} L${x-h*0.25} ${y-h*0.85} M${x} ${y-h*0.7} L${x+h*0.22} ${y-h*0.95} M${x} ${y-h*0.35} L${x+h*0.2} ${y-h*0.55}"/></g>`
    : `<g><rect x="${x-0.8}" y="${y-h*0.35}" width="1.6" height="${h*0.35}" fill="${dark}"/><ellipse cx="${x}" cy="${y-h*0.62}" rx="${h*0.3}" ry="${h*0.4}" fill="${col}"/><ellipse cx="${x-h*0.08}" cy="${y-h*0.7}" rx="${h*0.17}" ry="${h*0.24}" fill="${dark}" opacity=".35"/></g>`;
  const treeRow = (r,x0,x1,y,hmin,hmax,col,dark,bare) => { let s=''; for(let x=x0;x<x1;x+=5+r()*6) s+=tree(x, y+r()*2, hmin+r()*(hmax-hmin), col, dark, bare); return s; };
  const smoke = (x,y) => `<g opacity=".75"><circle cx="${x}" cy="${y}" r="2.2" fill="#E8E4DA"/><circle cx="${x+2.6}" cy="${y-2}" r="2.8" fill="#DCD8CE"/><circle cx="${x+5.6}" cy="${y-4.6}" r="3.2" fill="#CFCBC1"/></g>`;
  const flash = (x,y) => `<path d="M${x} ${y} l3 -1 l-1.4 1 l3 .6 l-3 .5 l1.4 1.2 l-3 -1.2z" fill="#FFD27A"/>`;

  function drawTarget(M, cx, cy, r){
    const tg=M.tg, d=tg.draw||'bmp'; let s='';
    const spread = (n,w,fn) => { for(let i=0;i<n;i++){ const x=cx-w/2+(n===1?w/2:i*w/(n-1))+(r()-.5)*3; s+=fn(x,i); } };
    if(d==='trucks'){ s+=truck(cx-14,cy,1)+truck(cx+15,cy+1,-1); s+=`<rect x="${cx-2}" y="${cy-3}" width="3" height="3" fill="${INK2}"/><rect x="${cx+2}" y="${cy-2.5}" width="3" height="2.5" fill="${INK2}"/>`+man(cx+0.5,cy,'stand')+man(cx+7,cy+1,'stand'); }
    else if(d==='technicals'){ s+=truck(cx-12,cy,1,'tech')+truck(cx+13,cy+1,1,'tech')+man(cx+1,cy,'stand'); }
    else if(d==='bmp'){ s+=bmp(cx,cy,r()<.5?1:-1); }
    else if(d==='refuel'){ s+=bmp(cx-15,cy,1)+bmp(cx+15,cy+1,-1); s+=`<rect x="${cx-2.5}" y="${cy-5}" width="4" height="5" rx="1" fill="${INK2}"/><rect x="${cx+1.8}" y="${cy-5}" width="4" height="5" rx="1" fill="${INK2}"/>`+man(cx-5,cy,'stand')+man(cx+8,cy,'kneel'); }
    else if(d==='btr'){ s+=btr(cx-30,cy-1,1)+btr(cx,cy,1)+btr(cx+30,cy+1,1); }
    else if(d==='zsu'){ s+=zsu(cx,cy); }
    else if(d==='walking'){ const n=tg.n||6, w=n>6?70:36; spread(n,w,(x,i)=>man(x, cy+(i%2?1:0)+(r()-.5)*2, 'walk')); }
    else if(d==='digging'){ spread(tg.n||6,46,(x,i)=>`<ellipse cx="${x+2}" cy="${cy}" rx="4" ry="1.4" fill="#5B4A33"/>`+man(x, cy, i%2?'dig':'kneel')); }
    else if(d==='resting'){ spread(tg.n||5,34,(x,i)=>man(x, cy, i===2?'stand':'sit')); s+=`<path d="M${cx+19} ${cy} L${cx+21} ${cy-7} L${cx+23} ${cy}" stroke="${INK}" stroke-width=".9" fill="none"/>`; }
    else if(d==='foxholes'){ spread(tg.n||4,44,x=>`<ellipse cx="${x}" cy="${cy}" rx="4.6" ry="1.8" fill="#1A1A14"/><path d="M${x-2.2} ${cy-0.4} a2.2 2.2 0 0 1 4.4 0z" fill="${INK2}"/><ellipse cx="${x}" cy="${cy+0.8}" rx="6" ry="1" fill="#5B4A33" opacity=".7"/>`); }
    else if(d==='hmg'){ s+=man(cx-5,cy,'prone')+man(cx+7,cy+1,'prone')+`<path d="M${cx+13} ${cy} L${cx+15} ${cy-3} L${cx+17} ${cy}" stroke="${INK}" stroke-width=".9" fill="none"/><line x1="${cx+12}" y1="${cy-3.2}" x2="${cx+21}" y2="${cy-3.6}" stroke="${INK}" stroke-width="1.4"/>`+flash(cx+21.5,cy-4.6); }
    else if(d==='mortar'){ [-10,10].forEach(o=>{ s+=`<line x1="${cx+o-3}" y1="${cy}" x2="${cx+o+2}" y2="${cy-8}" stroke="${INK}" stroke-width="1.8"/><path d="M${cx+o} ${cy-4} L${cx+o+3} ${cy}" stroke="${INK}" stroke-width=".8"/>`+man(cx+o-6,cy,'kneel'); }); s+=smoke(cx+13,cy-11); }
    else if(d==='bunker'){ s+=`<path d="M${cx-14} ${cy} L${cx-11} ${cy-10} L${cx+11} ${cy-10} L${cx+14} ${cy}Z" fill="#6F6E66"/><rect x="${cx-8}" y="${cy-7}" width="16" height="2.2" fill="#15150F"/>${[-16,-11,11,16].map(o=>`<ellipse cx="${cx+o}" cy="${cy-1.4}" rx="3" ry="1.6" fill="#7A6B4C"/>`).join('')}`; }
    else if(d==='sniper'){ s+=`<g opacity=".95"><ellipse cx="${cx-4}" cy="${cy-1.6}" rx="6" ry="2.2" fill="#4B5530"/><ellipse cx="${cx+6}" cy="${cy-1.4}" rx="5.5" ry="2" fill="#4B5530"/></g><line x1="${cx+1}" y1="${cy-2.4}" x2="${cx+8}" y2="${cy-3}" stroke="${INK}" stroke-width=".8"/><circle cx="${cx+1.6}" cy="${cy-3}" r="0.9" fill="#FFF6C8"/>`; }
    else if(d==='cp'){ s+=`<path d="M${cx-22} ${cy} L${cx-15} ${cy-9} L${cx-8} ${cy}Z" fill="${INK2}"/><path d="M${cx-5} ${cy} L${cx+2} ${cy-10} L${cx+9} ${cy}Z" fill="${INK2}"/><line x1="${cx+2}" y1="${cy-10}" x2="${cx+2}" y2="${cy-24}" stroke="${INK}" stroke-width=".7"/>`+truck(cx+22,cy,-1)+man(cx-11,cy,'stand'); }
    else if(d==='atgm'){ s+=man(cx-6,cy,'kneel')+man(cx+8,cy,'kneel')+`<path d="M${cx} ${cy} L${cx+2} ${cy-4} L${cx+4} ${cy}" stroke="${INK}" stroke-width=".9" fill="none"/><line x1="${cx-3}" y1="${cy-3.6}" x2="${cx+8}" y2="${cy-5.6}" stroke="${INK}" stroke-width="2.2"/>`; }
    else if(d==='roadblock'){ s+=`<g transform="translate(${cx} ${cy})">${truck(0,0,1)}</g>`; spread(tg.n||4,40,(x,i)=>i===1||i===2?'':man(x,cy+1,'stand')); s+=man(cx-24,cy+1,'stand')+man(cx+24,cy+1,'stand'); }
    return s;
  }
  // What sits behind or in front of the target: treelines, roads, gullies, berms, walls, buildings.
  function drawContext(M, cx, cy, r, L, pos){
    const ctx=M.tg.ctx||'open', bare=M.scene==='winter', col=L[3], dark=L[4]; let s='';
    if(pos==='back'){
      if(ctx==='woodline' || ctx==='clearing') s+=treeRow(r, cx-150, cx+150, cy-2, 18, 30, col, dark, bare);
      if(ctx==='forest') s+=treeRow(r, cx-170, cx+170, cy-4, 26, 38, col, dark, bare);
      if(ctx==='farmhouse') s+=`<g><rect x="${cx-58}" y="${cy-16}" width="24" height="15" fill="#8C8170"/><path d="M${cx-61} ${cy-15} L${cx-46} ${cy-25} L${cx-31} ${cy-15}Z" fill="#6A4E3A"/><rect x="${cx-52}" y="${cy-10}" width="4" height="5" fill="#2B2A24"/><rect x="${cx-42}" y="${cy-10}" width="4" height="5" fill="#2B2A24"/></g>`;
      if(ctx==='road' || ctx==='junction') s+=`<path d="M60 ${cy+2} Q320 ${cy-4} 580 ${cy+3} L580 ${cy+8} Q320 ${cy+2} 60 ${cy+7}Z" fill="${M.scene==='winter'?'#B9B3AA':'#A69477'}" opacity=".9"/>`;
      if(ctx==='junction') s+=`<path d="M${cx-5} ${cy+4} L${cx+5} ${cy+4} L${cx+70} 300 L${cx-70} 300Z" fill="${M.scene==='winter'?'#B9B3AA':'#A69477'}" opacity=".85"/>`;
      if(ctx==='gully') s+=`<path d="M${cx-60} ${cy-2} Q${cx} ${cy+6} ${cx+60} ${cy-2} L${cx+60} ${cy+1} Q${cx} ${cy+9} ${cx-60} ${cy+1}Z" fill="#000" opacity=".22"/>`;
    } else {
      if(ctx==='forest'){ for(let i=0;i<9;i++){ const x=cx-60+i*15+(r()-.5)*6; if(Math.abs(x-cx)>14) s+=tree(x, cy+2, 22+r()*10, col, dark, bare); } }
      if(ctx==='clearing') s+=tree(cx-44,cy+3,26,col,dark,bare)+tree(cx+46,cy+3,24,col,dark,bare);
      if(ctx==='gully') s+=`<path d="M${cx-60} ${cy-1} Q${cx} ${cy-3} ${cx+60} ${cy-1} L${cx+60} ${cy+6} L${cx-60} ${cy+6}Z" fill="${L[1]}" opacity=".95"/>`;

  /* ---------- instance ---------- */
  function create(opts){

/* ---------- grader lane: tap the steps in order; steps that don't apply to this casualty are dimmed ---------- */
function testMed(el, k){
  const M=MED[k]; STATE.med=STATE.med||{};
  if(!STATE.med[k]) STATE.med[k]={sc:M.gen(!STATE.randomCalls), seq:[], show:false};
  const R=STATE.med[k], sc=R.sc, seq=R.seq;
  const expected=sc.steps.map((s,i)=>s.applies?i:null).filter(i=>i!=null), done=seq.filter(i=>sc.steps[i].applies);
  let firstBad=-1; for(let i=0;i<done.length;i++){ if(done[i]!==expected[i]){ firstBad=i; break; } }
  const maxDone = done.length?Math.max(...done):-1, missed=new Set(firstBad>=0?expected.filter(i=>!done.includes(i)&&i<maxDone):[]);
  const complete = firstBad<0 && done.length===expected.length, verdict = firstBad>=0 ? 'nogo' : complete ? 'go' : null;
  el.innerHTML=`<div class="stack">
    <div class="panel"><h2>${esc(M.title)}</h2>
      <p class="sub">${esc(M.setup)} Read the scenario, say "Go," and tap each step as the soldier does it. Steps that don't apply to this casualty are dimmed. Go means every step that applies, in order, with no harm to the casualty. Standard: ${esc(M.task)}.</p>
      <p class="scenario">${esc(sc.text)}</p>
      <div class="row"><button class="btn" id="mdNew">New scenario</button><button class="btn" id="mdShow" aria-expanded="${R.show}">${R.show?'Hide':'Show'} what right looks like</button></div>
    </div>
    <div class="two">
      <div class="panel"><h2>Order tracker</h2>
        <ol class="steps">${sc.steps.map((s,i)=>{ const o=seq.indexOf(i), di=done.indexOf(i);
          const cls = !s.applies ? '' : missed.has(i) ? 'oops' : o<0 ? '' : (firstBad>=0 && di>=firstBad) ? 'oops' : 'done';
          const tag = !s.applies ? 'not needed' : missed.has(i) ? 'skipped' : o<0 ? '' : '#'+(o+1);
          return `<li><button data-mstep="${i}" class="${cls}" ${s.applies?'':'style="opacity:.55"'}><span class="k">${esc(s.k)}</span><span>${esc(s.t)}</span><span class="mono soft">${tag}</span></button></li>`; }).join('')}</ol>
        <div class="row" style="margin-top:10px;justify-content:space-between">
          <span>${!seq.length?'<span class="soft">Nothing tapped yet.</span>':firstBad>=0?`<span class="flag">Out of order: "${esc(sc.steps[done[firstBad]].t)}" came before "${esc(sc.steps[expected[firstBad]].t)}".</span>`:complete?'<span class="badge b-good">All steps, in order</span>':`<span class="soft">${done.length} of ${expected.length} done, in order so far.</span>`}</span>
          <button class="btn sm" id="mdClear">Clear</button></div>
        <p class="sub" style="margin:10px 0 0;font-size:13px">Mark No-Go below for anything that harms the casualty even if the order is right: ${k==='fracture'?'straightening or repositioning the limb, a cravat or swathe over the fracture, or pushing a bone back in':'touching an electrical casualty bare-handed, pulling off stuck clothing, breaking blisters, putting grease or ointment on the burn, or dressing the face'}.</p>
      </div>
      <div class="panel">${R.show?`<h2>What right looks like for this casualty</h2><ul class="plain">${sc.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ul><h3>Each step</h3>${medGuideHtml(M.guide)}`
        :`<details class="steps-ref"><summary><b>What each step looks like</b></summary>${medGuideHtml(M.guide)}</details>`}</div>
    </div>
    <div class="panel" style="padding-top:4px">${recorder(k, goButtons(k))}</div>
  </div>`;
  el.querySelectorAll('[data-mstep]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.mstep, at=seq.indexOf(i); if(at>=0) seq.splice(at,1); else seq.push(i); render(); });
  $('mdClear').onclick=()=>{ R.seq=[]; render(); };
  $('mdNew').onclick=()=>{ STATE.med[k]={sc:M.gen(!STATE.randomCalls), seq:[], show:false}; render(); };
  $('mdShow').onclick=()=>{ R.show=!R.show; render(); };
  wireRecorder(k, wireGoButtons(el.querySelector('.recorder')));
  if(verdict){ const b=el.querySelector(`.recorder [data-go="${verdict}"]`); if(b) b.click(); }
}

function genTccc(fixed){
  const sc=genTCCC(fixed), tq=sc.inj.tq;
  const note={4: tq?`Needed: ${tq}, high and tight.`:'Not needed for this casualty; skip it.', 6: tq?'Check the tourniquet is still tight and the bleeding has stopped.':'No tourniquet to reassess; skip it.'};
  const march=sc.inj.march.concat(['H: Prevent hypothermia. Keep him covered and off the ground.']);

function wireGate(){
  if(SYNC.on) return syncWireGate();
  const S=DATA.settings, g=STATE.gate;
  const on=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  on('gAdmin',()=>{ STATE.gate={step:S.adminPinHash?'adminLogin':'adminCreate',error:''}; render(); });
  on('gCaptain',()=>{ STATE.gate={step:S.adminPinHash?'adminLogin':'adminCreate',error:'',as:'captain'}; render(); });
  on('gLeader',()=>{ STATE.gate={step:S.adminPinHash?'adminLogin':'adminCreate',error:'',as:'leader'}; render(); });
  on('gTester',()=>{ if(S.testerPinHash){ STATE.gate={step:'testerLogin',error:''}; render(); } else enter('tester'); });
  on('gBack',()=>{ STATE.gate={step:'login',error:''}; render(); });
  on('gLogin',()=>{ STATE.gate={step:'login',error:''}; render(); });
  on('gHome',()=>{ STATE.gate={step:'choose',error:''}; render(); });
  on('gShare',()=>{ STATE.gate={step:'share',error:''}; render(); });
  on('gTheme',showTheme);
  wireKeepBoxes();
  if(g.step==='share') wireShare(document.querySelector('.gate'));
  on('gPractice',()=>{ STATE.session={role:'practice'}; STATE.tab='practice'; render(); });
  on('gSoldier',()=>{ STATE.gate={step:'soldierPick',error:''}; render(); });
  on('gsBack',()=>{ STATE.gate={step:'soldierPick',error:''}; render(); });
  on('gsNew',()=>{ STATE.gate={step:'soldierNew',error:''}; render(); });
  const enterSoldier = x => { STATE.session={role:'soldier', soldierId:x.id}; STATE.tab = 'mydash'; render(); };
  if(g.step==='soldierPick'){
    const draw=q=>{ q=normName(q); const L=DATA.soldiers.slice().sort((a,b)=>a.name.localeCompare(b.name)).filter(x=>normName(x.name).includes(q));
      $('gsList').innerHTML = L.map(x=>`<button data-sid="${x.id}"><span>${esc(x.name)}</span></button>`).join('') || '<p class="sub">No matches. Use "I\'m not on this list".</p>';
      $('gsList').querySelectorAll('[data-sid]').forEach(b=>b.onclick=()=>{ STATE.gate={step:'soldierPin',error:'',sid:b.dataset.sid}; render(); }); };
    draw(''); $('gsQ').oninput=e=>draw(e.target.value);
  }
  if(g.step==='soldierPin'){
    const x=soldierById(g.sid), go=()=>{
      const p1=$('gsP1').value;
      if(x.pinHash){ if(hash(p1)!==x.pinHash){ g.error='Incorrect PIN.'; render(); return; } enterSoldier(x); return; }
      if(p1.length<4){ g.error='PIN must be at least 4 digits.'; render(); return; }
      if(p1!==$('gsP2').value){ g.error='The PINs do not match.'; render(); return; }
      x.pinHash=hash(p1); save(); enterSoldier(x); };
    $('gsGo').onclick=go; $('gsP1').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } }; $('gsP1').focus();
  }
  if(g.step==='soldierNew'){
    $('gsCreate').onclick=()=>{
      const name=$('gsName').value.trim(), age=$('gsAge').value.trim(), p1=$('gsP1').value;
      if(!name){ g.error='Name is required.'; render(); return; }
      if(DATA.soldiers.some(x=>normName(x.name)===normName(name))){ g.error=`${name} is already on the list. Go back and pick your name.`; render(); return; }
      if(age && (!/^\d+$/.test(age)||+age<16||+age>70)){ g.error='Age must be a number from 16 to 70.'; render(); return; }
      if(p1.length<4){ g.error='PIN must be at least 4 digits.'; render(); return; }
      if(p1!==$('gsP2').value){ g.error='The PINs do not match.'; render(); return; }
      const x=fixSoldier({id:uid(), name, age:age?+age:'', sex:$('gsSex').value, rc:false, tryout:false, pinHash:hash(p1)}); FIELDS.forEach(f=>x[f.k]=null);
      DATA.soldiers.push(x); save(); enterSoldier(x);
    };
  }
  on('gCreate',()=>{
    const a=$('p1').value, b=$('p2').value;
    if(a.length<4){ g.error='PIN must be at least 4 digits.'; render(); return; }
    if(a!==b){ g.error='The PINs do not match.'; render(); return; }
    S.adminPinHash=hash(a); save(); enter(g.as||'admin', !!g.as);
  });
  const f=$('gForm');
  // Plain button + Enter key, not a <form>: Claude's sandbox blocks form submission.
  if(f){ const go=()=>{ const p=$('pin').value;
    const want = g.step==='adminLogin' ? S.adminPinHash : S.testerPinHash;
    if(hash(p)!==want){ g.error='Incorrect PIN.'; render(); return; }
    enter(g.step==='adminLogin'?(g.as||'admin'):'grader', !!g.as); };
    $('gSubmit').onclick=go; $('pin').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } }; }
}

function sampleScans(F, rnd){
  const h=F?rnd(61,68):rnd(66,74), w0=F?rnd(125,170):rnd(155,215), p0=F?rnd(18,31):rnd(9,22), out=[];
  ['2026-06-01','2026-07-15','2026-09-01'].forEach((d,i)=>{ const w=w0-i*rnd(0,2), pbf=p0-i*rnd(0,1.2), fm=w*pbf/100, smm=(w-fm)*0.56;
    out.push({date:d, heightIn:h.toFixed(0), weightLb:w.toFixed(1), smmLb:smm.toFixed(1), bodyFatMassLb:fm.toFixed(1), pbf:pbf.toFixed(1), visceralFat:String(Math.round(rnd(3,12))), bmr:String(Math.round(370+21.6*(w-fm)*0.4536)), activityLevel:'standard'}); });
  return out;
}
function samplePractice(rnd){
  const T=['medevac','cff','mission','spot','salute','tccc','grenade','m249','m240b','m4'], n=Math.floor(rnd(0,25)), out=[];
  for(let i=0;i<n;i++) out.push({t:Date.now()-Math.floor(rnd(0,20))*864e5-Math.floor(rnd(0,8e7)), task:T[Math.floor(rnd(0,T.length))], ok:Math.random()<.75, detail:''});
  return out.sort((a,b)=>a.t-b.t);
}

  $('doPaste').onclick=()=>pasteRows($('paste').value);

function pasteRows(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(!lines.length){ toast('Paste some rows first.'); return; }
  let n=0;
  lines.forEach((ln,i)=>{
    const cells = ln.includes('\t') ? ln.split('\t') : ln.split(/,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(x=>x.replace(/^"|"$/g,''));
    if(i===0 && /^\s*name\s*$/i.test(cells[0])) return;
    const [name,age,sex,...rest]=cells.map(x=>x.trim());
    if(!name) return;
    let row=STATE.grid.find(r=>normName(r.name)===normName(name));
    if(!row){ row=STATE.grid.find(r=>!r.name && !r.id); if(!row){ row=blankRow(); STATE.grid.push(row); } }
    row.name=name; if(age) row.age=age; if(sex) row.sex=normSex(sex)||sex;
    visFields().forEach((f,j)=>{ const v=rest[j]; if(v!=null && v!=='') row.vals[f.k] = f.type==='gonogo' ? (normGo(v)||v) : f.type==='yesno' ? (normYes(v)||v) : v; });
    n++;
  });
  toast(`Added ${n} row(s). Check them, then Save all rows.`); render();
}
function saveGrid(){
  const admin=isAdmin(), errs={}, msgs=[]; let created=0, updated=0;
  const work=[], VF=visFields();
  STATE.grid.forEach(r=>{
    const blank = !r.name.trim() && !r.age && !r.sex && VF.every(f=>!String(r.vals[f.k]??'').trim());
    if(blank) return;
    const e = k=>{ errs[r.rid+':'+k]=1; };
    const label = r.name.trim()||'(no name)';
    if(!r.name.trim()){ e('name'); msgs.push('A row has results but no name.'); }
    let target = r.id ? soldierById(r.id) : DATA.soldiers.find(s=>normName(s.name)===normName(r.name));
    const age = String(r.age).trim(), sex = normSex(r.sex);
    if(age && (!/^\d+$/.test(age) || +age<16 || +age>70)){ e('age'); msgs.push(`${label}: age must be a number from 16 to 70.`); }
    if(!target){ if(!age){ e('age'); msgs.push(`${label}: age is required for a new soldier.`); } if(!sex){ e('sex'); msgs.push(`${label}: sex is required for a new soldier.`); } }
    const vals={};
    VF.forEach(f=>{ const p=parseField(f, r.vals[f.k]); if(!p.ok){ e(f.k); msgs.push(`${label}: ${p.msg}.`); } else vals[f.k]=p; });
    work.push({r,target,age,sex,vals});
  });
  STATE.gridErrors=errs;
  if(msgs.length){ render(); $('gridMsg').innerHTML=`<div class="note warn"><b>Nothing was saved.</b> Fix the highlighted cells:<ul class="plain">${[...new Set(msgs)].slice(0,12).map(m=>`<li>${esc(m)}</li>`).join('')}</ul></div>`; return; }
  work.forEach(({r,target,age,sex,vals})=>{
    let s=target;
    if(!s){ s=fixSoldier({id:uid(), name:r.name.trim(), age:+age, sex, rc:true, tryout:true}); FIELDS.forEach(f=>s[f.k]=null); DATA.soldiers.push(s); created++; }
    else { updated++; s.name=r.name.trim()||s.name; if(age) s.age=+age; if(sex) s.sex=sex; s.tryout=true; if(!isRCs(s) && canMoveRC()) s.rc=true; }
    VF.forEach(f=>{ const p=vals[f.k]; if(p.empty){ if(admin) s[f.k]=null; } else s[f.k]=p.val; });
    s.updated=new Date().toISOString();
  });
  save(); STATE.grid=null; STATE.gridErrors={};
  toast(`Saved ${created} new and ${updated} existing soldier(s).`); render();
}

function wireRecorder(kind, getVal){
  const sel=$('rec-'+kind); sel.onchange=()=>{ STATE.rec[kind]=sel.value; showExisting(kind); };
  showExisting(kind);
  $('recSave-'+kind).onclick=()=>{
    const s=soldierById(sel.value); const v=getVal();
    if(!s){ toast('Choose the soldier being tested first.'); return; }
    if(v==null){ toast('Pick a result first.'); return; }
    s[kind]=v; s.updated=new Date().toISOString(); save();
    const label = kind==='grenade' ? `${v}/${DATA.settings.grenadeTotal} (${v>=DATA.settings.grenadeGo?'Go':'No-Go'})` : (v==='go'?'Go':'No-Go');
    toast(`Recorded ${label} for ${s.name}.`); showExisting(kind);
  };
}
function showExisting(kind){
  const s=soldierById($('rec-'+kind).value), box=$('recMsg-'+kind);

function tickClock(){
  const el=$('cffClock'); if(!el) return; const T=STATE.cffTimer;
  const used=T.elapsed+(T.startedAt?Date.now()-T.startedAt:0), left=300-Math.floor(used/1000);

/* generic "do the steps in order" tracker: flags skipped and out-of-order steps */
function orderTracker(steps, seq){
  let firstBad=-1; for(let i=0;i<seq.length;i++){ if(seq[i]!==i){ firstBad=i; break; } }
  const maxDone = seq.length ? Math.max(...seq) : -1;
  const missed = new Set(firstBad>=0 ? steps.map((_,i)=>i).filter(i=>!seq.includes(i) && i<maxDone) : []);
  const complete = firstBad<0 && seq.length===steps.length;
  const list = `<ol class="steps">${steps.map((t,i)=>{ const o=seq.indexOf(i);
      const cls = missed.has(i) ? 'oops' : o<0 ? '' : (firstBad>=0 && o>=firstBad) ? 'oops' : 'done';
      return `<li><button data-os="${i}" class="${cls}"><span class="k">${i+1}</span><span>${esc(t)}</span><span class="mono soft">${missed.has(i)?'skipped':o<0?'':'#'+(o+1)}</span></button></li>`; }).join('')}</ol>`;
  const status = !seq.length ? '<span class="soft">Nothing tapped yet.</span>'
    : firstBad>=0 ? `<span class="flag">Out of order: "${esc(steps[seq[firstBad]])}" was done before "${esc(steps[firstBad])}".</span>`
    : complete ? '<span class="badge b-good">All steps, in order</span>' : `<span class="soft">${seq.length} of ${steps.length} done, in order so far.</span>`;
  return {list, status, complete, bad:firstBad>=0};
}

/* ============================== 9-line, SPOT, SALUTE: spoken or typed ============================== */
const REPORT_GEN = { medevac:f=>Drill.genMedevac(f), spot:f=>Drill.genSpot(f,{range:STATE.spotRange!==false}), salute:f=>Drill.genSalute(f) };
const normRpt = v => String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function countMap(v){ const m={}; String(v||'').toUpperCase().replace(/(\d+)\s*([A-Z])\b/g,(_,n,l)=>{ m[l]=(m[l]||0)+ +n; return ''; }); return JSON.stringify(Object.keys(m).sort().map(k=>k+m[k])); }
function letterSet(v){ return [...new Set(String(v||'').toUpperCase().split(/[^A-Z]+/).filter(t=>t.length===1))].sort().join(''); }
// Returns true/false for lines the tool can grade, or null when the grader has to judge the wording.
function autoCheck(line, typed){
  if(!String(typed||'').trim()) return false;
  switch(line.check){
    case 'grid': case 'dtg': return normRpt(typed)===normRpt(line.ans);
    case 'count': return countMap(typed)===countMap(line.ans) && countMap(line.ans)!=='[]';
    case 'letters': return letterSet(typed)===letterSet(line.ans) && letterSet(line.ans)!=='';
    case 'freqcs': return line.parts.every(p=>normRpt(typed).includes(normRpt(p)));
    case 'range': { const n=parseFloat(String(typed).replace(/[^0-9.]/g,'')); return isFinite(n) && Math.abs(n-line.exact)<=Math.max(2, line.exact*0.02); }
    default: return null;
  }
}
function newReport(k){ return {sc:REPORT_GEN[k](!STATE.randomCalls), marks:{}, typed:{}, submitted:false}; }

  }
  el.innerHTML = `<div class="stack">

      <p class="sub">Go means every line is correct. Choose how the soldier sends it before you start.</p>

  const sb=$('rpSubmit'); if(sb) sb.onclick=()=>{ R.submitted=true; R.marks={}; key.forEach((l,i)=>{ const a=autoCheck(l,R.typed[i]); if(a!==null) R.marks[i]=a?'ok':'bad'; }); render(); };

/* ============================== custom PT test builder (admin) ============================== */
const NB = AGE_BRACKETS.length;
const shortId = p => p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function ctBlankRows(n){ return Array.from({length:n},()=>({p:'', v:Array(NB).fill('')})); }
function ctNewEvent(){ return {id:shortId('e'), name:'', type:'numHigh', unit:'', min:'', allAges:false, tables:{M:ctBlankRows(5), F:ctBlankRows(5)}}; }
function ctNewDraft(){ return {id:shortId('t'), isNew:true, name:'', short:'', totalMin:'', failCut:true, events:[ctNewEvent()]}; }
function ctToDraft(t){
  const show=(e,v)=> v==null ? '' : (CT_TYPES[e.type]||{}).time ? fmtTime(v) : String(v);
  return {id:t.id, isNew:false, name:t.name, short:t.short||'', totalMin:t.totalMin??'', failCut:!!t.failCut,
    events:t.events.map(e=>({id:e.id, name:e.name, type:e.type, unit:e.unit||'', min:e.min??'', allAges:!!e.allAges,
      tables:{M:(e.tables.M||[]).map(r=>({p:String(r.p), v:Array.from({length:NB},(_,i)=>show(e,r.v[i]))})),
              F:(e.tables.F||[]).map(r=>({p:String(r.p), v:Array.from({length:NB},(_,i)=>show(e,r.v[i]))}))}}))};
}
// Check the draft and turn it into a saved test. Returns {test} or {errors}.
function ctFromDraft(d){
  const errs=[], num=v=>String(v).trim()===''?null:+v;
  if(!d.name.trim()) errs.push('Give the test a name.');
  const short=(d.short.trim()||d.name.trim().slice(0,8)).slice(0,10);
  if(['AFT','CFT'].includes(short.toUpperCase())) errs.push('Use a short name other than AFT or CFT.');
  const totalMin=num(d.totalMin); if(totalMin!=null && !(totalMin>=0)) errs.push('Minimum total must be a number, or blank.');
  if(!d.events.length) errs.push('Add at least one event.');
  const events=d.events.map((e,ei)=>{
    const label=e.name.trim()||`Event ${ei+1}`, ty=CT_TYPES[e.type]||CT_TYPES.numHigh;
    if(!e.name.trim()) errs.push(`Event ${ei+1} needs a name.`);
    const min=num(e.min); if(min!=null && !(min>=0)) errs.push(`${label}: minimum points must be a number, or blank.`);
    const tables={};
    ['M','F'].forEach(sx=>{
      const cols = e.allAges ? 1 : NB, rows=[];
      e.tables[sx].forEach(r=>{
        const vals=r.v.slice(0,cols).map(x=>String(x).trim());
        if(String(r.p).trim()==='' && vals.every(x=>x==='')) return;
        const p=+r.p; if(String(r.p).trim()==='' || isNaN(p)) { errs.push(`${label} (${sx==='M'?'men':'women'}): every row needs a points number.`); return; }
        const v=vals.map((x,ci)=>{ if(x==='') return null; const pv = ty.time ? parseTime(x) : (/^\d+(\.\d+)?$/.test(x)?+x:NaN);
          if(pv==null || isNaN(pv)){ errs.push(`${label} (${sx==='M'?'men':'women'}), ${p} points${e.allAges?'':', ages '+AGE_BRACKETS[ci][1]}: "${x}" isn't ${ty.time?'a time like 14:30':'a number'}.`); return null; } return pv; });
        rows.push({p, v});
      });
      if(!rows.some(r=>r.v.some(v=>v!=null))) errs.push(`${label}: the ${sx==='M'?"men's":"women's"} table is empty.${sx==='F'?' Use "Copy men\'s table to women\'s" if they are the same.':''}`);
      tables[sx]=rows.sort((a,b)=>b.p-a.p);
    });
    return {id:e.id, name:e.name.trim(), type:e.type, unit:ty.time?'':e.unit.trim(), min, allAges:!!e.allAges, tables};
  });
  if(errs.length) return {errors:[...new Set(errs)]};
  return {test:{id:d.id, name:d.name.trim(), short, totalMin, failCut:!!d.failCut, events}};
}
function ctParsePaste(text, allAges){
  const out=[];
  text.split(/\r?\n/).forEach(line=>{
    if(!line.trim()) return;
    const cells=(line.includes('\t')?line.split('\t'):line.split(/,|\s{2,}/)).map(x=>x.trim());
    if(isNaN(+cells[0]) || cells[0]==='') return;           // skip header rows
    const v=Array(NB).fill(''); cells.slice(1, allAges?2:NB+1).forEach((x,i)=>v[i]=x);
    out.push({p:cells[0], v});
  });
  return out;
}

    $('ctRow1').onclick=()=>{ e.tables[sx].push(...ctBlankRows(1)); render(); };
    $('ctRow10').onclick=()=>{ e.tables[sx].push(...ctBlankRows(10)); render(); };
    $('ctCopy').onclick=()=>{ e.tables.F=clone(e.tables.M); STATE.ctSex='F'; toast("Copied the men's table to women's."); render(); };
    $('ctDoPaste').onclick=()=>{ const rows=ctParsePaste($('ctPaste').value, e.allAges); if(!rows.length){ toast('No rows found. Points go in the first column.'); return; } e.tables[sx]=rows; toast(`Pasted ${rows.length} rows.`); render(); };
    $('ctEvDel').onclick=()=>{ d.events.splice(STATE.ctEv,1); STATE.ctEv=Math.max(0,STATE.ctEv-1); render(); };
  }
  $('ctCancel').onclick=()=>{ STATE.ctDraft=null; render(); };
  $('ctSave').onclick=()=>{
    const r=ctFromDraft(d);
    if(r.errors){ $('ctErr').innerHTML=`<div class="note warn"><b>Not saved yet.</b><ul class="plain">${r.errors.slice(0,15).map(m=>`<li>${esc(m)}</li>`).join('')}</ul>${r.errors.length>15?`<p class="sub">\u2026and ${r.errors.length-15} more.</p>`:''}</div>`; return; }
    const i=S.customTests.findIndex(t=>t.id===r.test.id);
    if(i>=0) S.customTests[i]=r.test; else { S.customTests.push(r.test); S.enabled[ctKey(r.test)]=true; if(S.physWeights[ctKey(r.test)]==null) S.physWeights[ctKey(r.test)]=50; }
    rebuildRegistry(); STATE.ctDraft=null; STATE.grid=null; save();
    toast(`Saved ${r.test.name}. ${d.isNew?'It is checked under Events that count.':''}`); render(); window.scrollTo(0,0);
  };
}

const GOALS = [
  { id:'cut', label:'Cut', calAdj:-500, proteinPerLb:1.2, fatPerLb:0.30 },
  { id:'maintain', label:'Maintain', calAdj:0, proteinPerLb:1.1, fatPerLb:0.35 },

];
const FOOD_TIPS = {
  cut: { tip:'Prioritize high-volume, high-protein, lower-calorie-density foods so you stay full while eating less overall.',
    protein:['Chicken breast','Egg whites / eggs','White fish (tilapia, cod)','Nonfat Greek yogurt','Whey protein shake'],

    protein:['Beef, chicken thighs, pork loin','Eggs','Salmon','Greek yogurt','Protein shake with milk'],
    carb:['Rice, pasta, potatoes (larger portions)','Granola / oats','Fruit smoothies','Whole grain bread'],
    fat:['Nuts and nut butter','Olive oil / avocado oil','Whole milk / cheese','Avocado'] },
};
const SCAN_FIELDS = [
  ['heightIn','Height (in)'],['weightLb','Weight (lb)'],['smmLb','Skeletal muscle mass (lb)'],['bodyFatMassLb','Body fat mass (lb)'],
  ['pbf','Percent body fat'],['visceralFat','Visceral fat level'],['bmr','BMR (kcal)'],
];
const numv = v => { const n=parseFloat(v); return Number.isFinite(n) ? n : 0; };
const genderOf = s => s.sex==='F' ? 'female' : 'male';
function fixSoldier(s){ if(s.tryout==null) s.tryout=true; if(!Array.isArray(s.scans)) s.scans=[]; if(!Array.isArray(s.practice)) s.practice=[]; return s; }
function tryoutSoldiers(){ return DATA.soldiers.filter(s=>s.rc!==false && s.tryout!==false); }
const latestScan = s => (s.scans&&s.scans[s.scans.length-1]) || null;
const prevScan = s => s.scans&&s.scans.length>1 ? s.scans[s.scans.length-2] : null;
const withScans = () => scopeRoster().filter(s=>fixSoldier(s).scans.length);
function activityById(id){ return ACTIVITY_LEVELS.find(a=>a.id===id) || ACTIVITY_LEVELS[1]; }
function fmtDay(d){ if(!d) return '\u2013'; const dt=new Date(d+'T00:00:00'); return isNaN(dt) ? d : dt.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

// ---- the tracker's math, unchanged ----
function calcTargets(scan){
  if(!scan) return null;
  const activity=activityById(scan.activityLevel), bmr=numv(scan.bmr), weightLb=numv(scan.weightLb), tdee=bmr*activity.mult, goals={};
  GOALS.forEach(g=>{ const calories=tdee+g.calAdj, proteinG=g.proteinPerLb*weightLb, fatG=g.fatPerLb*weightLb, carbG=Math.max((calories-proteinG*4-fatG*9)/4,0);
    goals[g.id]={calories:Math.round(calories), proteinG:Math.round(proteinG), fatG:Math.round(fatG), carbG:Math.round(carbG)}; });
  return {tdee:Math.round(tdee), goals, waterOz:Math.round(weightLb*0.55+activity.waterAdd)};
}
function pbfRange(g){ return g==='female' ? [16,27] : [6,17]; }
function pbfStatus(g, pbf){ const [lo,hi]=pbfRange(g); if(pbf===''||pbf==null||Number.isNaN(pbf)) return 'unknown'; if(pbf<lo) return 'below'; if(pbf>hi) return pbf<=hi+5?'above-slight':'above'; return 'optimal'; }
function statusLabel(st){ return {optimal:'In target range','above-slight':'Slightly above target',above:'Above target',below:'Below target'}[st] || 'No scan yet'; }
function statusBadge(st){ const c={optimal:'b-good','above-slight':'b-brass',above:'b-bad',below:'b-brass'}[st]||'b-none'; return `<span class="badge ${c}">${statusLabel(st)}</span>`; }
function bmiOf(w,h){ h=numv(h); w=numv(w); if(!h) return null; return +(703*w/(h*h)).toFixed(1); }
function focusAreas(s){
  const scan=latestScan(s), prev=prevScan(s), g=genderOf(s), notes=[], st=pbfStatus(g, numv(scan.pbf)), [lo,hi]=pbfRange(g);
  if(st==='above') notes.push(`Body fat ${scan.pbf}% is well above the ${lo}\u2013${hi}% target range. Shift toward cut targets and add conditioning volume.`);
  else if(st==='above-slight') notes.push(`Body fat ${scan.pbf}% is only slightly above the ${lo}\u2013${hi}% target range. That's close enough that a cut may not be the right call, especially if strength and performance are already strong. Consider a performance-build or maintain approach and focus on muscle growth rather than a deficit.`);
  else if(st==='below') notes.push(`Body fat ${scan.pbf}% sits below the ${lo}\u2013${hi}% range. Make sure intake still supports recovery, not just leanness.`);
  else notes.push(`Body fat ${scan.pbf}% is within the ${lo}\u2013${hi}% target range. Hold the current approach.`);
  if(numv(scan.visceralFat)>=10) notes.push(`Visceral fat level ${scan.visceralFat} is elevated. Prioritize cardio conditioning and diet quality.`);
  // Only compare a measure when both scans have it (a blank is not a zero).
  const both = k => prev && String(scan[k]??'').trim()!=='' && String(prev[k]??'').trim()!=='';
  if(prev){ const smmD=both('smmLb')?numv(scan.smmLb)-numv(prev.smmLb):0, fatD=both('bodyFatMassLb')?numv(scan.bodyFatMassLb)-numv(prev.bodyFatMassLb):0;
    if(smmD<=-1) notes.push(`Lean mass is down ${Math.abs(smmD).toFixed(1)} lb since the last scan. Increase protein and resistance-training volume.`);
    else if(smmD>=1) notes.push(`Lean mass is up ${smmD.toFixed(1)} lb since the last scan. The protein target is working; hold steady.`);
    if(fatD>=2) notes.push(`Fat mass is up ${fatD.toFixed(1)} lb since the last scan. Reassess the calorie target for the stated goal.`);

}
function bmrSmmStats(list){
  const r=list.map(s=>{ const sc=latestScan(s); return numv(sc.smmLb) ? numv(sc.bmr)/numv(sc.smmLb) : null; }).filter(v=>v!=null);
  const mean=r.reduce((a,b)=>a+b,0)/(r.length||1), v=r.reduce((a,b)=>a+(b-mean)**2,0)/(r.length||1); return {mean, sd:Math.sqrt(v)};
}
function riskFlags(s, stats){
  const scan=latestScan(s), flags=[];
  if(numv(scan.visceralFat)>=10) flags.push({label:'Elevated visceral fat', level:numv(scan.visceralFat)>=15?'high':'moderate'});
  const ratio=numv(scan.smmLb) ? numv(scan.bmr)/numv(scan.smmLb) : null;
  if(ratio!=null && stats.sd>0 && (ratio-stats.mean)/stats.sd < -1.5) flags.push({label:'BMR low relative to muscle mass vs. team average. Recommend follow-up.', level:'moderate'});
  const t=calcTargets(scan), floor=genderOf(s)==='female'?1200:1500;

}

function teamOverview(list){

  const n=list.length; return {avgWeight:+(w/n).toFixed(1), avgBMI:bn?+(b/bn).toFixed(1):null, avgSMM:+(smm/n).toFixed(1), avgPBF:+(pbf/n).toFixed(1), bmiExcluded:bx};
}
function unitTrend(list){

function parseScanText(text){

}

// One measure per chart, each with its own scale (never two units on one axis). Hover a point for its value.
function miniLine(data, key, title, unit){
  const W=340, H=150, m={t:22,r:44,b:26,l:36}, iw=W-m.l-m.r, ih=H-m.t-m.b, vals=data.map(d=>d[key]);
  let lo=Math.min(...vals), hi=Math.max(...vals); const pad=Math.max((hi-lo)*0.15, 1); lo=Math.floor(lo-pad); hi=Math.ceil(hi+pad);
  const X=i=> m.l + (data.length>1 ? i*iw/(data.length-1) : iw/2), Y=v=> m.t + ih - (v-lo)/(hi-lo||1)*ih;
  const ticks=[lo, (lo+hi)/2, hi].map(v=>+v.toFixed(0));
  const grid=ticks.map(v=>`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l-6}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="var(--inkSoft)">${v}</text>`).join('');
  const pts=data.map((d,i)=>`${X(i)},${Y(d[key])}`).join(' ');
  const last=data[data.length-1];
  const dots=data.map((d,i)=>`<g><circle cx="${X(i)}" cy="${Y(d[key])}" r="10" fill="transparent">${'<'+'title>'}${esc(d.label)}: ${d[key]} ${unit}${'<'+'/title>'}</circle><circle cx="${X(i)}" cy="${Y(d[key])}" r="4" fill="var(--navy)" stroke="var(--panel)" stroke-width="2" pointer-events="none"/></g>`).join('');
  return `<figure class="mini"><figcaption>${esc(title)}</figcaption>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}: ${data.map(d=>d.label+' '+d[key]).join(', ')}" style="width:100%;height:auto;display:block">
      ${grid}<polyline points="${pts}" fill="none" stroke="var(--navy)" stroke-width="2"/>${dots}
      <text x="${X(data.length-1)+8}" y="${Y(last[key])+4}" font-size="11" fill="var(--ink)" font-weight="600">${last[key]}</text>
      <text x="${m.l}" y="${H-6}" font-size="10" fill="var(--inkSoft)">${esc(data[0].label)}</text>${data.length>1?`<text x="${W-m.r}" y="${H-6}" font-size="10" text-anchor="end" fill="var(--inkSoft)">${esc(last.label)}</text>`:''}
    </svg></figure>`;
}

/* ---------- practice progress stored on a soldier ---------- */
function practiceSummary(s){
  const L=s.practice||[]; if(!L.length) return null;

const PROG=[['weightLb','Weight','lb',0],['smmLb','Skeletal muscle mass','lb',1],['bodyFatMassLb','Body fat mass','lb',-1],['pbf','Body fat','%',-1],['visceralFat','Visceral fat level','',-1]];
function progressPanel(s){
  const L=s.scans.filter(x=>x.date); if(L.length<2) return L.length?`<div class="panel"><h3 style="margin-top:0">Progress over time</h3><p class="sub" style="margin:0">One scan so far. Progress charts start with the second scan.</p></div>`:'';
  const first=L[0], last=L[L.length-1], days=Math.round((new Date(last.date)-new Date(first.date))/864e5);
  const has=(sc,k)=>String(sc[k]??'').trim()!=='';
  const cells=PROG.map(([k,l,u,good])=>{ const pts=L.filter(x=>has(x,k)); if(pts.length<2) return null; const d=numv(pts[pts.length-1][k])-numv(pts[0][k]);
    const tone = !good||Math.abs(d)<0.05 ? '' : (d*good>0 ? 'up-good' : 'up-bad');
    return {k,l,u,d,tone,first:pts[0][k],last:pts[pts.length-1][k],pts}; }).filter(Boolean);
  const val=(x,k)=>has(x,k)?numv(x[k]):null, labels=L.map(x=>fmtDay(x.date)), [lo,hi]=pbfRange(genderOf(s));
  const lbSets=[['weightLb','Weight'],['smmLb','Muscle mass'],['bodyFatMassLb','Body fat mass']].filter(([k])=>L.filter(x=>has(x,k)).length>=2).map(([k,l])=>({label:l, data:L.map(x=>val(x,k))}));

    <p class="sub" style="font-size:12.5px;margin:6px 0 12px">Green means moving the right way (more muscle, less fat); red means the wrong way. Weight has no color because the right direction depends on the goal.</p>

    <details class="tbl"><summary>Show as a table</summary><div class="scroll"><table><thead><tr><th>Date</th>${cells.map(c=>`<th class="num">${c.l}${c.u?` (${c.u})`:''}</th>`).join('')}</tr></thead><tbody>${L.map(x=>`<tr><td>${fmtDay(x.date)}</td>${cells.map(c=>`<td class="num">${esc(x[c.k]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details></div>`;

function practiceTeamCharts(){
  const since=Date.now()-30*864e5, all=[]; scopeRoster().forEach(s=>(s.practice||[]).forEach(e=>all.push(e)));
  const rows=Drill.PTASKS.map(([k,l])=>{ const L=all.filter(e=>e.task===k && e.t>=since); return {l, n:L.length, ok:L.filter(e=>e.ok).length}; }).filter(r=>r.n).sort((a,b)=>a.ok/a.n-b.ok/b.n);
  const weeks=[]; const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7));
  for(let i=7;i>=0;i--){ const a=new Date(d); a.setDate(a.getDate()-7*i); const b=new Date(a); b.setDate(b.getDate()+7); weeks.push({l:a.toLocaleDateString([], {month:'short', day:'numeric'}), n:all.filter(e=>e.t>=a.getTime()&&e.t<b.getTime()).length}); }
  return `<div class="two" style="margin-bottom:14px">
    <div><h3 class="chart-h">Right on each task, last 30 days</h3>${rows.length?barChart(rows.map(r=>r.l), rows.map(r=>Math.round(r.ok/r.n*100)), {horizontal:true, y:'pct', label:'Right', good:goodPct, after:i=>`${rows[i].ok} of ${rows[i].n} tries`}):'<p class="sub">No practice in the last 30 days.</p>'}</div>
    <div><h3 class="chart-h">Practice tries per week <span style="font-weight:400">(week starting)</span></h3>${barChart(weeks.map(w=>w.l), weeks.map(w=>w.n), {label:'Tries', after:i=>'Week of '+weeks[i].l})}</div></div>${(()=>{ const h=Drill.lineMissHtml(all.filter(e=>e.t>=since), {h:'chart-h', wrap:'two'}); return h?`<div style="margin-bottom:14px">${h}</div>`:''; })()}`;

/* ============================== rope bridge, ruck, and run times ============================== */
// Every logged time lives in DATA.timeLogs: {id, kind:'rope'|'ruck'|'run', date, sec, dist?, team? | sid?, note?}
// Team times carry a team name and show on the admin Dashboard. Individual times carry a soldier id (sid) and show on that soldier's Individual page.
const TL_KINDS = {
  rope:{label:'Rope bridge', ex:'3:42', fmt:'m:ss'},
  ruck:{label:'Ruck', ex:'2:48:30', fmt:'h:mm:ss'},
  run:{label:'Run', ex:'14:05', fmt:'m:ss'},
};
function timeLogs(){ if(!Array.isArray(DATA.timeLogs)) DATA.timeLogs=[]; return DATA.timeLogs; }
function parseLong(s){
  s=String(s==null?'':s).trim(); if(!s) return null;
  // Digits only works too (phone number pads have no colon): 352 = 3:52, 24830 = 2:48:30.
  if(/^\d{3,6}$/.test(s)){ const p=s.padStart(6,'0'); s=(+p.slice(0,2)?(+p.slice(0,2))+':':'')+(+p.slice(0,2)?p.slice(2,4):String(+p.slice(2,4)))+':'+p.slice(4); }
  let m=s.match(/^(\d{1,2}):([0-5]\d):([0-5]\d)$/); if(m) return (+m[1])*3600+(+m[2])*60+(+m[3]);
  return parseTime(s);
}
function fmtLong(sec){ if(sec==null||isNaN(sec)) return ''; sec=Math.round(sec); if(sec<3600) return fmtTime(sec); const h=Math.floor(sec/3600), r=sec%3600; return h+':'+String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0'); }
const tlDist = d => { const n=+d; return isFinite(n)&&n>0 ? String(Math.round(n*100)/100) : ''; };
const tlPace = e => e.dist>0 ? fmtTime(e.sec/e.dist)+'/mi' : '';
const tlDate = d => { if(!d) return ''; const [y,m,dd]=d.split('-'), dt=new Date(+y,+m-1,+dd); return dt.toLocaleDateString([], dt.getFullYear()===new Date().getFullYear() ? {month:'short', day:'numeric'} : {month:'short', day:'numeric', year:'numeric'}); };
const tlNewest = (a,b) => a.date<b.date?1:a.date>b.date?-1:0;
// who: 'team' for team times, or a soldier id for that soldier's own times.
function tlOf(kind, who){ return timeLogs().filter(e=>e.kind===kind && (who==='team' ? !e.sid : e.sid===who)); }
function tlDistances(list){
  const n={}; list.forEach(e=>{ const k=tlDist(e.dist); if(k) n[k]=(n[k]||0)+1; });
  return Object.keys(n).sort((a,b)=>n[b]-n[a] || +a-+b);
}
const tlKey = (kind, who) => (who==='team'?'team':'ind')+':'+kind;
function tlPickDist(kind, who, list){
  const k=tlKey(kind,who), ds=tlDistances(list);
  if(!ds.includes(STATE.tl.dist[k])) STATE.tl.dist[k]=ds[0]||null;
  return {ds, d:STATE.tl.dist[k]};
}

function tlTrendSvg(entries, caption){
  // Best time per day, oldest to newest. Lower is faster.
  const byDay={}; entries.forEach(e=>{ if(!byDay[e.date] || e.sec<byDay[e.date]) byDay[e.date]=e.sec; });
  const days=Object.keys(byDay).sort();
  if(days.length<2) return '';
  return `<h3 class="chart-h">${esc(caption)} <span style="font-weight:400">(lower is faster)</span></h3>${lineChart(days.map(tlDate), [{label:'Best time', data:days.map(d=>byDay[d])}], {y:'time', label:caption})}`;
}

/* ---------- average times as a ranking event ---------- */
// Each soldier's average time at one set distance, scored like the CFT: a time worth 100 points, a time worth 0, straight line between.
// On a 500 scale it blends into the physical score by its weight, the same as any PT test.
const TIME_EVENTS=[{k:'avgrun', kind:'run', short:'Run avg', name:'Average run time'},{k:'avgruck', kind:'ruck', short:'Ruck avg', name:'Average ruck time'}];
const AVG_DEFAULTS={run:{dist:2, best:720, zero:1080}, ruck:{dist:12, best:9000, zero:12600}};
function avgCfg(kind){ return Object.assign({}, AVG_DEFAULTS[kind], ((DATA.settings.avgTimes||{})[kind])||{}); }
function avgTime(s, kind){
  const c=avgCfg(kind), d=tlDist(c.dist), L=tlOf(kind,s.id).filter(e=>tlDist(e.dist)===d && (!e.self || DATA.settings.countSelfTimes));
  if(!L.length) return {n:0, avg:null, pts:null, dist:d};
  const avg=L.reduce((a,e)=>a+e.sec,0)/L.length;
  const pts= avg<=c.best ? 100 : avg>=c.zero ? 0 : (c.zero-avg)/(c.zero-c.best)*100;
  return {n:L.length, avg, pts, dist:d};
}
function timeEventsOn(){ return TIME_EVENTS.filter(e=>isOn(e.k)); }
function avgLine(s, kind){
  const te=TIME_EVENTS.find(e=>e.kind===kind); if(!isOn(te.k)) return '';
  const a=avgTime(s,kind), unit=kind==='run'?'run':'ruck';
  return `<div class="note info" style="margin:0 0 10px">${a.n
    ? `Average ${a.dist} mi ${unit}: <b class="mono">${fmtLong(a.avg)}</b> over ${a.n} ${unit}${a.n===1?'':'s'} = <b class="mono">${fmt1(a.pts)}</b> points toward the rankings.`
    : `The average ${a.dist} mi ${unit} time counts toward the rankings. No ${a.dist} mi ${unit}s logged yet, so it's 0 points for now.`}${!DATA.settings.countSelfTimes && tlOf(kind,s.id).some(e=>e.self)?' Self-logged times don\'t count toward the rankings.':''}</div>`;
}

    </div>
    <div class="panel" style="padding:8px 14px">
      ${people.length?`<table class="wk-table"><thead><tr><th>Soldier</th><th>Time (${TL_KINDS[W.kind].fmt})</th></tr></thead><tbody>
        ${people.map(s=>{ const ex=existing(s.id); return `<tr><td><span class="wk-name">${esc(s.name)}</span>${ex?`<small class="soft">already logged ${fmtLong(ex.sec)}</small>`:''}</td>
          <td><input class="input wk-in ${W.bad[s.id]?'bad':''}" data-wk="${s.id}" inputmode="numeric" autocomplete="off" value="${esc(W.vals[s.id]||'')}" placeholder="${ex?fmtLong(ex.sec):''}" aria-label="${esc(s.name)} time"></td></tr>`; }).join('')}
      </tbody></table>`:`<p class="sub" style="padding:10px 0">No one is on the roster yet.</p>`}
    </div>
    <div class="panel wk-bar">
      <div class="row"><button class="btn primary" id="wkSave">Save times</button><span id="wkMsg" class="sub" style="margin:0;font-size:13px"></span></div>
    </div>
  </div>`;
  const keep=()=>{ W.date=$('wk_date').value||todayISO(); W.dist=$('wk_dist').value.trim(); W.note=$('wk_note').value.trim(); c.querySelectorAll('[data-wk]').forEach(i=>W.vals[i.dataset.wk]=i.value.trim()); };
  c.querySelectorAll('[data-wkkind]').forEach(b=>b.onclick=()=>{ keep(); if(W.kind!==b.dataset.wkkind){ W.kind=b.dataset.wkkind; W.dist=String(avgCfg(W.kind).dist); W.vals={}; W.bad={}; } W.flash=''; render(); });
  ['wk_date','wk_dist'].forEach(id=>$(id).onchange=()=>{ keep(); W.flash=''; render(); });
  const ins=[...c.querySelectorAll('[data-wk]')];
  ins.forEach((el,i)=>el.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); if(ins[i+1]) ins[i+1].focus(); else $('wkSave').focus(); } }));
  $('wkSave').onclick=()=>{
    keep(); W.bad={};
    const dist=+W.dist;
    if(!(dist>0&&dist<100)){ $('wk_dist').classList.add('bad'); $('wkMsg').innerHTML='<span style="color:var(--alert)">Enter the distance in miles, like 2 or 12.</span>'; return; }
    const rows=[]; people.forEach(s=>{ const raw=W.vals[s.id]; if(!raw) return; const sec=parseLong(raw); if(sec==null||isNaN(sec)||sec<=0) W.bad[s.id]=true; else rows.push({s,sec}); });
    if(Object.keys(W.bad).length){ render(); $('wkMsg').innerHTML=`<span style="color:var(--alert)">Fix the ${Object.keys(W.bad).length} time${Object.keys(W.bad).length===1?'':'s'} outlined in red (${TL_KINDS[W.kind].fmt}, like ${TL_KINDS[W.kind].ex}). Nothing was saved yet.</span>`; const f=c.querySelector('.wk-in.bad'); if(f) f.focus(); return; }
    if(!rows.length){ $('wkMsg').innerHTML='<span style="color:var(--alert)">Type at least one time first.</span>'; return; }
    const D=Math.round(dist*100)/100, dd=tlDist(D);
    let replaced=0;
    rows.forEach(({s,sec})=>{
      const old=timeLogs().filter(e=>e.kind===W.kind && e.sid===s.id && e.date===W.date && tlDist(e.dist)===dd); replaced+=old.length ? 1 : 0;
      DATA.timeLogs=timeLogs().filter(e=>!old.includes(e));
      const e={id:uid(), kind:W.kind, date:W.date, sid:s.id, dist:D, sec}; if(W.note) e.note=W.note; timeLogs().push(e);
    });
    save();
    W.flash=`Saved ${rows.length} ${W.kind} time${rows.length===1?'':'s'} for ${tlDate(W.date)}, ${dd} mi${replaced?` (${replaced} replaced an earlier entry)`:''}.`;
    W.vals={}; render(); window.scrollTo(0,0);
  };
}

function agoText(t){ const m=Math.round((Date.now()-t)/60000); if(m<1) return 'just now'; if(m<60) return m+' min ago'; const h=Math.round(m/60); if(h<24) return h+' hr ago'; const d=Math.round(h/24); return d===1?'yesterday':d<7?d+' days ago':new Date(t).toLocaleDateString([], {month:'short', day:'numeric'}); }

// Which screens each kind of user gets. tabs = every screen in desktop order; bar = the phone bottom bar; the rest go under More.

  const news = whatsNewReady() ? [{id:'news', label:'What\'s new', icon:'news'}] : [];

  news.push(themeA);

    tabs:[['home','Home'],['people','People'],['grade','Grade'],['cal','Calendar'],['ref','Reference'],['data','Export / import'],...(role==='leader'?[]:[['settings','Settings']])],

    tabs:[['mydash','Home'],['myhealth','My health'],['mylog','Log my scan'],...(meSoldier() && isRCs(meSoldier()) && meSoldier().tryout!==false?[['myresults','My tryout results']]:[]),['cal','Calendar'],['mytimes','My times'],['mypractice','Practice'],['ref','Reference']],
    bar:['mydash','cal','mytimes','mypractice'], actions:[{id:'myexport', label:'Export my data', icon:'export'}, shareA, ...news, outA]};
  if(role==='practice') return {
    tabs:[['practice','Practice'],['ref','Reference']], bar:['practice','ref'], barActions:[shareA, {id:'signout', label:'Exit', icon:'signout'}], actions:[...news]};
  return { // grader
    tabs:[['grade','Grade'],['cal','Calendar'],['ref','Reference'],['data','Export / import']],
    primary:['grade','cal','ref'], bar:['grade','cal','ref'], actions:[{id:'events', label:'Change events', icon:'events'}, shareA, ...news, outA]};

  const openMore=()=>{ sheet.hidden=false; const f=sheet.querySelector('.sheet-item'); if(f) f.focus(); };
  const mb=$('bbMore'); if(mb) mb.onclick=openMore;
  const tm=$('tabMore'); if(tm) tm.onclick=openMore;

  sheet.onclick=e=>{ if(e.target===sheet) sheet.hidden=true; };
  sheet.onkeydown=e=>{ if(e.key==='Escape') sheet.hidden=true; };
  if(syncActive()) syncStatus();
  wireCalReminder($('calRemind'));
  const c=$('content');
  if(STATE.tab==='cal'){ renderCalendar(c); return null; }
  if(STATE.tab==='ref'){ renderReference(c); return null; }
  if(STATE.tab==='share'){ c.innerHTML=shareHtml(); wireShare(c); return null; }
  return c;
}
function shellAction(id, role){
  if(id==='signout') return signOut();
  if(id==='share'){ STATE.tab='share'; render(); window.scrollTo(0,0); return; }

function keepPref(){ try{ return localStorage.getItem(KEEP_KEY)==='1'; }catch(e){ return false; } }

function rememberSession(){
  const s=STATE.session;
  if(!s || s.role==='practice' || !keepPref()) return;

}
function forgetSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
function restoreSession(){
  if(SYNC.on){ syncRestore(); return; }
  if(!keepPref()) return;
  let v=null; try{ v=JSON.parse(localStorage.getItem(SESSION_KEY)||'null'); }catch(e){}
  if(!v || !v.role) return;
  if(v.role==='admin' && !DATA.settings.adminPinHash) return forgetSession();
  if(v.role==='soldier' && !soldierById(v.soldierId)) return forgetSession();

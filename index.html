const SCAN_FIELDS = [
  ['heightIn','Height (in)'],['weightLb','Weight (lb)'],['smmLb','Skeletal muscle mass (lb)'],['bodyFatMassLb','Body fat mass (lb)'],
  ['pbf','Percent body fat'],['visceralFat','Visceral fat level'],['bmr','BMR (kcal)'],
];
const numv = v => { const n=parseFloat(v); return Number.isFinite(n) ? n : 0; };
const genderOf = s => s.sex==='F' ? 'female' : 'male';
function fixSoldier(s){ if(s.tryout==null) s.tryout=true; if(!Array.isArray(s.scans)) s.scans=[]; if(!Array.isArray(s.practice)) s.practice=[]; return s; }
function tryoutSoldiers(){ return DATA.soldiers.filter(s=>s.tryout!==false); }
const latestScan = s => (s.scans&&s.scans[s.scans.length-1]) || null;
const prevScan = s => s.scans&&s.scans.length>1 ? s.scans[s.scans.length-2] : null;
const withScans = () => DATA.soldiers.filter(s=>fixSoldier(s).scans.length);
function activityById(id){ return ACTIVITY_LEVELS.find(a=>a.id===id) || ACTIVITY_LEVELS[1]; }
function fmtDay(d){ if(!d) return '\u2013'; const dt=new Date(d+'T00:00:00'); return isNaN(dt) ? d : dt.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

// ---- the tracker's math, unchanged ----
function calcTargets(scan){
  if(!scan) return null;
  const activity=activityById(scan.activityLevel), bmr=numv(scan.bmr), weightLb=numv(scan.weightLb), tdee=bmr*activity.mult, goals={};
  GOALS.forEach(g=>{ const calories=tdee+g.calAdj, proteinG=g.proteinPerLb*weightLb, fatG=g.fatPerLb*weightLb, carbG=Math.max((calories-proteinG*4-fatG*9)/4,0);
    goals[g.id]={calories:Math.round(calories), proteinG:Math.round(proteinG), fatG:Math.round(fatG), carbG:Math.round(carbG)}; });
  return {tdee:Math.round(tdee), goals, waterOz:Math.round(weightLb*0.55+activity.waterAdd)};
}
function pbfRange(g){ return g==='female' ? [16,27] : [6,17]; }
function pbfStatus(g, pbf){ const [lo,hi]=pbfRange(g); if(pbf===''||pbf==null||Number.isNaN(pbf)) return 'unknown'; if(pbf<lo) return 'below'; if(pbf>hi) return pbf<=hi+5?'above-slight':'above'; return 'optimal'; }
function statusLabel(st){ return {optimal:'In target range','above-slight':'Slightly above target',above:'Above target',below:'Below target'}[st] || 'No scan yet'; }
function statusBadge(st){ const c={optimal:'b-good','above-slight':'b-brass',above:'b-bad',below:'b-brass'}[st]||'b-none'; return `<span class="badge ${c}">${statusLabel(st)}</span>`; }
function bmiOf(w,h){ h=numv(h); w=numv(w); if(!h) return null; return +(703*w/(h*h)).toFixed(1); }
function focusAreas(s){
  const scan=latestScan(s), prev=prevScan(s), g=genderOf(s), notes=[], st=pbfStatus(g, numv(scan.pbf)), [lo,hi]=pbfRange(g);
  if(st==='above') notes.push(`Body fat ${scan.pbf}% is well above the ${lo}\u2013${hi}% target range. Shift toward cut targets and add conditioning volume.`);
  else if(st==='above-slight') notes.push(`Body fat ${scan.pbf}% is only slightly above the ${lo}\u2013${hi}% target range. That's close enough that a cut may not be the right call, especially if strength and performance are already strong. Consider a performance-build or maintain approach and focus on muscle growth rather than a deficit.`);
  else if(st==='below') notes.push(`Body fat ${scan.pbf}% sits below the ${lo}\u2013${hi}% range. Make sure intake still supports recovery, not just leanness.`);
  else notes.push(`Body fat ${scan.pbf}% is within the ${lo}\u2013${hi}% target range. Hold the current approach.`);
  if(numv(scan.visceralFat)>=10) notes.push(`Visceral fat level ${scan.visceralFat} is elevated. Prioritize cardio conditioning and diet quality.`);
  // Only compare a measure when both scans have it (a blank is not a zero).
  const both = k => prev && String(scan[k]??'').trim()!=='' && String(prev[k]??'').trim()!=='';
  if(prev){ const smmD=both('smmLb')?numv(scan.smmLb)-numv(prev.smmLb):0, fatD=both('bodyFatMassLb')?numv(scan.bodyFatMassLb)-numv(prev.bodyFatMassLb):0;
    if(smmD<=-1) notes.push(`Lean mass is down ${Math.abs(smmD).toFixed(1)} lb since the last scan. Increase protein and resistance-training volume.`);
    else if(smmD>=1) notes.push(`Lean mass is up ${smmD.toFixed(1)} lb since the last scan. The protein target is working; hold steady.`);
    if(fatD>=2) notes.push(`Fat mass is up ${fatD.toFixed(1)} lb since the last scan. Reassess the calorie target for the stated goal.`);
    else if(fatD<=-2) notes.push(`Fat mass is down ${Math.abs(fatD).toFixed(1)} lb since the last scan. Trending well toward composition goals.`); }
  const t=calcTargets(scan); if(t) notes.push(`Hydration focus: ${t.waterOz} oz of water daily at current bodyweight and training load.`);
  return notes;
}
function bmrSmmStats(list){
  const r=list.map(s=>{ const sc=latestScan(s); return numv(sc.smmLb) ? numv(sc.bmr)/numv(sc.smmLb) : null; }).filter(v=>v!=null);
  const mean=r.reduce((a,b)=>a+b,0)/(r.length||1), v=r.reduce((a,b)=>a+(b-mean)**2,0)/(r.length||1); return {mean, sd:Math.sqrt(v)};
}
function riskFlags(s, stats){
  const scan=latestScan(s), flags=[];
  if(numv(scan.visceralFat)>=10) flags.push({label:'Elevated visceral fat', level:numv(scan.visceralFat)>=15?'high':'moderate'});
  const ratio=numv(scan.smmLb) ? numv(scan.bmr)/numv(scan.smmLb) : null;
  if(ratio!=null && stats.sd>0 && (ratio-stats.mean)/stats.sd < -1.5) flags.push({label:'BMR low relative to muscle mass vs. team average. Recommend follow-up.', level:'moderate'});
  const t=calcTargets(scan), floor=genderOf(s)==='female'?1200:1500;
  if(t && t.goals.cut.calories<floor) flags.push({label:`Cut target (${t.goals.cut.calories} kcal) is at or below a safe floor. Do not cut further.`, level:'high'});
  return flags;
}
function readinessIndex(list){ if(!list.length) return 0; const ok=list.filter(s=>{ const sc=latestScan(s), st=pbfStatus(genderOf(s), numv(sc.pbf)); return (st==='optimal'||st==='above-slight') && numv(sc.visceralFat)<10; }).length; return Math.round(ok/list.length*100); }
function teamOverview(list){
  if(!list.length) return null; let w=0,b=0,smm=0,pbf=0,bn=0,bx=0;
  list.forEach(s=>{ const sc=latestScan(s); w+=numv(sc.weightLb); smm+=numv(sc.smmLb); pbf+=numv(sc.pbf); const x=bmiOf(sc.weightLb, sc.heightIn); if(x!=null){ if(x>=10&&x<=60){ b+=x; bn++; } else bx++; } });
  const n=list.length; return {avgWeight:+(w/n).toFixed(1), avgBMI:bn?+(b/bn).toFixed(1):null, avgSMM:+(smm/n).toFixed(1), avgPBF:+(pbf/n).toFixed(1), bmiExcluded:bx};
}
function unitTrend(list){
  const by={}; list.forEach(s=>s.scans.forEach(sc=>{ if(!sc.date) return; const d=by[sc.date]||(by[sc.date]={date:sc.date,smm:0,pbf:0,n:0}); d.smm+=numv(sc.smmLb); d.pbf+=numv(sc.pbf); d.n++; }));
  return Object.values(by).sort((a,b)=>a.date<b.date?-1:1).map(d=>({label:fmtDay(d.date), smm:+(d.smm/d.n).toFixed(1), pbf:+(d.pbf/d.n).toFixed(1)}));
}
function parseScanText(text){
  const grab=res=>{ for(const re of res){ const m=text.match(re); if(m) return m[1]; } return null; };
  return { heightIn:grab([/height[^\d\-]{0,12}(\d+\.?\d*)/i]), weightLb:grab([/weight[^\d\-]{0,12}(\d+\.?\d*)/i]), smmLb:grab([/(?:skeletal muscle mass|smm)[^\d\-]{0,12}(\d+\.?\d*)/i]),
    bodyFatMassLb:grab([/body fat mass[^\d\-]{0,12}(\d+\.?\d*)/i]), pbf:grab([/(?:percent body fat|pbf|body fat percentage|body fat %|body fat)[^\d\-]{0,12}(\d+\.?\d*)/i]),
    visceralFat:grab([/visceral fat[^\d\-]{0,12}(\d+\.?\d*)/i]), bmr:grab([/(?:bmr|basal metabolic rate)[^\d\-]{0,12}(\d+\.?\d*)/i]) };
}

// One measure per chart, each with its own scale (never two units on one axis). Hover a point for its value.
function miniLine(data, key, title, unit){
  const W=340, H=150, m={t:22,r:44,b:26,l:36}, iw=W-m.l-m.r, ih=H-m.t-m.b, vals=data.map(d=>d[key]);
  let lo=Math.min(...vals), hi=Math.max(...vals); const pad=Math.max((hi-lo)*0.15, 1); lo=Math.floor(lo-pad); hi=Math.ceil(hi+pad);
  const X=i=> m.l + (data.length>1 ? i*iw/(data.length-1) : iw/2), Y=v=> m.t + ih - (v-lo)/(hi-lo||1)*ih;
  const ticks=[lo, (lo+hi)/2, hi].map(v=>+v.toFixed(0));
  const grid=ticks.map(v=>`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l-6}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="var(--inkSoft)">${v}</text>`).join('');
  const pts=data.map((d,i)=>`${X(i)},${Y(d[key])}`).join(' ');
  const last=data[data.length-1];
  const dots=data.map((d,i)=>`<g><circle cx="${X(i)}" cy="${Y(d[key])}" r="10" fill="transparent">${'<'+'title>'}${esc(d.label)}: ${d[key]} ${unit}${'<'+'/title>'}</circle><circle cx="${X(i)}" cy="${Y(d[key])}" r="4" fill="var(--navy)" stroke="var(--panel)" stroke-width="2" pointer-events="none"/></g>`).join('');
  return `<figure class="mini"><figcaption>${esc(title)}</figcaption>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}: ${data.map(d=>d.label+' '+d[key]).join(', ')}" style="width:100%;height:auto;display:block">
      ${grid}<polyline points="${pts}" fill="none" stroke="var(--navy)" stroke-width="2"/>${dots}
      <text x="${X(data.length-1)+8}" y="${Y(last[key])+4}" font-size="11" fill="var(--ink)" font-weight="600">${last[key]}</text>
      <text x="${m.l}" y="${H-6}" font-size="10" fill="var(--inkSoft)">${esc(data[0].label)}</text>${data.length>1?`<text x="${W-m.r}" y="${H-6}" font-size="10" text-anchor="end" fill="var(--inkSoft)">${esc(last.label)}</text>`:''}
    </svg></figure>`;
}
function trendCharts(trend, prefix){
  return `<div class="two">${miniLine(trend,'smm',prefix?`${prefix}skeletal muscle mass (lb)`:'Skeletal muscle mass (lb)','lb')}${miniLine(trend,'pbf',prefix?`${prefix}body fat (%)`:'Body fat (%)','%')}</div>

/* ---------- practice progress stored on a soldier ---------- */
function practiceSummary(s){
  const L=s.practice||[]; if(!L.length) return null;
  const ok=L.filter(e=>e.ok).length, weekAgo=Date.now()-7*864e5;
  const byTask={}; L.forEach(e=>{ (byTask[e.task]=byTask[e.task]||[]).push(e); });
  let weak=null; Object.entries(byTask).forEach(([k,arr])=>{ const last=arr.slice(-10); if(last.length<3) return; const r=last.filter(e=>e.ok).length/last.length; if(!weak||r<weak.r) weak={k,r}; });
  const label=k=>(Drill.PTASKS.find(p=>p[0]===k)||[0,k])[1];
  return {n:L.length, pct:Math.round(ok/L.length*100), week:L.filter(e=>e.t>=weekAgo).length, last:L[L.length-1].t, weak: weak && weak.r<0.7 ? `${label(weak.k)} (${Math.round(weak.r*100)}%)` : ''};
}

// Reads and checks a scan form. Unusual heights need a second click to save, like the tracker's warning.
function readScanForm(prefix, msgEl, state){
  const v=id=>$(prefix+id).value.trim(), scan={date:v('date'), activityLevel:$(prefix+'activity').value};
  SCAN_FIELDS.forEach(([k])=>scan[k]=v(k));
  const bad=SCAN_FIELDS.filter(([k])=>scan[k]!=='' && !/^\d+(\.\d+)?$/.test(scan[k])).map(([,l])=>l);
  if(bad.length){ msgEl.innerHTML=`<div class="note warn">Numbers only: ${bad.map(esc).join(', ')}.</div>`; return null; }
  if(!scan.date || !scan.weightLb || !scan.smmLb || !scan.bmr || scan.pbf===''){ msgEl.innerHTML='<div class="note warn">Fill in at least date, weight, SMM, percent body fat, and BMR.</div>'; return null; }
  const h=numv(scan.heightIn);
  if(scan.heightIn && (h<48 || h>84) && state.heightOk!==scan.heightIn){ state.heightOk=scan.heightIn;
    msgEl.innerHTML=`<div class="note warn">Height of ${esc(scan.heightIn)} in looks unusual for an adult (roughly 48\u201384 in is typical). It's easy to mistype from a scan photo. Fix it, or press save again to keep it.</div>`; return null; }
  return scan;
}

// Pull scans for one person out of any .json: an old tracker roster, one person's tracker export, or a scorebook / "Export my data" file.
function peopleInFile(inc){
  const list = Array.isArray(inc) ? inc : inc && Array.isArray(inc.soldiers) ? inc.soldiers : inc && (inc.history||inc.scans) ? [inc] : [];
  return list.filter(p=>p && typeof p==='object').map(p=>({name:p.name||'(no name)', scans:(Array.isArray(p.scans)?p.scans:Array.isArray(p.history)?p.history:[]).filter(x=>x&&x.date),
    practice:Array.isArray(p.practice)?p.practice:[], pinHash:p.pinHash||null})).filter(p=>p.scans.length||p.practice.length);
}
const nameWords = n => normName(n).replace(/[^a-z ]/g,' ').split(/\s+/).filter(Boolean);

function mergeScansInto(s, scans){
  const by={}; s.scans.forEach(x=>{ if(x&&x.date) by[x.date]=x; }); scans.forEach(x=>{ if(x&&x.date) by[x.date]=Object.assign({activityLevel:'standard'}, x); });
  s.scans=Object.values(by).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}
function mergePracticeInto(s, list){ const seen=new Set(s.practice.map(e=>e.t+'|'+e.task)); list.forEach(e=>{ if(!seen.has(e.t+'|'+e.task)){ s.practice.push(e); seen.add(e.t+'|'+e.task); } }); s.practice.sort((a,b)=>a.t-b.t); }
function wireHealthTools(s){

  const cg=$('hClearGo'); if(cg) cg.onclick=()=>{ s.scans=[]; save(); STATE.hTool=null; STATE.hEdit=null; toast(`Removed ${s.name}'s scans.`); render(); };

// Change from the first scan to the latest, one small chart per measure (each on its own scale).
const PROG=[['weightLb','Weight','lb',0],['smmLb','Skeletal muscle mass','lb',1],['bodyFatMassLb','Body fat mass','lb',-1],['pbf','Body fat','%',-1],['visceralFat','Visceral fat level','',-1]];
function progressPanel(s){
  const L=s.scans.filter(x=>x.date); if(L.length<2) return L.length?`<div class="panel"><h3 style="margin-top:0">Progress over time</h3><p class="sub" style="margin:0">One scan so far. Progress charts start with the second scan.</p></div>`:'';
  const first=L[0], last=L[L.length-1], days=Math.round((new Date(last.date)-new Date(first.date))/864e5);
  const has=(sc,k)=>String(sc[k]??'').trim()!=='';
  const cells=PROG.map(([k,l,u,good])=>{ const pts=L.filter(x=>has(x,k)); if(pts.length<2) return null; const d=numv(pts[pts.length-1][k])-numv(pts[0][k]);
    const tone = !good||Math.abs(d)<0.05 ? '' : (d*good>0 ? 'up-good' : 'up-bad');
    return {k,l,u,d,tone,first:pts[0][k],last:pts[pts.length-1][k],pts}; }).filter(Boolean);
  const charts=cells.map(c=>miniLine(c.pts.map(x=>({label:fmtDay(x.date), v:numv(x[c.k])})),'v',`${c.l}${c.u?` (${c.u})`:''}`,c.u));
  return `<div class="panel"><h3 style="margin-top:0">Progress over time</h3>
    <p class="sub">${L.length} scans from ${fmtDay(first.date)} to ${fmtDay(last.date)} (${days} days).</p>
    <div class="prog-tiles">${cells.map(c=>`<div><span>${c.l}</span><b class="${c.tone}">${c.d>0?'+':''}${c.d.toFixed(1)}${c.u==='%'?' pts':c.u?' '+c.u:''}</b><small>${esc(c.first)} \u2192 ${esc(c.last)}${c.u==='%'?'%':''}</small></div>`).join('')}</div>
    <p class="sub" style="font-size:12.5px;margin:6px 0 12px">Green means moving the right way (more muscle, less fat); red means the wrong way. Weight has no color because the right direction depends on the goal.</p>
    <div class="prog-charts">${charts.join('')}</div>
    <details class="tbl"><summary>Show as a table</summary><div class="scroll"><table><thead><tr><th>Date</th>${cells.map(c=>`<th class="num">${c.l}${c.u?` (${c.u})`:''}</th>`).join('')}</tr></thead><tbody>${L.map(x=>`<tr><td>${fmtDay(x.date)}</td>${cells.map(c=>`<td class="num">${esc(x[c.k]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details></div>`;
}

  const st={};
  document.querySelectorAll('[data-sedit]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.sedit; STATE.hEdit = STATE.hEdit&&STATE.hEdit.id===s.id&&STATE.hEdit.i===i ? null : {id:s.id, i}; render(); const f=$('he-date'); if(f) f.scrollIntoView({block:'center'}); });
  document.querySelectorAll('[data-sdel]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.sdel, sc=s.scans[i];
    $('hScanMsg').innerHTML=`<div class="note warn" style="margin-top:10px">Delete the ${fmtDay(sc.date)} scan? <div class="row" style="margin-top:8px"><button class="btn danger sm" id="hSDelYes">Delete scan</button><button class="btn sm" id="hSDelNo">Keep it</button></div></div>`;
    $('hSDelYes').onclick=()=>{ s.scans.splice(i,1); STATE.hEdit=null; save(); toast('Scan deleted.'); render(); }; $('hSDelNo').onclick=()=>{ $('hScanMsg').innerHTML=''; }; });
  const ec=$('hEditCancel'); if(ec) ec.onclick=()=>{ STATE.hEdit=null; render(); };
  const es=$('hEditSave'); if(es) es.onclick=()=>{ const sc=readScanForm('he-', $('hEditMsg'), st); if(!sc) return; s.scans[STATE.hEdit.i]=sc; s.scans.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0); save(); STATE.hEdit=null; toast('Scan updated.'); render(); };
  if(!admin) return;
  wireHealthTools(s);
  $('hTry').onchange=e=>{ s.tryout=e.target.checked; STATE.grid=null; save(); toast(s.tryout?`${s.name} is in the tryout.`:`${s.name} is out of the tryout. Their results are kept.`); render(); };
  $('hPrint').onclick=()=>window.print();
  const pb=$('hPin'); if(pb) pb.onclick=()=>{ $('hAdminMsg').innerHTML=`<div class="note warn" style="margin-top:10px">Reset ${esc(s.name)}'s PIN? They'll choose a new one the next time they sign in. <div class="row" style="margin-top:8px"><button class="btn danger sm" id="hPinYes">Reset PIN</button><button class="btn sm" id="hPinNo">Cancel</button></div></div>`;
    $('hPinYes').onclick=()=>{ s.pinHash=null; save(); toast('PIN reset.'); render(); }; $('hPinNo').onclick=()=>{ $('hAdminMsg').innerHTML=''; }; };
  $('hDel').onclick=()=>{ $('hAdminMsg').innerHTML=`<div class="note warn" style="margin-top:10px">Delete ${esc(s.name)} completely: tryout results, scans, and practice history, from this device? Download a .json first if you might need it. <div class="row" style="margin-top:8px"><button class="btn danger sm" id="hDelYes">Delete</button><button class="btn sm" id="hDelNo">Cancel</button></div></div>`;
    $('hDelYes').onclick=()=>{ DATA.soldiers=DATA.soldiers.filter(x=>x.id!==s.id); STATE.hSel=null; STATE.grid=null; save(); toast(`Deleted ${s.name}.`); render(); }; $('hDelNo').onclick=()=>{ $('hAdminMsg').innerHTML=''; }; };
}

/* ---------- admin: Health tab ---------- */
const HTABS=[['dash','Dashboard'],['people','Soldiers'],['log','Log a scan']];
function renderHealth(c){
  if(!HTABS.some(x=>x[0]===STATE.hTab)) STATE.hTab='dash';
  const t=STATE.hTab;
  c.innerHTML=`<div class="subtabs seg no-print" role="group" aria-label="Health">${HTABS.map(([k,l])=>`<button data-ht="${k}" aria-pressed="${k===t}">${l}</button>`).join('')}</div><div id="hBody"></div>`;
  c.querySelectorAll('[data-ht]').forEach(b=>b.onclick=()=>{ STATE.hTab=b.dataset.ht; render(); });
  ({dash:healthDash, people:healthPeople, log:healthLog})[t]($('hBody'));
}
function healthDash(el){
  const all=DATA.soldiers, list=withScans(), stats=bmrSmmStats(list), flagged=list.map(s=>({s, flags:riskFlags(s,stats)})).filter(r=>r.flags.length), ov=teamOverview(list), trend=unitTrend(list);
  el.innerHTML=`<div class="stack">
    <div class="two">
      <div class="panel"><h2>Unit readiness index</h2><div class="hero">${readinessIndex(list)}<span>%</span></div>
        <p class="sub" style="margin:8px 0 0">Share of soldiers with a scan who are within (or only slightly above) their body-fat target and below the elevated visceral-fat level, from each soldier's latest scan.</p></div>
      <div class="panel"><h2>Roster snapshot</h2>
        <div class="kv"><span>Soldiers on the roster</span><b>${all.length}</b></div><div class="kv"><span>In the tryout</span><b>${tryoutSoldiers().length}</b></div>
        <div class="kv"><span>Awaiting a first scan</span><b>${all.length-list.length}</b></div><div class="kv"><span>Flagged for follow-up</span><b class="${flagged.length?'flag':''}">${flagged.length}</b></div>
        <div class="row no-print" style="margin-top:12px"><button class="btn sm" id="hPrintAll">Print briefing summary</button><button class="btn brass sm" id="hCsv">Export CSV for slides</button></div></div>
    </div>
    ${ov?`<div class="panel"><h2>Team averages (latest scans)</h2><div class="tiles">
      <div><b>${ov.avgWeight}</b><span>lb average weight</span></div><div><b>${ov.avgBMI??'\u2013'}</b><span>average BMI</span></div>
      <div><b>${ov.avgSMM}</b><span>lb average muscle mass</span></div><div><b>${ov.avgPBF}%</b><span>average body fat</span></div></div>
      ${ov.bmiExcluded?`<p class="sub flag" style="margin:10px 0 0">${ov.bmiExcluded} record(s) left out of the BMI average because the height looks wrong. Open that soldier and use Edit latest scan to fix it.</p>`:''}</div>`:''}
    ${trend.length>1?`<div class="panel"><h2>Team progress over time</h2>${trendCharts(trend,'Average ')}</div>`:''}
    <div class="panel"><h2>High-risk and outlier alerts</h2>
      ${!flagged.length?'<p class="sub" style="margin:0">No soldiers flagged right now.</p>':flagged.map(({s,flags})=>`<div class="alert-row"><button class="linkish" data-hopen="${s.id}">${esc(s.name)}</button><ul class="plain">${flags.map(f=>`<li class="${f.level==='high'?'flag':''}">${esc(f.label)}</li>`).join('')}</ul></div>`).join('')}</div>
    ${!all.length?`<div class="panel"><p class="sub" style="margin:0">No one is on the roster yet. Log a scan, add soldiers in Team entry, or import a .json (your old fitness tracker file works too) from Export / import.</p></div>`:''}
  </div>`;
  $('hPrintAll').onclick=()=>window.print();
  $('hCsv').onclick=exportHealthCsv;
  el.querySelectorAll('[data-hopen]').forEach(b=>b.onclick=()=>{ STATE.hSel=b.dataset.hopen; STATE.hTab='people'; render(); });
}
function healthPeople(el){
  const list=DATA.soldiers.slice().sort((a,b)=>a.name.localeCompare(b.name));
  let s=list.find(x=>x.id===STATE.hSel); if(!s && list.length){ s=list[0]; STATE.hSel=s.id; }
  el.innerHTML=`<div class="layout"><div class="stack no-print" style="gap:10px"><input class="input" id="hq" placeholder="Search name" aria-label="Search name"><div class="list" id="hList"></div></div>
    <div>${s?healthProfileHtml(s,true):'<div class="panel"><p class="sub" style="margin:0">No one on the roster yet.</p></div>'}</div></div>`;
  const draw=q=>{ q=normName(q); $('hList').innerHTML=list.filter(x=>normName(x.name).includes(q)).map(x=>{ const sc=latestScan(x);
      return `<button data-hid="${x.id}" aria-current="${s&&x.id===s.id}"><span>${esc(x.name)}<br><span class="soft" style="font-size:12px">${sc?'Scan '+fmtDay(sc.date):'No scans'}${x.tryout!==false?' \u00B7 tryout':''}</span></span>${sc?statusBadge(pbfStatus(genderOf(x),numv(sc.pbf))).replace('badge ','badge sm-badge '):''}</button>`; }).join('') || '<p class="sub">No one matches.</p>';
    $('hList').querySelectorAll('[data-hid]').forEach(b=>b.onclick=()=>{ STATE.hSel=b.dataset.hid; STATE.hEdit=null; STATE.hTool=null; render(); }); };
  draw(''); $('hq').oninput=e=>draw(e.target.value);
  if(s) wireHealthProfile(s,true);
}
function healthLog(el){
  const mode=STATE.hLogMode||(DATA.soldiers.length?'existing':'new'), list=DATA.soldiers.slice().sort((a,b)=>a.name.localeCompare(b.name));
  const st={};
  el.innerHTML=`<div class="panel"><h2>Log a scan</h2>
    <div class="seg" role="group" aria-label="Who" style="margin-bottom:14px"><button data-lm="existing" aria-pressed="${mode==='existing'}" ${list.length?'':'disabled'}>Someone on the roster</button><button data-lm="new" aria-pressed="${mode==='new'}">New person</button></div>
    ${mode==='existing'?`<label class="field" style="max-width:420px;margin-bottom:12px"><span>Soldier</span><select class="input" id="hl-who">${list.map(x=>`<option value="${x.id}" ${x.id===STATE.hSel?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>`
    :`<div class="grid" style="margin-bottom:12px"><label class="field" style="grid-column:span 2"><span>Name</span><input class="input" id="hl-name" placeholder="Last, First"></label><label class="field"><span>Age</span><input class="input" id="hl-age" inputmode="numeric"></label>
      <label class="field"><span>Sex</span><select class="input" id="hl-sex"><option value="M">M</option><option value="F">F</option></select></label></div>
      <label class="row" style="gap:8px;margin-bottom:12px"><input type="checkbox" id="hl-try"> Also add to the tryout</label>`}
    ${pasteBoxHtml()}${scanFormHtml('hl-')}
    <div class="row" style="margin-top:14px"><button class="btn primary" id="hl-save">Save scan</button></div><div id="hl-msg" style="margin-top:10px"></div></div>`;
  el.querySelectorAll('[data-lm]').forEach(b=>b.onclick=()=>{ STATE.hLogMode=b.dataset.lm; render(); });
  wirePasteFill('hl-');
  $('hl-save').onclick=()=>{
    const msg=$('hl-msg'); let s;
    if(mode==='new'){ const name=$('hl-name').value.trim(), age=$('hl-age').value.trim();
      if(!name){ msg.innerHTML='<div class="note warn">Name is required.</div>'; return; }
      if(age && (!/^\d+$/.test(age)||+age<16||+age>70)){ msg.innerHTML='<div class="note warn">Age must be a number from 16 to 70.</div>'; return; }
      if(DATA.soldiers.some(x=>normName(x.name)===normName(name))){ msg.innerHTML=`<div class="note warn">${esc(name)} is already on the roster. Choose "Someone on the roster".</div>`; return; } }
    const scan=readScanForm('hl-', msg, st); if(!scan) return;
    if(mode==='new'){ s=fixSoldier({id:uid(), name:$('hl-name').value.trim(), age:+$('hl-age').value||'', sex:$('hl-sex').value, tryout:$('hl-try').checked}); FIELDS.forEach(f=>s[f.k]=null); DATA.soldiers.push(s); }
    else s=soldierById($('hl-who').value);
    addScan(s, scan); STATE.hSel=s.id; STATE.hTab='people'; STATE.grid=null; toast(`Saved a scan for ${s.name}.`); render();
  };
}
function healthPractice(el){
  const rows=DATA.soldiers.map(s=>({s, P:practiceSummary(s)})).sort((a,b)=>(b.P?b.P.last:0)-(a.P?a.P.last:0)||a.s.name.localeCompare(b.s.name));
  const active=rows.filter(r=>r.P);
  el.innerHTML=`<div class="panel"><h2>Practice across the roster</h2>
    <p class="sub">Practice done while signed in as a soldier. Anonymous practice from the login screen isn't counted. Right means a Go, a full grenade quiz, a clean weapons order, or "Got it all right" on a self-checked report.</p>
    ${active.length?`<div class="scroll"><table><thead><tr><th>Soldier</th><th class="num">Tries</th><th class="num">Right</th><th class="num">Last 7 days</th><th>Last practiced</th><th>Needs work</th></tr></thead><tbody>
      ${rows.map(({s,P})=>`<tr><td><button class="linkish" data-hopen="${s.id}">${esc(s.name)}</button></td>${P?`<td class="num">${P.n}</td><td class="num">${P.pct}%</td><td class="num">${P.week}</td><td>${new Date(P.last).toLocaleDateString()}</td><td>${esc(P.weak)||'<span class="soft">\u2013</span>'}</td>`:'<td class="num soft">0</td><td></td><td></td><td class="soft">Not yet</td><td></td>'}</tr>`).join('')}
    </tbody></table></div>`:'<p class="sub" style="margin:0">Nobody has practiced while signed in yet.</p>'}</div>`;
  el.querySelectorAll('[data-hopen]').forEach(b=>b.onclick=()=>{ const x=soldierById(b.dataset.hopen);
    if(x && x.tryout!==false){ STATE.selectedId=x.id; STATE.newMode=false; STATE.tab='one'; } else { STATE.hSel=b.dataset.hopen; STATE.hTab='people'; STATE.tab='health'; } render(); window.scrollTo(0,0); });
}
function exportHealthCsv(){
  const rows=[['Name','In tryout','Scan date','Weight (lb)','BMI','SMM (lb)','Body fat mass (lb)','PBF (%)','Visceral fat','BMR','TDEE','Status']];
  withScans().forEach(s=>{ const sc=latestScan(s), t=calcTargets(sc); rows.push([s.name, s.tryout!==false?'Yes':'No', sc.date, sc.weightLb, bmiOf(sc.weightLb,sc.heightIn)||'', sc.smmLb, sc.bodyFatMassLb, sc.pbf, sc.visceralFat, sc.bmr, t?t.tdee:'', statusLabel(pbfStatus(genderOf(s), numv(sc.pbf)))]); });
  offerFile(`unit_health_summary_${stamp()}.csv`, rows.map(r=>r.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',')).join('\n'), 'text/csv');
}

/* ---------- soldier session ---------- */
function meSoldier(){ return soldierById(STATE.session.soldierId); }
function renderSoldierApp(app){
  const s=meSoldier(); if(!s){ STATE.session=null; render(); return; }
  const tabs=[['myhealth','My health'],['mylog','Log my scan'],...(s.tryout!==false?[['myresults','My tryout results']]:[]),['mypractice','Practice']];
  if(!tabs.some(t=>t[0]===STATE.tab)) STATE.tab='myhealth';
  app.innerHTML=`<header class="app-header"><div class="app-title">Rusty Anvil <span class="app-sub">ROTC UCM Skills Trainer</span></div>
    <nav class="tabs" aria-label="Sections">${tabs.map(([k,l])=>`<button class="tab" data-tab="${k}" ${STATE.tab===k?'aria-current="page"':''}>${l}</button>`).join('')}</nav>
    <div class="who"><span>${esc(s.name)}</span><button class="btn sm" id="myExport" title="Download your data to send to leadership">Export my data</button><button class="btn sm" id="logout">Sign out</button></div></header>
    <main class="main" id="content"></main>`;
  app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ STATE.tab=b.dataset.tab; render(); });
  $('logout').onclick=()=>{ STATE.session=null; STATE.gate={step:'choose',error:''}; render(); };
  $('myExport').onclick=()=>offerFile(`${s.name.replace(/[^a-z0-9]+/gi,'_')}_my_data_${stamp()}.json`, JSON.stringify({app:'team-tryout-scorebook', version:1, kind:'soldier', exportedAt:new Date().toISOString(), soldiers:[s]}, null, 2), 'application/json');
  const c=$('content');
  if(STATE.tab==='myhealth'){ c.innerHTML=healthProfileHtml(s,false); wireHealthProfile(s,false); }
  else if(STATE.tab==='mylog') renderMyLog(c,s);
  else if(STATE.tab==='myresults') renderMyResults(c,s);
  else { c.innerHTML='<div id="drillRoot"></div>'; Drill.mount($('drillRoot'), {store:{load:()=>({log:s.practice}), save:d=>{ s.practice=d.log; save(); }}, who:s.name}); }
}
function renderMyLog(c,s){
  const st={};
  c.innerHTML=`<div class="panel"><h2>Log my scan</h2><p class="sub">Adding a scan for <b>${esc(s.name)}</b>. Only you and leadership can see it.</p>${pasteBoxHtml()}${scanFormHtml('ml-')}
    <div class="row" style="margin-top:14px"><button class="btn primary" id="ml-save">Save scan</button></div><div id="ml-msg" style="margin-top:10px"></div></div>`;
  wirePasteFill('ml-');
  $('ml-save').onclick=()=>{ const scan=readScanForm('ml-', $('ml-msg'), st); if(!scan) return; addScan(s, scan); STATE.tab='myhealth'; toast('Scan saved.'); render(); };
}
// A soldier's own tryout results: every event that counts, no rank, no cut line, nobody else.
function renderMyResults(c,s){
  const sc=score(s), S=DATA.settings, gn=v=>v==='go'?'<span class="badge b-good">Go</span>':v==='nogo'?'<span class="badge b-bad">No-Go</span>':'<span class="badge b-none">Not tested yet</span>';
  c.innerHTML=`<div class="stack">
    <div class="panel"><h2>My tryout results</h2><p class="sub" style="margin:0">Your own results only. Rankings stay with leadership.</p></div>
    ${isOn('aft')?`<div class="panel"><h3 style="margin-top:0">Army Fitness Test</h3>${EVENTS.map(e=>`<div class="kv"><span>${e.name}</span><span class="mono">${s[e.k]!=null?fieldDisplay({type:e.time?'time':'int'},s[e.k])+(e.time?'':' '+e.unit)+' \u2192 '+(sc.ev[e.k]??'\u2013')+' pts':'\u2013'}</span></div>`).join('')}
      <div class="kv"><b>Total</b><b class="mono">${sc.aftTotal??'\u2013'} / 500 ${sc.aftFail?'<span class="badge b-bad">below the general standard</span>':sc.aftPass?'<span class="badge b-good">meets the general standard</span>':''}</b></div></div>`:''}
    ${isOn('cft')?`<div class="panel"><h3 style="margin-top:0">Combat Field Test</h3><div class="kv"><span>Time</span><span class="mono">${s.cft!=null?fmtTime(s.cft)+' \u2192 '+fmt1(sc.cftPts)+' pts':'\u2013'}</span></div></div>`:''}
    ${customTests().filter(t=>isOn(ctKey(t))).map(t=>{ const x=sc.ct[t.id]; return `<div class="panel"><h3 style="margin-top:0">${esc(t.name)}</h3>${t.events.map(e=>{ const v=s[ctField(t,e)], ty=CT_TYPES[e.type]||{}; return `<div class="kv"><span>${esc(e.name)}</span><span class="mono">${v!=null?(ty.time?fmtTime(v):v+(e.unit?' '+esc(e.unit):''))+' \u2192 '+(x.pts[e.id]??'\u2013')+' pts':'\u2013'}</span></div>`; }).join('')}
      <div class="kv"><b>Total</b><b class="mono">${x.total??'\u2013'}${x.fail?' <span class="badge b-bad">below a minimum</span>':x.pass?' <span class="badge b-good">passes</span>':''}</b></div></div>`; }).join('')}
    ${SKILLS_ON().length?`<div class="panel"><h3 style="margin-top:0">Go / No-Go events</h3>${SKILLS_ON().map(k=>`<div class="kv"><span>${esc(k.name)}${k.k==='grenade'&&s.grenade!=null?` <span class="soft">(${s.grenade} of ${S.grenadeTotal})</span>`:''}${k.k==='throw'&&s.circle==='yes'?' <span class="soft">(in the circle)</span>':''}</span>${gn(skillResult(s,k.k))}</div>`).join('')}</div>`:''}
    <div class="panel"><div class="kv"><span>Gos</span><b class="mono">${sc.gos} of ${SKILLS_ON().length}</b></div>${physOn()?`<div class="kv"><span>Physical score</span><b class="mono">${sc.phys==null?'\u2013':fmt1(sc.phys)} / 500</b></div>`:''}<div class="kv"><b>Total score</b><b class="mono">${fmt1(sc.total)}</b></div>
      ${sc.missing.length?`<p class="sub" style="margin:8px 0 0">Not recorded yet: ${sc.missing.join(', ')}</p>`:''}</div>
  </div>`;
}

load();
rebuildRegistry();
render();
</script>

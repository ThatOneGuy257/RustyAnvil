const WHATS_NEW = {id:'2026-09-29', title:'What\'s new in Rusty Anvil', items:[]};
const NEWS_KEY='rustyAnvil_newsSeen';
function whatsNewReady(){ return Array.isArray(WHATS_NEW.items) && WHATS_NEW.items.length>0; }
function showWhatsNew(force){
  if(!whatsNewReady() || document.getElementById('newsSheet')) return;
  let seen=null; try{ seen=localStorage.getItem(NEWS_KEY); }catch(e){}
  if(!force && seen===WHATS_NEW.id) return;
  const w=document.createElement('div'); w.className='sheet-wrap news-wrap'; w.id='newsSheet';
  w.innerHTML=`<div class="sheet news" role="dialog" aria-modal="true" aria-labelledby="newsH"><h2 id="newsH">${esc(WHATS_NEW.title)}</h2>
    <ul class="news-list">${WHATS_NEW.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
    <button class="btn primary" id="newsOk" style="width:100%">Got it</button></div>`;
  document.body.appendChild(w);
  const done=()=>{ try{ localStorage.setItem(NEWS_KEY, WHATS_NEW.id); }catch(e){} w.remove(); };
  w.querySelector('#newsOk').onclick=done; w.onclick=e=>{ if(e.target===w) done(); };
  w.querySelector('#newsOk').focus();
}

  if(!DATA.backupSince){ DATA.backupSince=new Date().toISOString(); save(); }
  const since=new Date(DATA.lastBackupAt||DATA.backupSince).getTime(), now=Date.now();
  if(DATA.backupSnooze && now<new Date(DATA.backupSnooze).getTime()) return false;
  return now-since > BACKUP_DAYS*864e5;
}
function backupAgo(){ if(!DATA.lastBackupAt) return 'never'; const d=Math.floor((Date.now()-new Date(DATA.lastBackupAt).getTime())/864e5); return d<=0?'today':d===1?'yesterday':`${d} days ago`; }
function backupBannerHtml(){

}

  w.innerHTML=`<div class="sheet news" role="dialog" aria-modal="true" aria-labelledby="pinH"><h2 id="pinH">Change my PIN</h2>
    <p class="sub">Pick a PIN only you know, 4 to 8 digits. ${SYNC.cfg.user&&SYNC.cfg.user.role!=='soldier'?'The shared '+SYNC.cfg.user.role+' PIN stays the same.':''}</p>

      <label class="field"><span>New PIN</span><input class="input" type="password" inputmode="numeric" id="mpNew" autocomplete="off"></label>
      <label class="field"><span>Confirm new PIN</span><input class="input" type="password" inputmode="numeric" id="mpNew2" autocomplete="off"></label>
      <div id="mpMsg" class="flag"></div>
      <div class="row"><button class="btn primary" id="mpSave">Save new PIN</button><button class="btn" id="mpCancel">Cancel</button></div>
    </div></div>`;
  document.body.appendChild(w);
  const close=()=>w.remove(), msg=t=>{ w.querySelector('#mpMsg').textContent=t; };
  w.querySelector('#mpCancel').onclick=close; w.onclick=e=>{ if(e.target===w) close(); };

      if(!r.ok || !res.ok){ b.disabled=false; b.textContent='Save new PIN'; return msg(res.error||r.error||'That didn\'t work.'); }

  w.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); save(); } });

/* ============================== Google Sheet sync ============================== */
// The installed app (GitHub) keeps its data in the Rusty Anvil Google Sheet, through the sheet's script.
// Claude's preview, the offline .html file, and shared copies keep working on this device only.
const SYNC_URL = 'https://script.google.com/macros/s/AKfycbwO2x-1977xEJ4MVE0dYSf4QQUVD0YoPLLG62jtN3RkopZeK2EZ59h7vh0w071FwLW5pQ/exec';
const SYNC_KEY='rustyAnvil_sync', QUEUE_KEY='rustyAnvil_queue', BASE_KEY='rustyAnvil_base', PRESYNC_KEY='rustyAnvil_beforeSync';
const SYNC = {
  on: !!window.__SYNC_TEST__ || /github\.io$/i.test(location.hostname) || /[?&]sync=1\b/.test(location.search),
  url: window.__SYNC_URL__ || SYNC_URL,
  cfg:{}, queue:[], base:null, users:[], rolePins:{}, names:null, ready:null, signup:true,
  busy:false, pulling:false, online:true, lastOk:0, error:'', timer:null, pendingRender:false,
};
const ROLE_FROM_SERVER = {admin:'admin', leader:'leader', captain:'captain', grader:'grader', soldier:'soldier'};
function syncLoadLocal(){
  try{ SYNC.cfg=JSON.parse(localStorage.getItem(SYNC_KEY)||'{}')||{}; }catch(e){ SYNC.cfg={}; }
  try{ SYNC.queue=JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]')||[]; }catch(e){ SYNC.queue=[]; }
  try{ SYNC.base=JSON.parse(localStorage.getItem(BASE_KEY)||'null'); }catch(e){ SYNC.base=null; }
  if(Array.isArray(SYNC.cfg.users)) SYNC.users=SYNC.cfg.users;
}
function syncPersist(){ try{ localStorage.setItem(SYNC_KEY, JSON.stringify(SYNC.cfg)); localStorage.setItem(QUEUE_KEY, JSON.stringify(SYNC.queue)); localStorage.setItem(BASE_KEY, JSON.stringify(SYNC.base)); }catch(e){} }
function syncActive(){ return SYNC.on && !!SYNC.cfg.token && !!STATE.session && STATE.session.role!=='practice'; }

/* ---------- talking to the script ---------- */
async function syncApi(action, body){
  const ctl = typeof AbortController!=='undefined' ? new AbortController() : null;
  const t = ctl ? setTimeout(()=>ctl.abort(), 25000) : null;
  try{
    // text/plain keeps the browser from sending a pre-check request the script can't answer
    const r = await fetch(SYNC.url, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(Object.assign({action}, body||{})), redirect:'follow', signal:ctl?ctl.signal:undefined});
    const j = await r.json();
    SYNC.online=true;
    return j;
  }catch(e){ SYNC.online=false; throw new Error('offline'); }
  finally{ if(t) clearTimeout(t); }
}

/* ---------- turning the app's data into rows, and back ---------- */
const PRIVATE_SETTINGS = ['adminPinHash','testerPinHash'];
function syncFlatten(D){
  const F={soldiers:{}, scans:{}, practice:{}, times:{}, calendar:{}, settings:{}};
  (D.soldiers||[]).forEach(s=>{
    const rec={}; Object.keys(s).forEach(k=>{ if(k!=='scans' && k!=='practice' && k!=='pinHash' && k.charAt(0)!=='_') rec[k]=s[k]; });
    F.soldiers[s.id]=rec;
    (s.scans||[]).forEach(x=>{ if(x && x.date) F.scans[s.id+'|'+x.date]=Object.assign({}, x, {sid:s.id}); });
    (s.practice||[]).forEach(x=>{ if(x && x.t!=null) F.practice[s.id+'|'+x.t+'|'+x.task]=Object.assign({}, x, {sid:s.id}); });
  });
  (D.timeLogs||[]).forEach(e=>{ if(e && e.id) F.times[e.id]=Object.assign({}, e); });
  (D.calendar||[]).forEach(e=>{ if(e && e.id) F.calendar[e.id]=Object.assign({}, e); });
  Object.keys(D.settings||{}).forEach(k=>{ if(!PRIVATE_SETTINGS.includes(k)) F.settings[k]=D.settings[k]; });
  return JSON.parse(JSON.stringify(F));
}
const same = (a,b) => JSON.stringify(a===undefined?null:a)===JSON.stringify(b===undefined?null:b);
// What changed since the last time this phone and the sheet agreed, as requests the script understands.
function syncDiff(A, B, role){
  const ops=[];
  ['soldiers','scans','practice','times','calendar'].forEach(tab=>{
    if(tab==='calendar' && role!=='admin') return;
    if(role==='grader' && tab!=='soldiers') return;
    if(role==='soldier' && tab!=='scans' && tab!=='practice' && tab!=='times') return;
    const a=A[tab]||{}, b=B[tab]||{};
    Object.keys(b).forEach(id=>{
      if(!a[id]){ ops.push({op:'put', tab, id, patch:b[id]}); return; }
      const patch={}; let n=0;
      new Set([...Object.keys(a[id]), ...Object.keys(b[id])]).forEach(k=>{ if(!same(a[id][k], b[id][k])){ patch[k]=b[id][k]===undefined?null:b[id][k]; n++; } });
      if(n) ops.push({op:'put', tab, id, patch});
    });
    if(role==='grader' || tab==='practice') return;
    Object.keys(a).forEach(id=>{ if(!b[id]) ops.push({op:'del', tab, id}); });
  });
  if(role==='admin'){
    const patch={}; let n=0;
    new Set([...Object.keys(A.settings||{}), ...Object.keys(B.settings||{})]).forEach(k=>{ if(!same((A.settings||{})[k], (B.settings||{})[k])){ patch[k]=(B.settings||{})[k]; n++; } });
    if(n) ops.push({op:'settings', patch});
  }
  return ops;
}
// Called after every save() while signed in: queue whatever changed and send it.
function syncCapture(){
  if(!syncActive() || !SYNC.base) return;
  const cur=syncFlatten(DATA), ops=syncDiff(SYNC.base, cur, SYNC.cfg.user && SYNC.cfg.user.role);
  if(!ops.length) return;
  SYNC.queue.push(...ops); SYNC.base=cur; syncPersist(); syncStatus();
  clearTimeout(SYNC.flushT); SYNC.flushT=setTimeout(()=>syncFlush(), 400);
}

/* ---------- applying what the sheet sends back ---------- */
function stripMeta(r){ const o={}; Object.keys(r).forEach(k=>{ if(k.charAt(0)!=='_') o[k]=r[k]; }); return o; }
function syncApply(res, full){
  const d=res.data||{};
  if(full){
    try{ if(!localStorage.getItem(PRESYNC_KEY) && DATA.soldiers.length) localStorage.setItem(PRESYNC_KEY, JSON.stringify(DATA)); }catch(e){}
    const keepPins={adminPinHash:DATA.settings.adminPinHash, testerPinHash:DATA.settings.testerPinHash};
    DATA = {app:'team-tryout-scorebook', version:1, settings:Object.assign(clone(DEFAULT_SETTINGS), {settingsVersion:0}, keepPins), soldiers:[], timeLogs:[], calendar:[]};
  }
  const byId={}; DATA.soldiers.forEach(s=>byId[s.id]=s);
  (d.soldiers||[]).forEach(r=>{
    if(r._deleted){ DATA.soldiers=DATA.soldiers.filter(s=>s.id!==r.id); delete byId[r.id]; return; }
    let s=byId[r.id];
    if(!s){ s=fixSoldier({id:r.id}); FIELDS.forEach(f=>s[f.k]=null); DATA.soldiers.push(s); byId[r.id]=s; }
    const rec=stripMeta(r);
    // the sheet sends whole rows and leaves out empty cells, so anything missing was cleared
    Object.keys(s).forEach(k=>{ if(k!=='scans' && k!=='practice' && k!=='pinHash' && k!=='id' && !(k in rec)) s[k]=null; });
    Object.assign(s, rec); fixSoldier(s);
  });
  const owner = sid => byId[sid];
  (d.scans||[]).forEach(r=>{ const s=owner(r.sid); if(!s) return; const rec=stripMeta(r); delete rec.sid;
    s.scans=s.scans.filter(x=>x.date!==rec.date); if(!r._deleted) s.scans.push(rec); s.scans.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0); });
  (d.practice||[]).forEach(r=>{ const s=owner(r.sid); if(!s) return; const rec=stripMeta(r); delete rec.sid;
    s.practice=s.practice.filter(x=>!(x.t===rec.t && x.task===rec.task)); if(!r._deleted) s.practice.push(rec); s.practice.sort((a,b)=>a.t-b.t); });
  if(!Array.isArray(DATA.timeLogs)) DATA.timeLogs=[];
  (d.times||[]).forEach(r=>{ DATA.timeLogs=DATA.timeLogs.filter(e=>e.id!==r.id); if(!r._deleted) DATA.timeLogs.push(stripMeta(r)); });
  if(!Array.isArray(DATA.calendar)) DATA.calendar=[];
  (d.calendar||[]).forEach(r=>{ DATA.calendar=DATA.calendar.filter(e=>e.id!==r.id); if(!r._deleted) DATA.calendar.push(stripMeta(r)); });
  const st=d.settings||{};
  if(Object.keys(st).length){ Object.keys(st).forEach(k=>{ if(!PRIVATE_SETTINGS.includes(k)) DATA.settings[k]=st[k]; }); migrateSettings(DATA.settings); rebuildRegistry(); }
  else if(full){ migrateSettings(DATA.settings); rebuildRegistry(); }
  if(d.users){ const m={}; (full?[]:SYNC.users).forEach(u=>m[u.id]=u); d.users.forEach(u=>{ if(u._deleted) delete m[u.id]; else m[u.id]=u; }); SYNC.users=Object.values(m).sort((a,b)=>String(a.name).localeCompare(String(b.name))); SYNC.cfg.users=SYNC.users; }
  if(d.rolePins) SYNC.rolePins=d.rolePins;
  SYNC.cfg.rev=res.rev;
  if(res.me) SYNC.cfg.user=Object.assign({}, SYNC.cfg.user, res.me);
  SYNC.base=syncFlatten(DATA);
  rawSave(); syncPersist();
}

/* ---------- send and receive ---------- */
async function syncFlush(){
  if(!syncActive() || SYNC.busy || !SYNC.queue.length) return;
  SYNC.busy=true; syncStatus();
  // photos are big, so send them a few at a time
  let size=0, n=0; while(n<SYNC.queue.length && n<200){ size+=(SYNC.queue[n].data||'').length; if(n && size>2.5e6) break; n++; }
  const batch=SYNC.queue.slice(0,n);
  try{
    const res=await syncApi('push', {token:SYNC.cfg.token, ops:batch});
    if(res.auth===false) return syncSignedOutByServer(res.error);
    if(!res.ok) throw new Error(res.error||'rejected');
    SYNC.queue=SYNC.queue.slice(batch.length);
    const bad=(res.results||[]).filter(r=>!r.ok);
    SYNC.lastOk=Date.now(); SYNC.error='';
    syncPersist();
    if(bad.length){ toast(`The sheet didn't accept ${bad.length===1?'a change':bad.length+' changes'}: ${bad[0].error}`); SYNC.needFull=true; }
  }catch(e){ SYNC.error = SYNC.online ? String(e.message||e) : ''; }
  finally{ SYNC.busy=false; syncStatus(); }
  if(SYNC.queue.length && SYNC.online) return syncFlush();
  if(SYNC.online) syncPull(SYNC.needFull);
}
async function syncPull(full){
  if(!syncActive() || SYNC.pulling) return;
  if(SYNC.queue.length){ if(!SYNC.busy) syncFlush(); return; }
  SYNC.pulling=true; full = full || !SYNC.base || !SYNC.cfg.rev;
  try{
    const res=await syncApi('pull', {token:SYNC.cfg.token, since: full?0:SYNC.cfg.rev});
    if(res.auth===false) return syncSignedOutByServer(res.error);
    if(!res.ok) throw new Error(res.error||'');
    if(SYNC.queue.length) return;          // something changed here while we were waiting; send that first
    const roleNow = res.me && res.me.role, roleWas = SYNC.cfg.user && SYNC.cfg.user.role;
    const changed = full || Object.keys(res.data||{}).some(k=>Array.isArray(res.data[k]) ? res.data[k].length : Object.keys(res.data[k]||{}).length);
    if(changed || res.rev!==SYNC.cfg.rev){ syncApply(res, full); SYNC.needFull=false; }
    SYNC.lastOk=Date.now(); SYNC.error='';
    if(roleNow && roleWas && roleNow!==roleWas){ toast('Your access changed. Please sign in again.'); return syncSignOut(true); }
    if(changed) syncRerender();
  }catch(e){ SYNC.error = SYNC.online ? String(e.message||e) : ''; }
  finally{ SYNC.pulling=false; syncStatus(); }
}
// Redraw with fresh data, but never while someone is typing or in the middle of entering something.
const SAFE_TABS=['mydash','dash','rank','health','data','myhealth','mytimes','myresults','cal'];
function syncRerender(){
  const a=document.activeElement, typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest('#app');
  const busy = document.querySelector('.tl-form, #moreSheet:not([hidden]), #newsSheet, #calSheet, #pinSheet, #photoSheet') || STATE.weekend || STATE.pendingImport;
  if(typing || busy || !SAFE_TABS.includes(STATE.tab)){ SYNC.pendingRender=true; return; }
  SYNC.pendingRender=false; const y=window.scrollY; render(); window.scrollTo(0,y);
}
function syncStatus(){
  const el=$('syncStat'); if(!el) return;
  const n=SYNC.queue.length;
  let t, cls='';
  if(SYNC.busy || SYNC.pulling && !SYNC.lastOk) t='Syncing\u2026';
  else if(n && !SYNC.online){ t=`${n} change${n===1?'':'s'} waiting for signal`; cls='warn'; }
  else if(n) { t=`${n} change${n===1?'':'s'} sending`; }
  else if(!SYNC.online){ t='Offline \u00B7 showing saved data'; cls='warn'; }
  else if(SYNC.error){ t='Sync problem'; cls='warn'; el.title=SYNC.error; }
  else t='Synced';
  el.textContent=t; el.className='sync-stat '+cls;
}
function syncStart(){
  if(SYNC.timer) clearInterval(SYNC.timer);

}

/* ---------- signing in and out ---------- */
async function syncSignedIn(res, keep){
  SYNC.cfg={token:res.token, user:res.user, rev:0, keep:!!keep}; SYNC.queue=[]; SYNC.base=null; SYNC.users=[];
  setKeepPref(!!keep); syncPersist();
  const u=res.user;
  STATE.session = u.role==='soldier' ? {role:'soldier', soldierId:u.sid} : {role:ROLE_FROM_SERVER[u.role]};
  STATE.gate={step:'choose', error:''};
  await syncPull(true);
  if(u.role==='grader'){ STATE.graderEvents=null; STATE.tab='grade'; }
  else if(u.role==='soldier') STATE.tab='mydash';
  else STATE.tab='home';
  syncStart(); render(); window.scrollTo(0,0);
  if(res.adminKey) showAdminKey(res.adminKey);
}
function syncClearLocal(){

function syncSignOut(force){

    SYNC._warned=true; toast(`${SYNC.queue.length} change${SYNC.queue.length===1?' hasn\'t':'s haven\'t'} reached the sheet yet. Get signal and wait for "Synced", or tap Sign out again to discard.`); syncFlush(); return false;
  }
  SYNC._warned=false;
  const tok=SYNC.cfg.token; if(tok) syncApi('logout',{token:tok}).catch(()=>{});

  syncClearLocal(); return true;
}
function syncSignedOutByServer(msg){
  SYNC.busy=false; SYNC.pulling=false;
  syncSignOut(true); STATE.session=null; STATE.graderEvents=null; STATE.gate={step:'choose', error:''};
  forgetSession(); render(); toast(msg||'Please sign in again.');
}
function syncRestore(){
  syncLoadLocal();
  if(!SYNC.on || !SYNC.cfg.token || !SYNC.cfg.user) return false;
  if(!keepPref()){ const t=SYNC.cfg.token; syncApi('logout',{token:t}).catch(()=>{}); syncClearLocal(); return false; }
  const u=SYNC.cfg.user;
  STATE.session = u.role==='soldier' ? {role:'soldier', soldierId:u.sid} : {role:ROLE_FROM_SERVER[u.role]};
  let v=null; try{ v=JSON.parse(localStorage.getItem(SESSION_KEY)||'null'); }catch(e){}
  if(v && v.role===STATE.session.role){ if(v.tab) STATE.tab=v.tab; if(Array.isArray(v.graderEvents)) STATE.graderEvents=v.graderEvents; }
  else STATE.tab = u.role==='grader'?'grade':u.role==='soldier'?'mydash':'home';
  syncStart(); setTimeout(()=>{ if(SYNC.queue.length) syncFlush(); else syncPull(false); }, 50);
  return true;
}

const ROLE_ORDER=['soldier','grader','captain','leader','admin'];
// One entry per person: a soldier sign-in plus any access tied to it, or a cadre sign-in on its own.
function syncPeople(){
  const N=SYNC.names||[], byId={}, out=[];
  N.filter(u=>!u.of).forEach(u=>{ const p={name:u.name, ids:{}}; p.ids[u.role]=u; byId[u.id]=p; out.push(p); });
  N.filter(u=>u.of).forEach(u=>{ const p=byId[u.of]; if(p) p.ids[u.role]=u; else { const q={name:u.name, ids:{}}; q.ids[u.role]=u; out.push(q); } });
  out.forEach(p=>{ p.roles=ROLE_ORDER.filter(r=>p.ids[r]); });
  return out.sort((a,b)=>String(a.name).localeCompare(String(b.name)));
}

function syncWireGate(){
  const g=STATE.gate, on=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; }, val=id=>{ const el=$(id); return el?el.value.trim():''; };
  const go=step=>{ STATE.gate=Object.assign({}, g, {step, error:'', busy:false, vals:null}); render(); };
  // After a failed try, put back what they typed (PINs and the key are cleared on purpose).
  const keepVals=()=>{ g.vals={}; document.querySelectorAll('.gate input:not([type=password]):not([type=checkbox]), .gate select').forEach(i=>{ if(i.id && i.id!=='syKey') g.vals[i.id]=i.value; }); };
  if(g.vals) Object.keys(g.vals).forEach(id=>{ const el=$(id); if(el && el.type!=='password') el.value=g.vals[id]; });
  wireKeepBoxes();
  on('gLogin',()=>{ STATE.gate={step:'login', error:''}; syncLoadNames(true); render(); }); on('sySetup',()=>go('setup'));
  on('gHome',()=>{ STATE.gate={step:'choose', error:''}; render(); });
  on('gShare',()=>{ STATE.gate={step:'share', error:''}; render(); });
  on('gTheme',showTheme);
  on('gPractice',()=>{ STATE.session={role:'practice'}; STATE.tab='practice'; render(); });
  if(g.step==='share') wireShare(document.querySelector('.gate'));
  on('syBack',()=>{ if(g.step==='pin' && g.pi!=null && (syncPeople()[g.pi]||{roles:[]}).roles.length>1) STATE.gate={step:'role', pi:g.pi, error:''}; else STATE.gate={step:'login', error:''}; render(); });
  on('syNew',()=>go('register'));
  const toRole=(pi, r)=>{ const p=syncPeople()[pi]; STATE.gate={step:'pin', pi, role:r, uid:p.ids[r].id, error:''}; render(); };
  if(g.step==='login' && $('syList')){
    const P=syncPeople();
    const draw=q=>{ q=normName(q); const L=P.map((p,i)=>({p,i})).filter(x=>normName(x.p.name).includes(q));
      $('syList').innerHTML=L.map(({p,i})=>`<button data-pi="${i}"><span>${esc(p.name)}</span></button>`).join('') || `<p class="sub">${q?'No matches.':'No one yet. Use "I\'m not on this list".'}</p>`;
      $('syList').querySelectorAll('[data-pi]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.pi, p=P[i]; if(p.roles.length===1) toRole(i, p.roles[0]); else { STATE.gate={step:'role', pi:i, error:''}; render(); } }); };
    draw(''); $('syQ').oninput=e=>draw(e.target.value); $('syQ').focus();
  }
  document.querySelectorAll('[data-syrole]').forEach(b=>b.onclick=()=>toRole(g.pi, b.dataset.syrole));
  const busy=async(fn)=>{ keepVals(); g.busy=true; g.error=''; render(); try{ await fn(); }catch(e){ g.error='No connection to Rusty Anvil. Check your signal and try again.'; } g.busy=false; if(!STATE.session) render(); };
  const keep=()=>{ const k=document.querySelector('.gKeep'); return k?k.checked:false; };
  if(g.step==='pin' && $('syPin')){
    const u=(SYNC.names||[]).find(x=>x.id===g.uid)||{};
    const submit=()=>{ const pin=val('syPin'), rolePin=val('syRole'), key=val('syKey'), k=keep();
      if(g.role==='admin' && !key){ g.error='Enter the secret key.'; keepVals(); render(); return; }
      if(!u.hasPin){ if(!/^\d{4,8}$/.test(pin)){ g.error='Choose a PIN of 4 to 8 digits.'; keepVals(); render(); return; } if(pin!==val('syPin2')){ g.error='The PINs don\'t match.'; keepVals(); render(); return; } }
      busy(async()=>{ const r=await syncApi('login',{userId:g.uid, pin, rolePin, key, keep:k}); if(!r.ok){ g.error=r.error; return; } await syncSignedIn(r,k); }); };
    on('syGo',submit); ['syPin','syPin2','syRole','syKey'].forEach(id=>{ const el=$(id); if(el) el.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } }; });
    (($('syKey'))||($('syRole'))||$('syPin')).focus();
  }
  on('syReg',()=>{ const name=val('syName'), age=val('syAge'), pin=val('syPin'), k=keep();
    if(!name){ g.error='Name is required.'; keepVals(); render(); return; }
    if(age && (!/^\d+$/.test(age)||+age<16||+age>70)){ g.error='Age must be a number from 16 to 70.'; keepVals(); render(); return; }
    if(!/^\d{4,8}$/.test(pin)){ g.error='PIN must be 4 to 8 digits.'; keepVals(); render(); return; }
    if(pin!==val('syPin2')){ g.error='The PINs don\'t match.'; keepVals(); render(); return; }
    busy(async()=>{ const r=await syncApi('register',{name, age, sex:$('sySex').value, pin, keep:k}); if(!r.ok){ g.error=r.error; return; } SYNC.names=null; await syncSignedIn(r,k); }); });
  on('syBoot',()=>{ const code=val('syCode'), name=val('syName'), pin=val('syPin'), graderPin=val('syGrd'), k=keep();
    if(!/^\d{6}$/.test(code)){ g.error='The setup code is 6 digits.'; keepVals(); render(); return; }
    if(!name){ g.error='Your name is required.'; keepVals(); render(); return; }
    if(!/^\d{4,8}$/.test(pin)){ g.error='Your PIN must be 4 to 8 digits.'; keepVals(); render(); return; }
    if(graderPin && !/^\d{4,8}$/.test(graderPin)){ g.error='The grader PIN must be 4 to 8 digits.'; keepVals(); render(); return; }
    const bring=$('syBring') && $('syBring').checked;
    const data = bring ? {soldiers:DATA.soldiers.filter(s=>!s.sample), timeLogs:DATA.timeLogs||[], calendar:DATA.calendar||[], settings:DATA.settings} : null;
    busy(async()=>{ const r=await syncApi('bootstrap',{code, name, pin, graderPin:graderPin||null, data, keep:k}); if(!r.ok){ g.error=r.error; return; } SYNC.ready=true; SYNC.names=null; await syncSignedIn(r,k); }); });
}

// Shrinks a phone photo to at most 1280px on its long side as a JPEG, so it sends quickly on weak signal.
function shrinkPhoto(file){
  return new Promise((resolve, reject)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ try{
      let w=img.naturalWidth, h=img.naturalHeight, max=1280, q=0.72, out='';
      for(let tries=0; tries<4; tries++){
        const k=Math.min(1, max/Math.max(w,h)), cw=Math.max(1,Math.round(w*k)), ch=Math.max(1,Math.round(h*k));
        const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch; cv.getContext('2d').drawImage(img,0,0,cw,ch);
        out=cv.toDataURL('image/jpeg', q).split(',')[1];
        if(out.length<900000) break; max=Math.round(max*0.75); q=Math.max(0.5,q-0.08);
      }
      URL.revokeObjectURL(url); resolve(out);
    }catch(e){ URL.revokeObjectURL(url); reject(e); } };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('bad image')); };
    img.src=url;
  });
}
function syncQueuePhoto(id, data){

}

/* ============================== training calendar ============================== */
// DATA.calendar: {id, title, start, end?, from?, to?, who?, what?, where?, uniform?, notes?, repeat?:{days:[0-6], until}, skip?:[dates], of?, on?, updated, by}
// A repeating entry shows on each chosen weekday until "until". Changing one day of a series makes a separate entry (of = series id, on = that day)
// and adds the day to the series' skip list.
const CAL_W = [['who','Who'],['what','What'],['when','When'],['where','Where'],['uniform','Uniform']];
const DAYS_SHORT=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], DAYS_LETTER=['S','M','T','W','T','F','S'];
const CAL_SEEN_KEY='rustyAnvil_calSeen', CAL_DISMISS_KEY='rustyAnvil_calDismiss';
function calList(){ if(!Array.isArray(DATA.calendar)) DATA.calendar=[]; return DATA.calendar; }
// Two calendars: Ranger Challenge (cal 'rc', and everything from before the split) and Battalion ('bn').
const calOf = e => e.cal==='bn' ? 'bn' : 'rc';
function calBothVisible(){ const r=myRole(); if(r==='soldier'){ const me=meSoldier(); return isRCs(me); } return r!=='grader' && r!=='tester'; }
function calRoleSees(e){ const r=myRole(); if(r==='soldier') return calOf(e)==='bn' || isRCs(meSoldier()); if(r==='grader'||r==='tester') return calOf(e)==='rc'; return true; }
function calShows(e){ if(!calRoleSees(e)) return false; const f=calBothVisible() && STATE.cal && STATE.cal.show; return !f || f==='all' || calOf(e)===f; }
function calCanEdit(e){ const r=myRole(); return r==='admin' || r==='leader' || (r==='captain' && (!e || calOf(e)==='rc')); }
function calCanAdd(){ return ['admin','leader','captain'].includes(myRole()); }
const CAL_NAME={rc:'Ranger Challenge', bn:'Battalion'};
const isoOf = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const dateOf = s => { const [y,m,d]=String(s).split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=dateOf(s); d.setDate(d.getDate()+n); return isoOf(d); };
const calDayLabel = (s, o) => dateOf(s).toLocaleDateString([], o||{weekday:'short', month:'short', day:'numeric'});
function fmtClock(t){ if(!t) return ''; const [h,m]=t.split(':').map(Number); return String(h).padStart(2,'0')+String(m).padStart(2,'0'); }
function calWhen(e){
  const t = e.from ? fmtClock(e.from)+(e.to?'\u2013'+fmtClock(e.to):'') : 'All day';
  return e.end && e.end!==e.start ? `${calDayLabel(e.start,{month:'short',day:'numeric'})} \u2013 ${calDayLabel(e.end,{month:'short',day:'numeric'})}${e.from?', '+t:''}` : t;
}
function calBlank(e){ return CAL_W.filter(([k])=> k==='when' ? !e.from && !(e.end && e.end>e.start) : !String(e[k]||'').trim()).map(([,l])=>l); }
// Every entry that falls on each day from a to b (inclusive), in time order.
function calExpand(a, b){
  const out={};
  const add=(day, e)=>{ if(day<a || day>b) return; (out[day]=out[day]||[]).push(e); };
  calList().forEach(e=>{
    if(!e.start || !calShows(e)) return;
    if(e.repeat && Array.isArray(e.repeat.days) && e.repeat.days.length){
      const until = e.repeat.until && e.repeat.until<b ? e.repeat.until : b, skip=e.skip||[];
      for(let d = e.start<a ? a : e.start; d<=until; d=addDays(d,1)) if(e.repeat.days.includes(dateOf(d).getDay()) && !skip.includes(d)) add(d, e);
      return;
    }
    const end = e.end && e.end>e.start ? e.end : e.start;
    for(let d = e.start<a ? a : e.start; d<=end && d<=b; d=addDays(d,1)) add(d, e);
  });
  Object.values(out).forEach(L=>L.sort((x,y)=>(x.from?1:0)-(y.from?1:0) || String(x.from||'').localeCompare(String(y.from||'')) || String(x.title).localeCompare(String(y.title))));
  return out;
}
function calSeen(){ try{ return localStorage.getItem(CAL_SEEN_KEY)||''; }catch(e){ return ''; } }
function calUnseen(){ const s=calSeen(); return !!s && calList().some(e=>calRoleSees(e) && e.updated && e.updated>s && e.by!==calMe()); }
function calMe(){ return (typeof SYNC!=='undefined' && SYNC.cfg && SYNC.cfg.user && SYNC.cfg.user.name) || (isAdmin()?'Admin':''); }

function renderCalendar(c){

  const seenBefore = C.seenAtOpen!=null ? C.seenAtOpen : (C.seenAtOpen=calSeen());

  let cells='';

      <div id="calAsk-${e.id}"></div>
    </div>`;
  };
  // Coming up: a multi-day entry is listed once, on its first day in range.
  const upSeen=new Set(); Object.keys(upcoming).sort().forEach(d=>{ upcoming[d]=upcoming[d].filter(e=>{ if(!(e.end&&e.end>e.start)) return true; if(upSeen.has(e.id)) return false; upSeen.add(e.id); return true; }); if(!upcoming[d].length) delete upcoming[d]; });
  const upDays=Object.keys(upcoming).sort();
  c.innerHTML=`<div class="stack cal">
    <div class="panel cal-top">
      <div class="row" style="justify-content:space-between">
        <div class="row" style="gap:6px"><button class="btn sm" id="calPrev" aria-label="Previous month">\u2039</button><h2 style="margin:0;min-width:9.5em;text-align:center">${first.toLocaleDateString([], {month:'long', year:'numeric'})}</h2><button class="btn sm" id="calNext" aria-label="Next month">\u203A</button></div>
        <div class="row" style="gap:6px"><button class="btn sm" id="calToday">Today</button>${admin?'<button class="btn primary sm" id="calAdd">+ Add</button>':''}</div>

/* ---------- step lists <-> text ---------- */
function stepsToText(k, list){
  if(k==='tccc') return list.map(s=>s.grp ? `M | ${s.s}` : `${s.k} | ${s.t}`).join('\n');
  if(k==='fx'||k==='bn') return list.map(s=>s.t+(s.only?` [only: ${s.only}]`:'')).join('\n');
  if(k==='grenade') return list.join('\n');
  return list.map(ph=>`## ${ph.t} (${ph.type==='seq'?'in order':ph.type==='set'?'any order':'note'})`+(ph.note?`\n> ${ph.note}`:'')+'\n'+ph.steps.join('\n')).join('\n\n');
}
function textToSteps(k, text){
  const lines=String(text).split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length) throw new Error('Add at least one step.');
  if(k==='tccc'){ let n=0; return lines.map(l=>{ const m=l.match(/^([^|]{1,4})\|\s*(.+)$/); const key=m?m[1].trim():String(++n), t=m?m[2].trim():l;
      if(/^m$/i.test(key)) return {k:'M', grp:'M', s:t, t:'Massive bleeding sweep: '+t}; if(/^\d+$/.test(key)) n=+key; return {k:key, t}; }); }
  if(k==='fx'||k==='bn') return lines.map((l,i)=>{ const m=l.match(/\[only:\s*(\w+)\]\s*$/i); const o={k:String(i+1), t:l.replace(/\s*\[only:[^\]]*\]\s*$/i,'').trim()}; if(m) o.only=m[1].toLowerCase(); return o; });
  if(k==='grenade') return lines;
  const phases=[]; let cur=null;
  lines.forEach(l=>{
    const h=l.match(/^##\s*(.+?)\s*(?:\((in order|any order|note)\))?$/i);
    if(h){ cur={t:h[1], type:!h[2]||/in order/i.test(h[2])?'seq':/any/i.test(h[2])?'set':'note', steps:[]}; phases.push(cur); return; }
    if(!cur) throw new Error('Start with a "## Title (in order)" line.');
    if(l.startsWith('>')){ cur.note=l.slice(1).trim(); return; }
    cur.steps.push(l);
  });
  if(phases.some(p=>!p.steps.length)) throw new Error('Every part needs at least one step under it.');
  return phases;
}

/* ---------- simple formatting for Reference cards ---------- */
// "## Heading", "1. numbered", "- bullet", **bold**, blank line between paragraphs.
function mdInline(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }
function mdToHtml(md){
  const out=[]; let list=null;
  const close=()=>{ if(list){ out.push(`</${list}>`); list=null; } };
  String(md||'').split('\n').forEach(raw=>{
    const l=raw.trim();
    if(!l){ close(); return; }
    let m;
    if((m=l.match(/^#{1,3}\s+(.+)/))){ close(); out.push(`<h3 class="md-h">${mdInline(m[1])}</h3>`); return; }
    if((m=l.match(/^(\d+|[A-Z])[.)]\s+(.+)/))){ if(list!=='ol'){ close(); out.push('<ol class="md-ol">'); list='ol'; } out.push(`<li><span class="md-n">${esc(m[1])}</span><span>${mdInline(m[2])}</span></li>`); return; }
    if((m=l.match(/^[-\u2022*]\s+(.+)/))){ if(list!=='ul'){ close(); out.push('<ul class="md-ul">'); list='ul'; } out.push(`<li>${mdInline(m[1])}</li>`); return; }
    close(); out.push(`<p class="md-p">${mdInline(l)}</p>`);
  });
  close(); return `<div class="md">${out.join('')}</div>`;
}
// Turns a built-in card into editable text, as close to its layout as plain text allows.
function htmlToMd(html){
  const d=document.createElement('div'); d.innerHTML=html; const out=[];
  const inline=n=>{ let s=''; n.childNodes.forEach(c=>{ if(c.nodeType===3) s+=c.textContent; else if(/^(B|STRONG)$/.test(c.tagName)) s+='**'+c.textContent.trim()+'** '; else if(c.tagName==='IMG') {} else if(/^(UL|OL)$/.test(c.tagName)) {} else s+=inline(c)+(/^(DIV|P)$/.test(c.tagName)?' \u2014 ':''); }); return s.replace(/\s+/g,' ').replace(/( \u2014 )+$/,'').trim(); };
  const walk=n=>{
    n.childNodes.forEach(c=>{
      if(c.nodeType!==1) return;
      const t=c.tagName;
      if(/^H[1-4]$/.test(t)){ out.push('', '## '+c.textContent.trim()); return; }
      if(t==='OL' || t==='UL'){
        let i=0; [...c.children].forEach(li=>{ i++;
          const key=li.querySelector(':scope > .num, :scope > .tg-k, :scope > .md-n'); const k=key?key.textContent.trim():String(i);
          if(key) key.remove();
          const sub=li.querySelector(':scope ul, :scope ol');
          const text=inline(li);
          out.push(t==='OL' ? `${/^[A-Z0-9]+$/.test(k)?k:i}. ${text}` : `- ${text}`);
          if(sub) [...sub.children].forEach(s=>out.push('- '+inline(s)));
        }); out.push(''); return;
      }
      if(t==='P'){ out.push(inline(c)); return; }
      if(c.classList.contains('rg')){ const b=c.querySelector('b'), p=c.querySelector('p'); out.push(`- **${b?b.textContent.trim():''}** ${p?p.textContent.trim():''}`); return; }
      walk(c);
    });
  };
  walk(d);
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
// Reference cards with the admin's changes applied, plus any cards they added.
function refCardsEffective(){
  const out=[];
  refCards().forEach(c=>{

    .forEach(a=>out.push({id:'add-'+a.id, addId:a.id, title:a.title, tags:'', html:mdToHtml(a.text), custom:true}));
  return out;
}

    const k=ss.dataset.k; let v;
    try{ v=textToSteps(k, $('ceStepTxt').value); }catch(e){ $('ceStepMsg').textContent=e.message; return; }
    contentSet('steps:'+k, v); STATE.tccc=null; st.ed=null; toast('Steps saved. Graders and Practice use them now.'); render();
  };
  const gs=$('ceGrenSave'); if(gs) gs.onclick=()=>{ const v=$('ceGren').value.split('\n').map(x=>x.trim()).filter(Boolean); if(!v.length) return toast('Add at least one grenade.'); DATA.settings.grenadeList=v.join('\n'); save(); toast('Grenade list saved.'); render(); };
  const scenList=k=>clone(contentGet('scen:'+k)||(k==='spot'?Drill.OBSERVED:Drill.CONTACT));
  c.querySelectorAll('[data-cescen]').forEach(b=>b.onclick=()=>open('scen:'+b.dataset.cescen));
  c.querySelectorAll('[data-cescennew]').forEach(b=>b.onclick=()=>open('scen:'+b.dataset.cescennew+':new'));
  c.querySelectorAll('[data-cescenreset]').forEach(b=>b.onclick=()=>{ contentSet('scen:'+b.dataset.cescenreset, null); toast('Original scenarios restored.'); render(); });

  const sv=$('ceScenSave'); if(sv) sv.onclick=()=>{
    const [,k,i]=st.ed.split(':'), x={}; c.querySelectorAll('[data-scf]').forEach(el=>x[el.dataset.scf]=el.value.trim());
    const missing=SCEN[k].fields.filter(([f])=>f!=='alt' && !x[f]).map(([,l])=>l);
    if(missing.length) return $('ceScenMsg').textContent='Fill in: '+missing.join(', ');
    x[k==='spot'?'see':'what']=x[k==='spot'?'see':'what'].replace(/\.\s*$/,'');
    const L=scenList(k); if(i==='new') L.push(x); else L[+i]=x;
    contentSet('scen:'+k, L); st.ed=null; toast('Scenario saved. Practice and graders can get it now.'); render();

  c.querySelectorAll('[data-ceinj]').forEach(b=>b.onclick=()=>open('inj:'+b.dataset.ceinj));

  const is=$('ceInjSave'); if(is) is.onclick=()=>{

    contentSet('scen:inj', ov); st.ed=null; toast('Casualty saved.'); render();
  };

/* ============================== theme (Auto / Light / Dark) and charts ============================== */
const THEME_KEY='rustyAnvil_theme';
function themePref(){ try{ return localStorage.getItem(THEME_KEY)||'auto'; }catch(e){ return 'auto'; } }
function themeResolved(){ const p=themePref(); return p==='light'||p==='dark' ? p : (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); }
function applyTheme(){
  const t=themeResolved(); document.documentElement.dataset.theme=t;
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', t==='light'?'#262B33':'#111214');
}
applyTheme();
if(window.matchMedia){ const mq=matchMedia('(prefers-color-scheme: light)'); const on=()=>{ if(themePref()==='auto'){ applyTheme(); if(typeof render==='function' && typeof STATE!=='undefined') render(); } }; mq.addEventListener ? mq.addEventListener('change', on) : mq.addListener(on); }
function setTheme(p){ try{ localStorage.setItem(THEME_KEY, p); }catch(e){} applyTheme(); render(); }
function showTheme(){
  if(document.getElementById('themeSheet')) return;
  const cur=themePref(), w=document.createElement('div'); w.className='sheet-wrap news-wrap'; w.id='themeSheet';
  const opt=(k,l,d)=>`<button class="sheet-item" data-theme-pick="${k}" ${cur===k?'aria-current="page"':''}><span><b style="font-weight:600">${l}</b><br><span class="soft" style="font-size:13px">${d}</span></span></button>`;
  w.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="Appearance"><h2 style="margin:6px 12px 8px">Appearance</h2>
    ${opt('auto','Auto','Match this phone or computer')}${opt('light','Light','Light background')}${opt('dark','Dark','Dark background')}
    <button class="sheet-item sheet-close" id="themeClose">Close</button></div>`;
  document.body.appendChild(w);
  const close=()=>w.remove();
  w.querySelectorAll('[data-theme-pick]').forEach(b=>b.onclick=()=>{ close(); setTheme(b.dataset.themePick); });
  w.querySelector('#themeClose').onclick=close; w.onclick=e=>{ if(e.target===w) close(); };
  w.onkeydown=e=>{ if(e.key==='Escape') close(); };
  const f=w.querySelector('[aria-current]')||w.querySelector('.sheet-item'); if(f) f.focus();
}

/* ---------- charts (Chart.js, bundled so they work offline) ---------- */
// Screens build HTML strings, so a chart is placed as a canvas and drawn right after the HTML lands.
const CHART_Q=[]; let CHARTS_LIVE=[], chartTick=false;
function chartTheme(){
  const cs=getComputedStyle(document.documentElement), v=k=>cs.getPropertyValue(k).trim(), light=document.documentElement.dataset.theme==='light';
  return {light, ink:v('--ink'), soft:v('--inkSoft'), line:v('--line'), panel:v('--panel'), good:v('--good'), bad:v('--alert'), warn:light?'#C77A12':'#E0A13A', pri:v('--navy'),
    series: light ? ['#B5481C','#1F3A5F','#2F855A','#8A6116','#6B46C1','#2B8A9E','#BE185D','#64748B'] : ['#E07A45','#7FA7D9','#62C0A6','#D49A5C','#B49BE8','#5FC3D6','#E58FB6','#9EA2A8']};
}
// cfg is a function (theme)=>Chart config, so colors follow Light / Dark.
function chartBox(cfg, o){
  o=o||{}; const id='ch_'+Math.random().toString(36).slice(2,9);
  CHART_Q.push({id, cfg});
  if(!chartTick){ chartTick=true; Promise.resolve().then(()=>{ chartTick=false; mountCharts(); }); }
  return `<div class="chartbox${o.tall?' tall':''}${o.short?' short':''}"><canvas id="${id}" role="img" aria-label="${esc(o.label||'Chart')}"></canvas></div>`;
}
function mountCharts(){
  CHARTS_LIVE=CHARTS_LIVE.filter(c=>{ if(c.canvas && document.body.contains(c.canvas)) return true; c.destroy(); return false; });
  const q=CHART_Q.splice(0);
  if(!window.Chart){ q.forEach(({id})=>{ const el=document.getElementById(id); if(el) el.parentNode.innerHTML='<p class="sub" style="margin:0">Charts couldn\'t load.</p>'; }); return; }
  const T=chartTheme();
  Chart.defaults.color=T.soft; Chart.defaults.borderColor=T.line;
  Chart.defaults.font.family=getComputedStyle(document.body).fontFamily; Chart.defaults.font.size=12;
  q.forEach(({id,cfg})=>{ const el=document.getElementById(id); if(!el) return; try{ CHARTS_LIVE.push(new Chart(el, cfg(T))); }catch(e){ console.error(e); } });
}
// Shared look, after the knowledge-check tracker: smooth lines with points, index tooltips, legend at the bottom when there's more than one line.
const fmtPctTick = v => v+'%';
function axisFor(kind, T, title){
  const a={grid:{color:T.line}, ticks:{color:T.soft}, title: title?{display:true, text:title, color:T.soft}:undefined};
  if(kind==='pct') Object.assign(a,{min:0, max:100, ticks:{color:T.soft, callback:fmtPctTick}});
  if(kind==='time') a.ticks.callback=v=>fmtLong(v);
  return a;
}
function fmtVal(kind, v){ if(v==null||isNaN(v)) return '\u2013'; return kind==='pct' ? Math.round(v)+'%' : kind==='time' ? fmtLong(v) : (Math.round(v*10)/10).toLocaleString(); }
function lineChart(labels, sets, o){
  o=o||{};
  return chartBox(T=>({
    type:'line',
    data:{labels, datasets:sets.map((d,i)=>{ const c=d.color||T.series[i%T.series.length];
      return Object.assign({borderColor:c, backgroundColor:c, tension:.25, spanGaps:true, pointRadius:4, pointHoverRadius:6, borderWidth:2}, d.dash?{borderDash:[6,5], pointRadius:0, pointHoverRadius:0, borderWidth:1.5, borderColor:T.soft, backgroundColor:T.soft}:{}, d, {color:undefined, dash:undefined}); })},
    options:{responsive:true, maintainAspectRatio:false, interaction:{mode:'index', intersect:false},
      scales:{x:{grid:{display:false}, ticks:{color:T.soft, maxRotation:0, autoSkip:true}}, y:Object.assign(axisFor(o.y||'num', T, o.yTitle), o.yMin!=null?{suggestedMin:o.yMin}:{}, o.reverse?{reverse:true}:{})},
      plugins:{legend:{display:sets.filter(s=>!s.dash).length>1 || !!o.legend, position:'bottom', labels:{boxWidth:12, color:T.ink}},
        tooltip:{callbacks:{label:c=>c.dataset.label+': '+fmtVal(o.y, c.parsed.y)+(o.unit?' '+o.unit:'')}}}}
  }), o);
}
// Bars colored by how good the value is: o.good(v) -> 'good' | 'warn' | 'bad'.
function barChart(labels, values, o){
  o=o||{};
  const h=o.horizontal, n=labels.length;
  if(h && !o.tall && !o.short) o.height=Math.max(140, 34*n+50);
  const html=chartBox(T=>({
    type:'bar',
    data:{labels, datasets:[{label:o.label||'', data:values, borderRadius:4, maxBarThickness:28,
      backgroundColor:values.map((v,i)=>{ const g=o.good?o.good(v,i):null; return g==='good'?T.good:g==='bad'?T.bad:g==='warn'?T.warn:(o.color||T.pri); })}]},
    options:{indexAxis:h?'y':'x', responsive:true, maintainAspectRatio:false,
      scales: h ? {x:axisFor(o.y||'num',T,o.yTitle), y:{grid:{display:false}, ticks:{autoSkip:false, color:T.ink}}}
                : {y:axisFor(o.y||'num',T,o.yTitle), x:{grid:{display:false}, ticks:{autoSkip:true, maxRotation:0, color:T.ink}}},
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>(o.label?o.label+': ':'')+fmtVal(o.y, c.parsed[h?'x':'y']), afterLabel:c=>o.after?o.after(c.dataIndex):''}}}}
  }), o);
  return o.height ? html.replace('<div class="chartbox', `<div style="height:${o.height}px" class="chartbox`) : html;
}
const goodPct = v => v>=80?'good':v>=60?'warn':'bad';

/* ============================== weigh-ins ============================== */
// A weigh-in is a time-log entry {kind:'weight', sid, date, lb}, so it syncs the same way runs and rucks do.
function weighIns(sid){ return timeLogs().filter(e=>e.kind==='weight' && e.sid===sid && e.lb>0).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.at||0)-(b.at||0)); }
const fmtLb = v => (Math.round(v*10)/10).toLocaleString(undefined,{minimumFractionDigits:1, maximumFractionDigits:1});
function weightFormHtml(){
  return `<div class="w-form"><div class="grid">
      <label class="field"><span>Date</span><input class="input" type="date" id="w_date" value="${todayISO()}"></label>
      <label class="field"><span>Weight (lb)</span><input class="input" id="w_lb" inputmode="decimal" placeholder="e.g. 182.4" autocomplete="off"></label>
    </div>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="w_save">Save weight</button><span id="w_msg" class="sub" style="margin:0"></span></div></div>`;
}
function weightSave(sid){
  const msg=$('w_msg'), lbEl=$('w_lb'), v=parseFloat(String(lbEl.value).replace(/[^0-9.]/g,''));
  lbEl.classList.remove('bad');
  if(!(v>=60 && v<=500)){ lbEl.classList.add('bad'); lbEl.focus(); msg.innerHTML='<span style="color:var(--alert)">Enter your weight in pounds, like 182.4.</span>'; return false; }
  const date=$('w_date').value||todayISO();
  const e={id:uid(), kind:'weight', date, sid, lb:Math.round(v*10)/10, at:Date.now()};
  if(STATE.session && STATE.session.role==='soldier') e.self=true;

/* ---------- "?" help: extra words stay one tap away ---------- */
function helpBtn(key, label){ return `<button type="button" class="help-q" data-help="${key}" aria-expanded="false" aria-label="${esc(label||'More about this')}">?</button>`; }
function helpBox(key, html){ return `<div class="help-box" data-helpbox="${key}" hidden>${html}</div>`; }
// Long intro text under a heading: keep the first sentence, tuck the rest behind a "?".
function splitFirstSentence(html){
  let depth=0;
  for(let i=0;i<html.length-1;i++){
    const ch=html[i];
    if(ch==='<') depth++; else if(ch==='>') depth--;
    else if(!depth && (ch==='.'||ch==='?'||ch==='!') && /\s/.test(html[i+1])){
      const rest=html.slice(i+1).trim(); if(rest.replace(/<[^>]*>/g,'').trim().length<2) return null;
      return [html.slice(0,i+1), rest];
    }
  }
  return null;
}
function tuckText(root){
  if(!root) return;
  root.querySelectorAll('p.sub, p.soft').forEach(p=>{
    if(p.id || p.dataset.tucked || p.closest('.drill,.guide,.help-box,.recorder,.no-tuck')) return;
    const prev=p.previousElementSibling; if(!prev || !/^H[23]$/.test(prev.tagName)) return;
    if(p.querySelector('button,input,select,textarea,a,label')) return;
    if(p.textContent.trim().length<90) return;
    const parts=splitFirstSentence(p.innerHTML); if(!parts) return;
    p.dataset.tucked='1';
    p.innerHTML=`${parts[0]} <button type="button" class="help-q" data-tuck aria-expanded="false" aria-label="More about this">?</button><span class="tuck-more" hidden> ${parts[1]}</span>`;
  });
}
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-help],[data-tuck]'); if(!b) return;
  const box = b.dataset.help!=null ? document.querySelector(`[data-helpbox="${b.dataset.help}"]`) : b.nextElementSibling;
  if(!box) return;
  box.hidden=!box.hidden; b.setAttribute('aria-expanded', String(!box.hidden));
});

  $('hLogOpen').onclick=()=>{ STATE.hLogOpen=true; render(); };
  healthDash($('hDashBody'));
}
function peopleList(el){
  const f=STATE.pFilter||'all', q=STATE.pQuery||'';
  const all=scopeRoster().slice().sort((a,b)=>a.name.localeCompare(b.name));
  const ranks={}; ranked('overall').forEach((r,i)=>ranks[r.s.id]={i:i+1, t:r.sc.total});
  const inT=x=>isRCs(x) && x.tryout!==false;
  const pass=x=>f==='all'||(f==='in'?inT(x):!inT(x));
  const grpLabel = x => isCaptain() ? '' : isRCs(x) ? 'Ranger Challenge' : 'Battalion';
  const A=STATE.pAdd;
  el.innerHTML=`<div class="panel">
    <div class="row" style="justify-content:space-between;gap:10px;margin-bottom:10px">
      ${segHtml('pfilter', [['all',`All (${all.length})`],['in',`In tryout (${all.filter(inT).length})`],['out','Not in tryout']], f, 'Filter')}
      ${A?'':'<button class="btn primary sm" id="pAdd">+ Add person</button>'}
    </div>
    ${A?`<div class="panel" style="margin-bottom:12px;background:var(--panelAlt)"><h3 style="margin-top:0">Add a person</h3>
      <div class="grid">
        <label class="field" style="grid-column:span 2"><span>Name</span><input class="input" id="paName" placeholder="Last, First" value="${esc(A.name||'')}"></label>
        <label class="field"><span>Age</span><input class="input" id="paAge" inputmode="numeric" value="${esc(A.age||'')}"></label>
        <label class="field"><span>Sex</span><select class="input" id="paSex"><option value="M">M</option><option value="F" ${A.sex==='F'?'selected':''}>F</option></select></label>
        ${isCaptain()?'':`<label class="field" style="grid-column:span 2"><span>Group</span><select class="input" id="paGrp"><option value="bn">Battalion</option><option value="rc" ${(A.grp||STATE.pGroup)==='rc'?'selected':''}>Ranger Challenge (joins the tryout)</option></select></label>`}
      </div>
      ${isCaptain()?'<p class="sub" style="margin:8px 0 0">They\'ll be added to Ranger Challenge and the tryout.</p>':''}
      <div class="row" style="margin-top:12px"><button class="btn primary" id="paSaveP">Add</button><button class="btn" id="paCancelP">Cancel</button><span id="paMsgP" class="flag"></span></div></div>`:''}
    <input class="input" id="pq" placeholder="Search name" aria-label="Search name" value="${esc(q)}" autocomplete="off" style="margin-bottom:8px">
    <div class="plist" id="pList"></div></div>`;
  const draw=()=>{ const n=normName(STATE.pQuery||''); const L=all.filter(x=>pass(x) && normName(x.name).includes(n));
    $('pList').innerHTML = L.map(x=>{ const sc=latestScan(fixSoldier(x)), r=ranks[x.id];
      return `<button class="prow" data-pid="${x.id}"><span class="prow-main"><b>${esc(x.name)}</b><small>${[x.sex, x.age, grpLabel(x), isRCs(x)?(x.tryout!==false?'In tryout':'Not in tryout'):'', sc?'Scan '+fmtDay(sc.date):''].filter(Boolean).map(esc).join(' \u00B7 ')}</small></span>${r?`<span class="prow-rank"><b>${fmt1(r.t)}</b><small>#${r.i}</small></span>`:''}</button>`; }).join('') || `<p class="sub" style="margin:8px 0">${all.length?'No one matches.':'No one here yet.'}</p>`;
    $('pList').querySelectorAll('[data-pid]').forEach(b=>b.onclick=()=>openPerson(b.dataset.pid)); };
  draw();
  $('pq').oninput=e=>{ STATE.pQuery=e.target.value; draw(); };
  el.querySelectorAll('[data-pfilter]').forEach(b=>b.onclick=()=>{ STATE.pFilter=b.dataset.pfilter; render(); });
  const pa=$('pAdd'); if(pa) pa.onclick=()=>{ STATE.pAdd={}; render(); const n=$('paName'); if(n) n.focus(); };
  if(A){
    $('paCancelP').onclick=()=>{ STATE.pAdd=null; render(); };
    $('paSaveP').onclick=()=>{
      const name=$('paName').value.trim(), age=$('paAge').value.trim(), sex=$('paSex').value, rc=isCaptain()||$('paGrp').value==='rc', msg=t=>{ $('paMsgP').textContent=t; };
      Object.assign(A,{name, age, sex, grp:rc?'rc':'bn'});
      if(!name) return msg('Name is required.');
      if(age && (!/^\d+$/.test(age)||+age<16||+age>70)) return msg('Age must be a number from 16 to 70.');
      if(rosterAll().some(x=>normName(x.name)===normName(name))) return msg(`${name} is already on the roster.`);
      const s=fixSoldier({id:uid(), name, age:age?+age:'', sex, rc, tryout:rc}); FIELDS.forEach(f=>s[f.k]=null);
      DATA.soldiers.push(s); STATE.pAdd=null; STATE.grid=null; save(); toast(`Added ${name}${rc?' to Ranger Challenge':' to the battalion'}.`); openPerson(s.id);
    };
  }
}
function renderPerson(c, s){
  fixSoldier(s);
  const inT=isRCs(s) && s.tryout!==false, views=[...(inT?[['scores','Scores']]:[]),['times','Times'],['health','Health'],['practice','Practice']];
  if(!views.some(v=>v[0]===STATE.personView)) STATE.personView=views[0][0];
  const v=STATE.personView, sc=inT?score(s):null, ov=ranked('overall'), idx=inT?ov.findIndex(r=>r.s.id===s.id):-1, scan=latestScan(s);
  c.innerHTML=`<div class="stack">
    <div class="row no-print"><button class="btn sm" id="pBack">\u2190 People</button></div>
    <div class="panel person-head">
      <div class="row" style="justify-content:space-between;align-items:flex-start;gap:12px">
        <div><h2 style="margin:0 0 2px">${esc(s.name)}</h2><p class="soft" style="margin:0">${[s.sex==='F'?'Female':s.sex==='M'?'Male':'', s.age?'Age '+s.age:''].filter(Boolean).join(' \u00B7 ')} \u00B7 <span class="badge ${isRCs(s)?'b-brass':'b-none'}">${isRCs(s)?'Ranger Challenge':'Battalion'}</span>${isRCs(s)&&!inT?' <span class="badge b-none">Not in tryout</span>':''}</p></div>
        ${inT?`<div class="person-score"><b>${fmt1(sc.total)}</b><small>Rank ${idx+1} of ${ov.length}${isCut(sc)?' \u00B7 cut':idx<cutIndex(ov)?' \u00B7 above the line':' \u00B7 below the line'}</small></div>`:''}
      </div>
      <div class="row" style="margin-top:12px;gap:8px">${inT?`<button class="btn primary sm" id="pGrade">Enter results</button>`:''}${scan?statusBadge(pbfStatus(genderOf(s), numv(scan.pbf))):''}</div>
    </div>
    <div class="subtabs seg no-print" role="group" aria-label="${esc(s.name)}">${views.map(([k,l])=>`<button data-perview="${k}" aria-pressed="${k===v}">${l}</button>`).join('')}</div>
    <div id="perBody">${
      v==='scores' ? renderScoreCard(s,sc,true)+aftBarsHtml(s,sc)
      : v==='times' ? indivTimesHtml(s)
      : v==='health' ? `${STATE.pAddScan?`<div class="panel"><h2>Add a scan</h2>${pasteBoxHtml()}${scanFormHtml('pa-')}<div class="row" style="margin-top:14px"><button class="btn primary" id="paSave">Save scan</button><button class="btn" id="paCancel">Cancel</button></div><div id="paMsg" style="margin-top:10px"></div></div>`
          :''}<div class="stack">${weightPanelHtml(s)}${STATE.pAddScan?'':`<div class="row" style="justify-content:flex-end"><button class="btn primary sm" id="paOpen">Add an InBody scan</button></div>`}${healthProfileHtml(s,true,{noAdminBar:true,noPractice:true,compact:true})}</div>`
      : practicePanel(s, practiceSummary(s), true)
    }</div>
    <details class="manage person-manage no-print" ${STATE.manageOpen?'open':''}><summary>Manage ${esc(s.name)}</summary>${personManageHtml(s)}</details>
  </div>`;
  $('pBack').onclick=()=>{ STATE.personId=null; STATE.hTool=null; STATE.pAddScan=false; render(); window.scrollTo(0,0); };
  const pg=$('pGrade'); if(pg) pg.onclick=()=>goGrade('results', {gMode:'one', selectedId:s.id, newMode:false});
  c.querySelectorAll('[data-perview]').forEach(b=>b.onclick=()=>{ STATE.personView=b.dataset.perview; STATE.pAddScan=false; render(); });
  const md=c.querySelector('details.person-manage'); md.addEventListener('toggle',()=>{ STATE.manageOpen=md.open; });
  if(v==='times') wireIndivTimes(s);
  if(v==='health') wireWeightPanel(s);
  const po=$('paOpen'); if(po) po.onclick=()=>{ STATE.pAddScan=true; render(); const d=$('pa-date'); if(d) d.focus(); };
  const pc=$('paCancel'); if(pc) pc.onclick=()=>{ STATE.pAddScan=false; render(); };
  if($('paSave')){ const st={}; wirePasteFill('pa-'); $('paSave').onclick=()=>{ const scan=readScanForm('pa-', $('paMsg'), st); if(!scan) return; addScan(s, scan); STATE.pAddScan=false; toast(`Saved a scan for ${s.name}.`); render(); }; }
  wireHealthProfile(s, true);
}

// AFT points per event, 0 to 100: under 60 fails the event.
function aftBarsHtml(s, sc){
  if(!isOn('aft') || !EVENTS.some(e=>sc.ev[e.k]!=null)) return '';
  const L=EVENTS.filter(e=>sc.ev[e.k]!=null);
  return `<div class="panel"><h2>AFT points by event ${helpBtn('aftbar','About these colors')}</h2>${helpBox('aftbar','Each event is scored 0 to 100. Under 60 fails the event (red); 60 to 79 is yellow; 80 and up is green.')}
    ${barChart(L.map(e=>e.name), L.map(e=>sc.ev[e.k]), {y:'pct', label:'Points', good:v=>v>=80?'good':v>=60?'warn':'bad', after:i=>{ const e=L[i]; return fieldDisplay({type:e.time?'time':'int'}, s[e.k])+(e.time?'':' '+e.unit); }, short:true})}</div>`;
}

/* ============================== Grade ============================== */
// One place to enter results: one soldier or the whole team, each event's test screen, and (admin) weekend runs and rucks.
function gradeTabs(){
  const ev=testTabsOn().filter(t=>!['setup','rules','practice'].includes(t[0]));
  return [['results','Enter results'], ...ev, ...(isAdmin()?[['times','Runs & rucks']]:[])];
}
function renderGrade(c){
  const tabs=gradeTabs();
  if(STATE.gView!=='guide' && !tabs.some(t=>t[0]===STATE.gView)) STATE.gView='results';
  const v=STATE.gView;
  c.innerHTML=`<div class="grade-nav no-print"><div class="subtabs seg" role="group" aria-label="What you're grading">${tabs.map(([k,l])=>`<button data-gview="${k}" aria-pressed="${k===v}">${esc(l)}</button>`).join('')}</div>
    <button class="btn sm guide-btn" data-gview="guide" aria-pressed="${v==='guide'}" title="How to run the tryout and how it's scored">? Guide</button></div><div id="gBody"></div>`;
  c.querySelectorAll('[data-gview]').forEach(b=>b.onclick=()=>{ STATE.gView=b.dataset.gview; render(); });
  const body=$('gBody');
  if(v==='results') return gradeResults(body);
  if(v==='times') return renderWeekend(body);
  if(v==='guide'){ body.innerHTML='<div id="gGuide1"></div><div id="gGuide2" style="margin-top:16px"></div>'; testSetup($('gGuide1')); testRules($('gGuide2')); return; }
  STATE.testTab=v; renderTestBody(body, v);
}
function gradeResults(el){
  const m=STATE.gMode==='team'?'team':'one';
  el.innerHTML=`<div class="row" style="margin-bottom:12px">${segHtml('gmode', [['one','One soldier'],['team','Whole team']], m, 'Enter results for')}</div><div id="gResBody"></div>`;
  el.querySelectorAll('[data-gmode]').forEach(b=>b.onclick=()=>{ STATE.gMode=b.dataset.gmode; render(); });
  const body=$('gResBody');
  if(m==='team') renderTeam(body); else renderOne(body);
}

load();
rebuildRegistry();
restoreSession();
render();
</script>
